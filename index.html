A partir de la siguiente transcripción hablada de la explicación del docente en clase, genera un resumen estructurado, claro y didáctico para los estudiantes que incluya:
1. Ideas Clave Explicadas por el Docente (viñetas claras).
2. Conceptos Fundamentales Mencionados.
3. Recomendaciones o Acciones para los Estudiantes.

Transcripción del docente:
"""
${text}
"""`;
      const aiText = await callGeminiTextOrHtml(prompt, 0.35);
      if (aiText) return aiText;

      const cleanSentences = text
        .replace(/\s+/g, ' ')
        .split(/(?<=[.?!;])\s+|\n+/)
        .map(s => s.trim())
        .filter(s => s.length > 8);

      const words = text
        .toLowerCase()
        .replace(/[^a-záéíóúñü0-9\s]/gi, '')
        .split(/\s+/)
        .filter(w => w.length > 5 && !['porque', 'cuando', 'también', 'entonces', 'vamos', 'tienen', 'pueden', 'dentro', 'sobre', 'donde', 'estamos', 'hacer', 'manera'].includes(w));

      const freq = {};
      words.forEach(w => { freq[w] = (freq[w] || 0) + 1; });
      const topKeywords = Object.entries(freq)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 6)
        .map(([w]) => w.charAt(0).toUpperCase() + w.slice(1));

      const keyPoints = cleanSentences.slice(0, 5).map(s => `• ${s.endsWith('.') ? s : s + '.'}`);
      const actionSentences = cleanSentences.filter(s =>
        /tarea|práctica|entreg|realiz|investig|estudi|recuerd|importan|examen|proyecto|calcular|subir/i.test(s)
      );

      return [
        `📌 RESUMEN EJECUTIVO DE LA EXPLICACIÓN (${sequenceTitle})`,
        ``,
        `🔹 Puntos Clave Explicados por el Docente:`,
        ...(keyPoints.length ? keyPoints : [`• ${text}`]),
        ``,
        `🧠 Conceptos Centrales Detectados:`,
        topKeywords.length ? `• ${topKeywords.join(' · ')}` : `• Contenidos fundamentales de ${sequenceTitle}`,
        ``,
        `✅ Indicaciones y Seguimiento para el Estudiante:`,
        ...(actionSentences.length
          ? actionSentences.slice(0, 3).map(s => `• ${s}`)
          : [`• Repasar los puntos expuestos en esta secuencia y consultar los materiales adjuntos.`])
      ].join('\n');
    }

        () => {
          const rawEl = document.getElementById('inp-teacher-raw');

          const interimEl = document.getElementById('live-interim-preview');
          const pillEl = document.getElementById('mic-status-pill');
          const btnStart = document.getElementById('btn-start-mic');
          const btnStop = document.getElementById('btn-stop-mic');
          const btnAi = document.getElementById('btn-generate-ai-summary');

          document.getElementById('btn-cancel-tr').addEventListener('click', closeModal);

          document.getElementById('btn-save-gemini-key').addEventListener('click', () => {
            saveGeminiApiKey(document.getElementById('inp-gemini-key').value);
            showToast('Clave Gemini guardada en este navegador', 'success');
          });

          document.getElementById('btn-clear-transcript').addEventListener('click', () => {
            rawEl.value = '';
            sumEl.value = '';
            interimEl.textContent = '';
          });

          function setMicUiClosed(label = 'Micrófono cerrado') {
            pillEl.textContent = label;
            pillEl.className = 'shrink-0 px-2.5 py-1 rounded-full text-[11px] font-bold bg-slate-200 text-slate-700';
            btnStart.classList.remove('hidden');
            btnStop.classList.add('hidden');
            interimEl.textContent = '';
          }

          function startContinuousRecognition() {
            if (!keepMicOpenFlag || !document.getElementById('inp-teacher-raw')) return;

            if (activeSpeechRecognition) {
              try {
                activeSpeechRecognition.onend = null;
                activeSpeechRecognition.onerror = null;
                activeSpeechRecognition.stop();
              } catch (e) {}
              activeSpeechRecognition = null;
            }

            const rec = new SpeechRec();
            activeSpeechRecognition = rec;
            rec.lang = 'es-MX';
            rec.continuous = true;
            rec.interimResults = true;

            rec.onstart = () => {
              pillEl.textContent = '🔴 Micrófono abierto · Escuchando...';
              pillEl.className = 'shrink-0 px-2.5 py-1 rounded-full text-[11px] font-bold bg-rose-600 text-white mic-recording';
              btnStart.classList.add('hidden');
              btnStop.classList.remove('hidden');
            };

            rec.onresult = event => {
              let interimTranscript = '';
              let finalChunk = '';
              for (let i = event.resultIndex; i < event.results.length; i++) {
                const txt = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                  finalChunk += txt + ' ';
                } else {
                  interimTranscript += txt;
                }
              }
              if (finalChunk) {
                rawEl.value = (rawEl.value ? rawEl.value.trim() + ' ' : '') + finalChunk.trim();
                rawEl.scrollTop = rawEl.scrollHeight;
              }
              interimEl.textContent = interimTranscript ? `Escuchando: "${interimTranscript}"` : '';
            };

            rec.onerror = event => {
              const err = event && event.error ? event.error : '';
              if (err === 'not-allowed' || err === 'service-not-allowed' || err === 'audio-capture') {
                keepMicOpenFlag = false;
                stopActiveSpeechRecognition();
                setMicUiClosed('Permiso de micrófono denegado');
                showToast('No se pudo acceder al micrófono. Revisa los permisos del navegador.', 'error');
                return;
              }
              // Ante pausas de silencio ('no-speech') o cortes temporales, mantener el micrófono abierto
              if (keepMicOpenFlag) {
                pillEl.textContent = '🔴 Micrófono abierto · Esperando voz...';
                pillEl.className = 'shrink-0 px-2.5 py-1 rounded-full text-[11px] font-bold bg-rose-600 text-white mic-recording';
              }
            };

            rec.onend = () => {
              activeSpeechRecognition = null;
              interimEl.textContent = '';
              if (keepMicOpenFlag && document.getElementById('inp-teacher-raw')) {
                // Reiniciar automáticamente para que el micrófono no se cierre hasta que el docente lo decida
                if (micRestartTimer) clearTimeout(micRestartTimer);
                micRestartTimer = setTimeout(() => {
                  if (keepMicOpenFlag && document.getElementById('inp-teacher-raw')) {
                    startContinuousRecognition();
                  }
                }, 250);
              } else {
                setMicUiClosed('Micrófono cerrado');
              }
            };

            try {
              rec.start();
            } catch (e) {
              if (keepMicOpenFlag) {
                if (micRestartTimer) clearTimeout(micRestartTimer);
                micRestartTimer = setTimeout(() => {
                  if (keepMicOpenFlag && document.getElementById('inp-teacher-raw')) {
                    startContinuousRecognition();
                  }
                }, 400);
              }
            }
          }

          btnStart.addEventListener('click', () => {
            if (!SpeechRec) {
              showToast('Tu navegador no soporta dictado directo por voz. Usa Chrome o Edge, o escribe el texto.', 'error');
              return;
            }
            keepMicOpenFlag = true;
            btnStart.classList.add('hidden');
            btnStop.classList.remove('hidden');
            pillEl.textContent = '🔴 Abriendo micrófono...';
            pillEl.className = 'shrink-0 px-2.5 py-1 rounded-full text-[11px] font-bold bg-rose-600 text-white mic-recording';
            startContinuousRecognition();
          });

          btnStop.addEventListener('click', () => {
            stopActiveSpeechRecognition();
            setMicUiClosed('Micrófono cerrado por el docente');
            showToast('Micrófono cerrado', 'info');
          });

          btnStop.addEventListener('click', () => {
            stopActiveSpeechRecognition();

          btnAi.addEventListener('click', async () => {
            const rawText = rawEl.value.trim();

              showToast('Primero graba con el micrófono o escribe la explicación del docente.', 'error');

              showToast('Resumen generado con éxito', 'success');
            } finally {
              btnAi.disabled = false;
              btnAi.innerHTML = '<span>✨ Generar Resumen con Gemini IA</span>';
            }
          });

          document.getElementById('btn-save-tr').addEventListener('click', async () => {
            stopActiveSpeechRecognition();
            const liveCourse = getCourseById(courseId);
            const liveMod = (liveCourse?.modules || []).find(m => m.id === moduleId);

            const rawText = rawEl.value.trim();

            }

            liveMod.teacherTranscript = {

              summary: summaryText,
              updatedAt: now
            };
            liveMod.updatedAt = now;
            liveCourse.updatedAt = now;

            closeModal();
            renderMain();
            await saveState(true);
            showToast('Transcripción y resumen del maestro publicados en tiempo real', 'success');
          });

    function openStudentAttendanceScannerModal(courseContext = null) {
      if (!appState.session || appState.session.role !== 'student') return;
      const activeStudent = getStudentById(appState.session.user.id) || appState.session.user;
      const modalHeading = courseContext
        ? `Registrar Asistencia QR · ${courseContext.title}`
        : 'Registrar Asistencia por QR';

      openModal(
        modalHeading,
        `<div id="scanner-view-body" class="space-y-4">
          ${
            courseContext
              ? `<div class="p-3 rounded-xl bg-indigo-50 border border-indigo-200 text-xs text-indigo-900">
                  Registrando asistencia diaria en la materia <strong>${esc(courseContext.title)} (${esc(courseContext.code)})</strong>.
                </div>`
              : ''
          }
          <p class="text-xs text-slate-600">Escanea el código QR proyectado por tu profesor o pega el código manual de esta materia.</p>
          <div id="qr-reader" class="w-full rounded-xl overflow-hidden border border-slate-300 bg-slate-900 min-h-[240px]"></div>
          <div class="pt-2 border-t border-slate-200">
            <label class="block text-xs font-bold text-slate-700 mb-1">¿Sin cámara? Ingresa el código manual:</label>
            <div class="flex gap-2">
              <input id="inp-manual-qr" type="text" placeholder="PUMA_ASISTENCIA|..." class="flex-1 px-3 py-2 rounded-xl border border-slate-300 text-xs font-mono" />
              <button id="btn-submit-manual-qr" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold cursor-pointer">Validar</button>
            </div>
          </div>
        </div>`,
        () => {
          syncNow({ push: false, silent: true });

          async function handleCode(rawText) {
            const parts = String(rawText || '').trim().split('|');
            if (parts[0] !== 'PUMA_ASISTENCIA' || parts.length < 3) {
              showToast('Código QR no válido para asistencia', 'error');
              return;
            }
            const scannedCourseId = parts[1];
            const scannedDate = parts[2];

            if (courseContext && scannedCourseId !== courseContext.id) {
              const otherCourse = getCourseById(scannedCourseId);
              showToast(
                `Este código QR pertenece a "${otherCourse ? otherCourse.title : scannedCourseId}". Entra a esa materia para registrar tu asistencia.`,
                'error'
              );
              return;
            }

            stopActiveQrScanner();

            await syncNow({ push: false, silent: true });
            const targetCourse = getCourseById(scannedCourseId) || courseContext;
            const attKey = `${scannedCourseId}|${scannedDate}|${activeStudent.id}`;

            if (appState.db.meta.deletedAttendance) {
              delete appState.db.meta.deletedAttendance[attKey];
            }

            if (targetCourse && !targetCourse.enrolledStudentIds.includes(activeStudent.id)) {
              targetCourse.enrolledStudentIds.push(activeStudent.id);
            }

            const existing = (appState.db.attendance || []).find(
              a => a.courseId === scannedCourseId && a.date === scannedDate && a.studentId === activeStudent.id
            );
            const nowTs = Date.now();
            if (existing) {
              existing.createdAtTs = nowTs;
              existing.time = getNowTimeShort();
            } else {
              appState.db.attendance.push({
                id: uid('att'),
                courseId: scannedCourseId,
                courseTitle: targetCourse ? targetCourse.title : scannedCourseId,
                studentId: activeStudent.id,
                studentName: activeStudent.name,
                date: scannedDate,
                time: getNowTimeShort(),
                createdAtTs: nowTs
              });
            }

            const body = document.getElementById('scanner-view-body');

              </div>

              <div>
                <div class="flex items-center justify-between mb-1">
                  <label class="block text-xs font-bold text-slate-700">Instrucciones y Rúbrica en Hipertexto</label>
                  <div class="flex items-center gap-1 bg-slate-100 p-0.5 rounded-lg text-[11px]">
                    <button type="button" id="tab-ass-preview" class="px-2.5 py-1 rounded-md bg-white shadow-2xs font-bold text-slate-900 cursor-pointer">👁 Vista Previa</button>
                    <button type="button" id="tab-ass-code" class="px-2.5 py-1 rounded-md font-semibold text-slate-600 cursor-pointer">Código HTML</button>
                  </div>
                </div>
                <div id="ass-preview-box" class="min-h-[170px] max-h-64 overflow-y-auto p-3.5 rounded-xl border border-slate-300 bg-white">
                  ${renderHypertextBlock(existingAss?.instructions || '<p class="text-slate-400 italic">Aquí aparecerá la vista previa de las instrucciones y rúbrica en hipertexto...</p>')}
                </div>
                <textarea id="ass-inst" rows="7" required placeholder="<p>Redacta las consignas o usa Gemini IA...</p>" class="hidden w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-mono">${esc(existingAss?.instructions || '')}</textarea>
              </div>

              <div class="flex justify-end gap-2 pt-2 border-t">
                <button type="button" id="btn-cancel-ass" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-semibold cursor-pointer">Cancelar</button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold cursor-pointer">Guardar Actividad en Secuencia</button>
              </div>
            </form>`,
            () => {
              const instEl = document.getElementById('ass-inst');
              const previewBox = document.getElementById('ass-preview-box');
              const tabPreview = document.getElementById('tab-ass-preview');
              const tabCode = document.getElementById('tab-ass-code');

              const updatePreview = () => {
                previewBox.innerHTML = renderHypertextBlock(
                  instEl.value.trim() || '<p class="text-slate-400 italic">Sin instrucciones aún...</p>'
                );
              };

              tabPreview.addEventListener('click', () => {
                updatePreview();
                previewBox.classList.remove('hidden');
                instEl.classList.add('hidden');
                tabPreview.className = 'px-2.5 py-1 rounded-md bg-white shadow-2xs font-bold text-slate-900 cursor-pointer';
                tabCode.className = 'px-2.5 py-1 rounded-md font-semibold text-slate-600 cursor-pointer';
              });

              tabCode.addEventListener('click', () => {
                instEl.classList.remove('hidden');
                previewBox.classList.add('hidden');
                tabCode.className = 'px-2.5 py-1 rounded-md bg-white shadow-2xs font-bold text-slate-900 cursor-pointer';
                tabPreview.className = 'px-2.5 py-1 rounded-md font-semibold text-slate-600 cursor-pointer';
              });

              instEl.addEventListener('input', updatePreview);
              document.getElementById('btn-cancel-ass').addEventListener('click', closeModal);

              document.getElementById('btn-ai-gen-ass').addEventListener('click', async () => {
                const btnAi = document.getElementById('btn-ai-gen-ass');
                const titleVal = document.getElementById('ass-title').value.trim();
                const ptsVal = Number(document.getElementById('ass-pts').value || 100);
                const extraVal = document.getElementById('ass-ai-prompt').value.trim();

                if (!titleVal && !extraVal) {
                  showToast('Escribe el título de la actividad o una breve descripción primero', 'error');
                  return;
                }
                btnAi.disabled = true;
                btnAi.textContent = '⏳ Redactando consigna y rúbrica con Gemini IA...';
                try {
                  const html = await generateHypertextAssignmentWithAI({
                    courseTitle: liveCourse.title,
                    sequenceTitle: liveMod.title,
                    assignTitle: titleVal || extraVal,
                    maxPoints: ptsVal,
                    extraPrompt: extraVal
                  });
                  instEl.value = html;
                  updatePreview();
                  showToast('Instrucciones y rúbrica en hipertexto generadas', 'success');
                } finally {
                  btnAi.disabled = false;
                  btnAi.textContent = '✨ Redactar instrucciones y rúbrica en hipertexto con Gemini IA';
                }
              });

              document.getElementById('form-add-ass').addEventListener('submit', async e => {
                e.preventDefault();
                const currentCourse = getCourseById(course.id);
                const currentMod = (currentCourse?.modules || []).find(m => m.id === modId);
                if (!currentMod) return;
                const now = Date.now();
                const cleanHtml = sanitizeHypertextHtml(instEl.value.trim());

                if (existingAss) {
                  const targetAss = (currentMod.assignments || []).find(a => a.id === existingAss.id);
                  if (targetAss) {
                    targetAss.title = document.getElementById('ass-title').value.trim();
                    targetAss.instructions = cleanHtml;
                    targetAss.dueDate = document.getElementById('ass-due').value;
                    targetAss.maxPoints = Number(document.getElementById('ass-pts').value || 100);
                    targetAss.updatedAt = now;
                  }
                } else {
                  currentMod.assignments.push({
                    id: uid('ass'),
                    title: document.getElementById('ass-title').value.trim(),
                    instructions: cleanHtml,
                    dueDate: document.getElementById('ass-due').value,
                    maxPoints: Number(document.getElementById('ass-pts').value || 100),
                    updatedAt: now
                  });
                }
                currentMod.updatedAt = now;
                currentCourse.updatedAt = now;
                closeModal();
                renderCourseDetail();
                await saveState(true);
                showToast('Actividad en hipertexto publicada y sincronizada', 'success');
              });
            },
            'max-w-2xl'
          );
        }

        tabPanel.querySelectorAll('[data-add-ass]').forEach(btn => {
          btn.addEventListener('click', () => {
            openAssignmentHypertextModal(btn.getAttribute('data-add-ass'), null);
          });
        });

        tabPanel.querySelectorAll('[data-edit-ass]').forEach(btn => {
          btn.addEventListener('click', () => {
            const [modId, assId] = btn.getAttribute('data-edit-ass').split('|');
            const liveCourse = getCourseById(course.id);
            const liveMod = (liveCourse?.modules || []).find(m => m.id === modId);
            const existingAss = (liveMod?.assignments || []).find(a => a.id === assId);
            if (existingAss) openAssignmentHypertextModal(modId, existingAss);
          });
        });

        tabPanel.querySelectorAll('[data-submit-ass]').forEach(btn => {
          btn.addEventListener('click', () => {
            const assId = btn.getAttribute('data-submit-ass');
            const prevSub = getSubmission(course.id, assId, userId);
            openModal(
              'Entregar Actividad',
              `<form id="form-sub-ass" class="space-y-3">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Enlace o respuesta de tu entrega</label>
                  <textarea id="sub-content" rows="4" required placeholder="Pega el enlace a Google Drive/Canva o escribe tu desarrollo..." class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs">${esc(prevSub?.content || '')}</textarea>
                </div>
                <div class="flex justify-end">
                  <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold cursor-pointer">Enviar Entrega</button>
                </div>
              </form>`,
              () => {
                document.getElementById('form-sub-ass').addEventListener('submit', async e => {
                  e.preventDefault();
                  const content = document.getElementById('sub-content').value.trim();
                  const now = Date.now();
                  if (prevSub) {
                    prevSub.content = content;
                    prevSub.submittedAt = getTodayFormatted();
                    prevSub.updatedAt = now;
                  } else {
                    appState.db.submissions.push({
                      id: uid('sub'),
                      courseId: course.id,
                      assignmentId: assId,
                      studentId: userId,
                      studentName: appState.session.user.name,
                      content,
                      grade: null,
                      submittedAt: getTodayFormatted(),
                      updatedAt: now
                    });
                  }
                  closeModal();
                  renderCourseDetail();
                  await saveState(false);
                  showToast('Entrega enviada y sincronizada', 'success');
                });
              }
            );
          });
        });

        tabPanel.querySelectorAll('[data-grade-ass]').forEach(btn => {
          btn.addEventListener('click', () => {
            const assId = btn.getAttribute('data-grade-ass');
            const subs = (appState.db.submissions || []).filter(s => s.courseId === course.id && s.assignmentId === assId);
            openModal(
              'Calificar Entregas de la Actividad',
              `<div class="space-y-3">
                ${
                  subs.length === 0
                    ? `<p class="text-xs text-slate-500">Ningún estudiante ha enviado esta actividad todavía.</p>`
                    : subs
                        .map(
                          s => `<div class="p-3 rounded-xl border border-slate-200 bg-slate-50 space-y-2">
                            <div class="flex justify-between text-xs">
                              <strong>${esc(s.studentName)}</strong>
                              <span class="text-slate-400">${esc(s.submittedAt)}</span>
                            </div>
                            <p class="text-xs text-slate-700 bg-white p-2 rounded-lg border">${esc(s.content)}</p>
                            <div class="flex items-center gap-2">
                              <input type="number" min="0" max="100" data-grade-inp="${esc(s.id)}" value="${s.grade ?? ''}" placeholder="Calificación (0-100)" class="px-2.5 py-1 rounded-lg border text-xs w-36" />
                              <button data-save-grade="${esc(s.id)}" class="px-3 py-1 rounded-lg bg-indigo-600 text-white text-xs font-bold cursor-pointer">Guardar</button>
                            </div>
                          </div>`
                        )
                        .join('')
                }
              </div>`,
              () => {
                document.querySelectorAll('[data-save-grade]').forEach(b => {
                  b.addEventListener('click', async () => {
                    const subId = b.getAttribute('data-save-grade');
                    const inp = document.querySelector(`[data-grade-inp="${subId}"]`);
                    const sub = (appState.db.submissions || []).find(x => x.id === subId);
                    if (sub && inp) {
                      sub.grade = inp.value === '' ? null : Number(inp.value);
                      sub.updatedAt = Date.now();
                      await saveState(false);
                      showToast('Calificación guardada', 'success');
                    }
                  });
                });
              }
            );
          });
        });
      }

      // -------------------- PESTAÑA 2: LIBRO DE CALIFICACIONES (100 PTS) --------------------
      if (appState.courseTab === 'gradebook') {
        const cfg = course.gradingConfig;
        const productsWeightSum = (course.products || []).reduce((acc, p) => acc + Number(p.weight || 0), 0);
        const totalConfigured = Number(cfg.platformWeight || 0) + Number(cfg.attendanceWeight || 0) + productsWeightSum;

        if (!isAdmin) {
          const ev = calculateStudentCourseEvaluation(course, userId);
          tabPanel.innerHTML = `
            <div class="bg-white rounded-2xl border border-slate-200 p-6 space-y-4">

                <div>

                  <p class="text-xs text-slate-500">Ponderación configurada sobre 100 puntos</p>

                <div class="text-right">
                  <span class="text-xs text-slate-400 block">Calificación Final</span>
                  <span class="text-3xl font-extrabold text-indigo-700">${ev.finalGrade.toFixed(1)} <span class="text-sm">/ 100</span></span>
                </div>
              </div>
              <div class="grid md:grid-cols-3 gap-3 text-xs">
                <div class="p-4 rounded-xl bg-blue-50 border border-blue-200">
                  <p class="font-bold text-blue-950">Plataforma (${ev.platformWeight}%)</p>
                  <p class="text-xl font-extrabold text-blue-700 mt-1">${ev.platformWeighted.toFixed(1)} pts</p>
                </div>
                <div class="p-4 rounded-xl bg-emerald-50 border border-emerald-200">
                  <p class="font-bold text-emerald-950">Asistencia en Materia (${ev.attendanceWeight}%)</p>
                  <p class="text-xl font-extrabold text-emerald-700 mt-1">${ev.attendanceWeighted.toFixed(1)} pts</p>
                  <p class="text-[11px] text-emerald-700 mt-0.5">${ev.studentAttendanceCount} de ${ev.effectiveTotalDays} días efectivos</p>
                </div>
                <div class="p-4 rounded-xl bg-amber-50 border border-amber-200">
                  <p class="font-bold text-amber-950">Productos Evaluables (${ev.productsWeightSum}%)</p>
                  <p class="text-xl font-extrabold text-amber-700 mt-1">${ev.productsWeightedTotal.toFixed(1)} pts</p>
                </div>
              </div>
            </div>
          `;
        } else {
          tabPanel.innerHTML = `
            <div class="space-y-4">
              <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <h3 class="font-bold text-sm text-slate-900">Configuración de Ponderación y Productos Independientes</h3>
                    <p class="text-xs text-slate-500">Suma total actual: <strong class="${totalConfigured === 100 ? 'text-emerald-600' : 'text-rose-600'}">${totalConfigured}% de 100%</strong></p>
                  </div>
                  <button id="btn-add-product" class="px-3.5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold cursor-pointer">+ Nuevo Producto Evaluable</button>
                </div>

                <div class="grid sm:grid-cols-3 gap-3 text-xs">
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">% Actividades en Plataforma</label>
                    <input id="inp-w-platform" type="number" min="0" max="100" value="${cfg.platformWeight}" class="w-full px-3 py-2 rounded-xl border border-slate-300" />
                  </div>
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">% Asistencia de la Materia</label>
                    <input id="inp-w-attendance" type="number" min="0" max="100" value="${cfg.attendanceWeight}" class="w-full px-3 py-2 rounded-xl border border-slate-300" />
                  </div>
                  <div class="flex items-end">
                    <button id="btn-save-weights" class="w-full py-2 rounded-xl bg-slate-900 text-white font-bold cursor-pointer">Guardar Ponderación Base</button>
                  </div>
                </div>

                <div class="space-y-2 pt-2 border-t">
                  <p class="text-xs font-bold text-slate-700">Productos Evaluables (Independientes de las Secuencias):</p>
                  ${(course.products || [])
                    .map(
                      p => `<div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border text-xs">
                        <span><strong>${esc(p.title)}</strong> (${Number(p.weight)}%) — <span class="text-slate-500">${esc(p.description)}</span></span>
                        <button data-del-prod="${esc(p.id)}" class="text-rose-600 font-bold px-2 cursor-pointer">Eliminar</button>
                      </div>`
                    )
                    .join('')}
                </div>
              </div>

              <div class="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
                <table class="w-full text-xs text-left">
                  <thead class="bg-slate-900 text-white">
                    <tr>
                      <th class="p-3">Estudiante</th>
                      <th class="p-3">Plataforma (${cfg.platformWeight}%)</th>
                      <th class="p-3">Asistencia (${cfg.attendanceWeight}%)</th>
                      ${(course.products || []).map(p => `<th class="p-3">${esc(p.title)} (${p.weight}%)</th>`).join('')}
                      <th class="p-3 font-extrabold text-amber-300">Final (100)</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y">
                    ${enrolledStudents
                      .map(stu => {
                        const ev = calculateStudentCourseEvaluation(course, stu.id);
                        return `<tr>
                          <td class="p-3 font-bold">${esc(stu.name)}</td>
                          <td class="p-3">${ev.platformWeighted.toFixed(1)} pts</td>
                          <td class="p-3">${ev.attendanceWeighted.toFixed(1)} pts (${ev.studentAttendanceCount}/${ev.effectiveTotalDays})</td>
                          ${(course.products || [])
                            .map(p => {
                              const val = getProductScoreValue(course, p.id, stu.id);
                              return `<td class="p-3">
                                <input type="number" min="0" max="100" data-prod-grade="${esc(p.id)}|${esc(stu.id)}" value="${val !== null ? val : ''}" placeholder="0-100" class="w-20 px-2 py-1 rounded border text-xs" />
                              </td>`;
                            })
                            .join('')}
                          <td class="p-3 font-extrabold text-indigo-700 text-sm">${ev.finalGrade.toFixed(1)}</td>
                        </tr>`;
                      })
                      .join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `;

          document.getElementById('btn-save-weights').addEventListener('click', async () => {
            course.gradingConfig.platformWeight = Number(document.getElementById('inp-w-platform').value || 0);
            course.gradingConfig.attendanceWeight = Number(document.getElementById('inp-w-attendance').value || 0);
            course.gradingConfig.updatedAt = Date.now();
            course.updatedAt = Date.now();
            renderCourseDetail();
            await saveState(true);
            showToast('Ponderación actualizada', 'success');
          });

          document.getElementById('btn-add-product').addEventListener('click', () => {
            openModal(
              'Nuevo Producto Evaluable',
              `<form id="form-new-prod" class="space-y-3">
                <div>
                  <label class="block text-xs font-bold mb-1">Nombre del Producto</label>
                  <input id="prod-title" type="text" required class="w-full px-3 py-2 rounded-xl border text-xs" />

                <div>

                </div>
                <button type="submit" class="w-full py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold cursor-pointer">Agregar Producto</button>
              </form>`,
              () => {
                document.getElementById('form-new-prod').addEventListener('submit', async e => {
                  e.preventDefault();
                  const now = Date.now();
                  course.products.push({
                    id: uid('prod'),
                    title: document.getElementById('prod-title').value.trim(),
                    weight: Number(document.getElementById('prod-weight').value || 0),
                    description: document.getElementById('prod-desc').value.trim(),
                    updatedAt: now
                  });
                  course.updatedAt = now;
                  closeModal();
                  renderCourseDetail();
                  await saveState(true);
                });
              }
            );
          });

          tabPanel.querySelectorAll('[data-del-prod]').forEach(btn => {
            btn.addEventListener('click', async () => {
              const pid = btn.getAttribute('data-del-prod');
              appState.db.meta.deletedProducts[pid] = Date.now() + 1000;
              course.products = (course.products || []).filter(p => p.id !== pid);
              course.updatedAt = Date.now();
              renderCourseDetail();
              await saveState(true);
            });
          });

          tabPanel.querySelectorAll('[data-prod-grade]').forEach(inp => {
            inp.addEventListener('change', async () => {
              const [pid, sid] = inp.getAttribute('data-prod-grade').split('|');
              setProductScoreValue(course, pid, sid, inp.value);
              course.updatedAt = Date.now();
              renderCourseDetail();
              await saveState(true);
            });
          });
        }
      }

      // -------------------- PESTAÑA 3: LIBRO DE ASISTENCIA POR MATERIA --------------------
      if (appState.courseTab === 'attendance') {
        const courseAtt = (appState.db.attendance || []).filter(a => a.courseId === course.id && a.studentId !== 'admin');

        if (!isAdmin) {
          const myRecs = courseAtt.filter(a => a.studentId === userId);
          const todayStr = getTodayFormatted();
          const hasToday = myRecs.some(a => a.date === todayStr);

          tabPanel.innerHTML = `
            <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-4 shadow-xs">
              <div class="flex flex-wrap items-center justify-between gap-3 border-b pb-4">
                <div>
                  <h3 class="font-bold text-sm sm:text-base text-slate-900">📋 Mi Asistencia en ${esc(course.title)}</h3>
                  <p class="text-xs text-slate-500">Horario oficial Hermosillo, Sonora (${esc(todayStr)}) · 1 asistencia diaria por materia.</p>
                </div>
                <button id="btn-stu-att-tab-qr" class="px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 text-xs font-extrabold cursor-pointer">
                  📷 ${hasToday ? 'Asistencia de Hoy Registrada (Re-escanear)' : 'Escanear QR de esta Materia'}
                </button>
              </div>
              <div class="flex items-center gap-3 text-xs">
                <span class="px-3 py-1.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 font-bold">Total días presente: ${myRecs.length}</span>
                <span class="px-3 py-1.5 rounded-xl ${hasToday ? 'bg-emerald-100 text-emerald-900' : 'bg-amber-100 text-amber-900'} font-bold">
                  Hoy (${esc(todayStr)}): ${hasToday ? '✓ Presente' : 'Pendiente'}
                </span>
              </div>
              <div>
                <h4 class="text-xs font-bold text-slate-700 mb-2">Fechas registradas en ${esc(course.title)}:</h4>
                ${
                  myRecs.length === 0
                    ? `<p class="text-xs text-slate-400 italic">Aún no tienes asistencias registradas en esta materia.</p>`
                    : `<div class="flex flex-wrap gap-2">
                        ${myRecs
                          .map(
                            r => `<span class="px-3 py-1 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs font-semibold">✓ ${esc(r.date)} · ${esc(r.time || '')} hrs</span>`
                          )
                          .join('')}
                      </div>`
                }
              </div>
            </div>
          `;
          document.getElementById('btn-stu-att-tab-qr').addEventListener('click', () => openStudentAttendanceScannerModal(course));
          return;
        }

        const selectedDate = appState.calSelectedDate || getTodayFormatted();
        const dayRecords = courseAtt.filter(a => a.date === selectedDate);
        const presentSet = new Set(dayRecords.map(a => a.studentId));
        const pendingStudents = enrolledStudents.filter(s => !presentSet.has(s.id));

        tabPanel.innerHTML = `
          <div class="space-y-5">
            <!-- Encabezado y controles diarios exclusivos de esta materia -->
            <div class="bg-white rounded-2xl border border-slate-200 p-5 flex flex-wrap items-center justify-between gap-3 shadow-xs">
              <div>
                <h3 class="font-extrabold text-sm sm:text-base text-slate-900">📋 Toma de Asistencia · ${esc(course.title)}</h3>
                <p class="text-xs text-slate-500">Zona horaria Hermosillo, Sonora (${esc(getTodayFormatted())}) · 1 asistencia diaria exclusiva para esta materia.</p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <label class="text-xs font-bold text-slate-600">Fecha:</label>
                <input id="inp-course-att-date" type="date" value="${esc(selectedDate)}" class="px-3 py-2 rounded-xl border border-slate-300 text-xs font-bold" />
                <button id="btn-course-tab-qr" class="px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 text-xs font-extrabold shadow-xs cursor-pointer">
                  📷 Proyectar QR de ${esc(course.code)}
                </button>
              </div>
            </div>

            <!-- Panel diario: Pendientes arriba/izquierda para toma manual + Presentes con eliminar -->
            <div class="grid lg:grid-cols-2 gap-4">
              <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 space-y-3">
                <div class="flex items-center justify-between">
                  <h4 class="font-extrabold text-xs sm:text-sm text-amber-950">⏳ Pendientes por capturar (${pendingStudents.length})</h4>
                  <span class="text-[11px] font-bold text-amber-800">${esc(selectedDate)}</span>
                </div>

    function exportCourseGradesToCsv(course) {
      if (!course) return;
      normalizeCourseGrading(course);
      const cfg = course.gradingConfig;
      const enrolledStudents = (appState.db.students || []).filter(
        s => !isDemoStudentRecord(s) && (course.enrolledStudentIds || []).includes(s.id)
      );
      const headers = [
        'Estudiante',
        'Usuario',
        'Grupo',
        `Plataforma (${cfg.platformWeight}%)`,
        `Asistencia (${cfg.attendanceWeight}%)`,
        ...(course.products || []).map(p => `${p.title} (${p.weight}%)`),
        'Calificacion Final (100)'
      ];
      const rows = enrolledStudents.map(stu => {
        const ev = calculateStudentCourseEvaluation(course, stu.id);
        return [
          `"${String(stu.name || '').replace(/"/g, '""')}"`,
          `"${String(stu.username || '').replace(/"/g, '""')}"`,
          `"${String(stu.group || '').replace(/"/g, '""')}"`,
          ev.platformWeighted.toFixed(1),
          ev.attendanceWeighted.toFixed(1),
          ...(course.products || []).map(p => {
            const val = getProductScoreValue(course, p.id, stu.id);
            return val !== null ? val : 0;
          }),
          ev.finalGrade.toFixed(1)
        ].join(',');
      });
      const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Calificaciones_${course.code || course.id}_${getTodayFormatted()}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Archivo CSV de calificaciones descargado', 'success');
    }

              showToast('Ese usuario está reservado', 'error');
              return;
            }
            const duplicate = (appState.db.students || []).find(
              s => s.username.toLowerCase() === username.toLowerCase() && (!existingStu || s.id !== existingStu.id)
            );
            if (duplicate) {
              showToast('Ya existe un estudiante con ese nombre de usuario', 'error');
              return;
            }

            const now = Date.now();
            let studentId = existingStu ? existingStu.id : uid('stu');
            if (existingStu) {
              const liveStu = getStudentById(existingStu.id);
              if (liveStu) {
                liveStu.name = name;
                liveStu.username = username;
                liveStu.phone = phone;
                liveStu.password = password;
                liveStu.accessCode = password.toUpperCase();
                liveStu.group = primaryGroup;
                liveStu.groups = Array.from(new Set(checkedGroups));
                liveStu.updatedAt = now;
              }
            } else {
              const newStu = normalizeStudentRecord({
                id: studentId,
                name,
                username,
                phone,
                password,
                accessCode: password.toUpperCase(),
                group: primaryGroup,
                groups: Array.from(new Set(checkedGroups)),
                updatedAt: now
              });
              appState.db.students.push(newStu);
            }

            (appState.db.courses || []).forEach(c => {
              const currentlyIn = (c.enrolledStudentIds || []).includes(studentId);
              if (selectedCourseIds.has(c.id) && !currentlyIn) {
                c.enrolledStudentIds.push(studentId);
                c.updatedAt = now;
              } else if (!selectedCourseIds.has(c.id) && currentlyIn) {
                c.enrolledStudentIds = c.enrolledStudentIds.filter(id => id !== studentId);
                c.updatedAt = now;
              }
            });

            closeModal();
            renderMain();
            await saveState(true);
            showToast(existingStu ? 'Estudiante actualizado y sincronizado' : 'Estudiante registrado y sincronizado', 'success');
          });
        },
        'max-w-xl'
      );
    }

          renderMain();
          await saveState(false);
          showToast('Entrega calificada y sincronizada', 'success');
        });
      });
    }

            `¿Deseas eliminar permanentemente la materia "${target.title}" en todos los dispositivos?`,

              const now = Date.now() + 5000;
              appState.db.meta.deletedCourses[cid] = now;
              savePersistedDeletedCourses(appState.db.meta.deletedCourses);
              appState.db.courses = (appState.db.courses || []).filter(c => c.id !== cid);

                  const cid = b.getAttribute('data-restore-cid');
                  delete appState.db.meta.deletedCourses[cid];
                  savePersistedDeletedCourses(appState.db.meta.deletedCourses);
                  const seedMatch = SEED_COURSES.find(s => s.id === cid);
                  if (seedMatch && !getCourseById(cid)) {
                    appState.db.courses.push(normalizeCourseGrading({ ...JSON.parse(JSON.stringify(seedMatch)), updatedAt: Date.now() + 10000 }));
                  }
                  closeModal();
                  renderMain();
                  await saveState(true);
                  showToast('Materia restaurada', 'success');
                });
              });
            }
          );
        });
      }
    }

    // ==================== VISTA 4: CENTRO DE CALIFICACIONES (100 PTS) ====================
    function renderGradesCenterView(container) {
      const courses = appState.db.courses || [];
      if (courses.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-2xl border p-10 text-center text-sm text-slate-500">Crea al menos una materia para ver el Centro de Calificaciones.</div>`;
        return;
      }
      if (!appState.selectedCourseId || !getCourseById(appState.selectedCourseId)) {
        appState.selectedCourseId = courses[0].id;
      }
      const course = getCourseById(appState.selectedCourseId);
      normalizeCourseGrading(course);
      const cfg = course.gradingConfig;
      const enrolledStudents = (appState.db.students || []).filter(
        s => !isDemoStudentRecord(s) && (course.enrolledStudentIds || []).includes(s.id)
      );

      container.innerHTML = `
        <div class="space-y-5">
          <div class="bg-white rounded-2xl border border-slate-200 p-5 flex flex-wrap items-center justify-between gap-3 shadow-xs">
            <div>
              <h2 class="text-xl font-extrabold text-slate-900">📊 Centro de Calificaciones (Base 100 pts)</h2>
              <p class="text-xs text-slate-500">Consulta, edita productos independientes o exporta actas en CSV por materia.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <select id="grades-course-select" class="px-3 py-2 rounded-xl border border-slate-300 bg-white text-xs font-bold">
                ${courses.map(c => `<option value="${esc(c.id)}" ${c.id === course.id ? 'selected' : ''}>${esc(c.code)} · ${esc(c.title)}</option>`).join('')}
              </select>
              <button id="btn-grades-open-cfg" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold cursor-pointer">⚙️ Configurar Ponderaciones y Productos</button>
              <button id="btn-grades-export-csv" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold cursor-pointer">⬇ Exportar CSV</button>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 overflow-x-auto shadow-xs">
            <table class="w-full text-xs text-left">
              <thead class="bg-slate-900 text-white">
                <tr>
                  <th class="p-3">Estudiante</th>
                  <th class="p-3">Grupo</th>
                  <th class="p-3">Plataforma (${cfg.platformWeight}%)</th>
                  <th class="p-3">Asistencia (${cfg.attendanceWeight}%)</th>
                  ${(course.products || []).map(p => `<th class="p-3">${esc(p.title)} (${p.weight}%)</th>`).join('')}
                  <th class="p-3 text-amber-300 font-extrabold">Final (100)</th>
                </tr>
              </thead>
              <tbody class="divide-y">
                ${
                  enrolledStudents.length === 0
                    ? `<tr><td colspan="${5 + (course.products || []).length}" class="p-8 text-center text-slate-500">No hay estudiantes inscritos en ${esc(course.title)}.</td></tr>`
                    : enrolledStudents
                        .map(stu => {
                          const ev = calculateStudentCourseEvaluation(course, stu.id);
                          return `<tr class="hover:bg-slate-50/70">
                            <td class="p-3 font-extrabold text-slate-900">${esc(stu.name)}</td>
                            <td class="p-3 text-slate-500 font-semibold">${esc(stu.group || '—')}</td>
                            <td class="p-3">${ev.platformWeighted.toFixed(1)} pts</td>
                            <td class="p-3">${ev.attendanceWeighted.toFixed(1)} pts (${ev.studentAttendanceCount}/${ev.effectiveTotalDays})</td>
                            ${(course.products || [])
                              .map(p => {
                                const val = getProductScoreValue(course, p.id, stu.id);
                                return `<td class="p-3">
                                  <input type="number" min="0" max="100" data-center-prod-grade="${esc(p.id)}|${esc(stu.id)}" value="${val !== null ? val : ''}" placeholder="0-100" class="w-20 px-2 py-1 rounded-lg border text-xs font-bold" />
                                </td>`;
                              })
                              .join('')}
                            <td class="p-3"><span class="px-2.5 py-1 rounded-full font-extrabold ${getGradeToneBadgeClass(ev.finalGrade)}">${ev.finalGrade.toFixed(1)}</span></td>
                          </tr>`;
                        })
                        .join('')
                }
              </tbody>
            </table>
          </div>
        </div>
      `;

      document.getElementById('grades-course-select').addEventListener('change', e => {
        appState.selectedCourseId = e.target.value;
        renderGradesCenterView(container);
      });
      document.getElementById('btn-grades-export-csv').addEventListener('click', () => exportCourseGradesToCsv(course));
      document.getElementById('btn-grades-open-cfg').addEventListener('click', () => {
        appState.activeView = 'course-detail';
        appState.courseTab = 'gradebook';
        renderMain();
      });

      container.querySelectorAll('[data-center-prod-grade]').forEach(inp => {
        inp.addEventListener('change', async () => {
          const [pid, sid] = inp.getAttribute('data-center-prod-grade').split('|');
          setProductScoreValue(course, pid, sid, inp.value);
          course.updatedAt = Date.now();
          renderGradesCenterView(container);
          await saveState(true);
        });
      });
    }

        appState.session = null;
        appState.selectedCourseId = null;
        appState.activeView = 'dashboard';
        renderAuth();
      });

      const container = document.getElementById('view-content');
      if (appState.activeView === 'course-detail' && appState.selectedCourseId) {
        renderCourseDetail();
      } else if (appState.activeView === 'groups-panel' && isAdmin) {
        renderBase44GroupsPanelView(container);
      } else if (appState.activeView === 'my-grades' && !isAdmin) {
        renderStudentGradesFullView(container);
      } else if (appState.activeView === 'courses') {
        renderCoursesView(container);
      } else if (appState.activeView === 'students' && isAdmin) {
        renderStudentsView(container);
      } else if (appState.activeView === 'grades' && isAdmin) {
        renderGradesCenterView(container);
      } else {
        renderDashboardView(container);
      }
    }

    // ==================== REFRESCO SEGURO EN TIEMPO REAL ====================
    function refreshActiveViewSafely() {
      const modalOpen = !document.getElementById('modal-root').classList.contains('hidden');
      if (modalOpen) {
        refreshOpenAttendanceModalIfVisible();
        return;
      }
      // Nunca recargar la vista mientras la videoconferencia esté activa
      if (appState.activeView === 'course-detail' && appState.courseTab === 'live') return;
      if (isUserTyping()) return;
      if (Date.now() - appState.lastLocalMutationTs < 1800) return;

      if (appState.session) {
        renderMain();
      } else {
        renderAuth();
      }
    }

    // ==================== ARRANQUE E INTERVALO EN VIVO ====================
    renderMain();
    syncNow({ push: false, silent: true, forceRender: true });

    setInterval(() => {
      if (document.hidden || appState.cloudSyncing) return;
      syncNow({ push: false, silent: true, forceRender: false });
    }, 2500);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && !appState.cloudSyncing) {
        syncNow({ push: false, silent: true, forceRender: false });
      }
    });
  })();
  </script>
</body>
</html>
