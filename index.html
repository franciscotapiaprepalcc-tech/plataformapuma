      // ==================== ZONA HORARIA SONORA (America/Hermosillo) ====================
      function getSonoraDateParts(dateObj = new Date()) {
        const fmt = new Intl.DateTimeFormat('en-CA', {
          timeZone: SONORA_TIMEZONE,
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
        const parts = {};
        fmt.formatToParts(dateObj).forEach(p => {
          parts[p.type] = p.value;
        });
        const hour = parts.hour === '24' ? '00' : parts.hour;
        return {
          year: Number(parts.year),
          month: Number(parts.month) - 1,
          day: Number(parts.day),
          isoDate: `${parts.year}-${parts.month}-${parts.day}`,
          hm: `${hour}:${parts.minute}`,
          hms: `${hour}:${parts.minute}:${parts.second}`
        };
      }

      function getSonoraISODate() {
        return getSonoraDateParts().isoDate;

        return getSonoraDateParts().hm;

          platformWeight: Number.isFinite(Number(gc.platformWeight)) ? Number(gc.platformWeight) : 30,
          attendanceWeight: Number.isFinite(Number(gc.attendanceWeight)) ? Number(gc.attendanceWeight) : 10,
          expectedSessions: Number.isFinite(Number(gc.expectedSessions)) && Number(gc.expectedSessions) >= 0 ? Number(gc.expectedSessions) : 0,
          updatedAt: Number(gc.updatedAt || 1)
        };
        if (!Array.isArray(course.products)) {
          course.products = [
            {
              id: `prod-${course.id}-1`,
              title: 'Producto Evaluable 1',
              weight: 30,
              description: 'Evaluación independiente de secuencias.',
              updatedAt: 1

              title: 'Producto Evaluable 2',
              weight: 30,
              description: 'Proyecto o evaluación sumativa.',
              updatedAt: 1
            }
          ];
        } else {
          course.products = course.products.map(p => ({
            id: String(p.id || uid('prod')),
            title: String(p.title || 'Producto'),
            weight: Number.isFinite(Number(p.weight)) ? Number(p.weight) : 0,
            description: String(p.description || ''),
            updatedAt: Number(p.updatedAt || 1)
          }));
        }
        if (!course.productGrades || typeof course.productGrades !== 'object') {
          course.productGrades = {};

        if (!Array.isArray(course.enrolledStudentIds)) {
          course.enrolledStudentIds = [];

      function purgeDemoStudentData(dbObj) {
        if (!dbObj || typeof dbObj !== 'object') return dbObj;
        if (!dbObj.meta || typeof dbObj.meta !== 'object') dbObj.meta = {};
        if (!dbObj.meta.deletedStudents || typeof dbObj.meta.deletedStudents !== 'object') {
          dbObj.meta.deletedStudents = {};
        }

        const purgedIds = new Set(['s-demo-1', 'std-1', 'stu-demo', 'demo-1']);
        if (Array.isArray(dbObj.students)) {
          dbObj.students.forEach(s => {
            if (isDemoStudentRecord(s) && s.id) {
              purgedIds.add(String(s.id));
            }
          });
          dbObj.students = dbObj.students.filter(s => !isDemoStudentRecord(s) && !purgedIds.has(String(s?.id || '')));
        }

        purgedIds.forEach(id => {
          dbObj.meta.deletedStudents[id] = Math.max(Number(dbObj.meta.deletedStudents[id] || 0), 9999999999999);
        });

        if (Array.isArray(dbObj.courses)) {
          dbObj.courses.forEach(c => {
            if (Array.isArray(c.enrolledStudentIds)) {
              c.enrolledStudentIds = c.enrolledStudentIds.filter(id => !purgedIds.has(String(id)));
            }
            if (c.productGrades && typeof c.productGrades !== 'object') {
              c.productGrades = {};
            }
            if (c.productGrades && typeof c.productGrades === 'object') {
              Object.keys(c.productGrades).forEach(prodId => {
                const map = c.productGrades[prodId];
                if (map && typeof map === 'object') {
                  purgedIds.forEach(id => {
                    delete map[id];
                  });
                }
              });
            }
            normalizeCourseGrading(c);
          });
        }

        if (Array.isArray(dbObj.submissions)) {
          dbObj.submissions = dbObj.submissions.filter(sub => !purgedIds.has(String(sub?.studentId || '')));
        }

        if (Array.isArray(dbObj.attendance)) {
          dbObj.attendance = dbObj.attendance.filter(att => {
            const sid = String(att?.studentId || '');
            const sname = String(att?.studentName || '').toLowerCase();
            return (

              !sname.includes('alumno demostración') &&
              !sname.includes('alumno de demostración') &&
              !sname.includes('alumno demostracion') &&
              !sname.includes('alumno de demostracion')
            );
          });
        }

        return dbObj;
      }

      // ==================== MOTOR UNIFICADO DE SINCRONIZACIÓN EN TIEMPO REAL ====================
      function mergeOrderedCollectionById(remoteList, localList, deletedMap, preferLocalOrder = true) {
        const rArr = Array.isArray(remoteList) ? remoteList : [];
        const lArr = Array.isArray(localList) ? localList : [];
        const del = deletedMap && typeof deletedMap === 'object' ? deletedMap : {};

        const byId = new Map();
        [...rArr, ...lArr].forEach(item => {
          if (!item || !item.id) return;
          const id = String(item.id);
          const itemTs = Number(item.updatedAt || 1);
          const delTs = Number(del[id] || 0);
          if (delTs > itemTs) return;
          const prev = byId.get(id);
          if (!prev || itemTs >= Number(prev.updatedAt || 0)) {
            byId.set(id, JSON.parse(JSON.stringify(item)));
          }
        });

        const primary = preferLocalOrder ? lArr : rArr;
        const secondary = preferLocalOrder ? rArr : lArr;
        const orderedIds = [];
        const seen = new Set();

        [...primary, ...secondary].forEach(item => {
          if (!item || !item.id) return;
          const id = String(item.id);
          if (byId.has(id) && !seen.has(id)) {
            seen.add(id);
            orderedIds.push(id);
          }
        });

        return orderedIds.map(id => byId.get(id));
      }

      function mergeCourseModulesGranular(remoteModules, localModules, metaMaps, preferLocalOrder) {
        const rMods = Array.isArray(remoteModules) ? remoteModules : [];
        const lMods = Array.isArray(localModules) ? localModules : [];
        const rMap = new Map(rMods.filter(m => m && m.id).map(m => [String(m.id), m]));
        const lMap = new Map(lMods.filter(m => m && m.id).map(m => [String(m.id), m]));

        const baseMerged = mergeOrderedCollectionById(rMods, lMods, metaMaps.deletedModules, preferLocalOrder);
        return baseMerged.map(mod => {
          const id = String(mod.id);
          const rMod = rMap.get(id) || {};
          const lMod = lMap.get(id) || {};
          const localModNewer = Number(lMod.updatedAt || 0) >= Number(rMod.updatedAt || 0);

          const mergedResources = mergeOrderedCollectionById(
            rMod.resources,
            lMod.resources,
            metaMaps.deletedResources,
            localModNewer
          );
          const mergedAssignments = mergeOrderedCollectionById(
            rMod.assignments,
            lMod.assignments,
            metaMaps.deletedAssignments,
            localModNewer
          );

          const maxChildTs = Math.max(
            Number(mod.updatedAt || 1),
            ...mergedResources.map(r => Number(r.updatedAt || 1)),
            ...mergedAssignments.map(a => Number(a.updatedAt || 1))
          );

          return {
            ...mod,
            title: String(mod.title || '').replace(/\bSesi[oó]n\b/gi, 'Secuencia').replace(/\bSesiones\b/gi, 'Secuencias'),
            updatedAt: maxChildTs,
            resources: mergedResources,
            assignments: mergedAssignments
          };
        });
      }

      function mergeDatabases(remoteRaw, localRaw) {
        const remote = normalizeDatabase(remoteRaw);
        const local = normalizeDatabase(localRaw);

        const mergedDeletedCourses = mergeTimestampMaps(remote.meta.deletedCourses, local.meta.deletedCourses);
        const mergedDeletedModules = mergeTimestampMaps(remote.meta.deletedModules, local.meta.deletedModules);
        const mergedDeletedResources = mergeTimestampMaps(remote.meta.deletedResources, local.meta.deletedResources);
        const mergedDeletedAssignments = mergeTimestampMaps(remote.meta.deletedAssignments, local.meta.deletedAssignments);
        const mergedDeletedAnnouncements = mergeTimestampMaps(remote.meta.deletedAnnouncements, local.meta.deletedAnnouncements);
        const mergedDeletedProducts = mergeTimestampMaps(remote.meta.deletedProducts, local.meta.deletedProducts);
        const mergedDeletedAttendance = mergeTimestampMaps(remote.meta.deletedAttendance, local.meta.deletedAttendance);
        const mergedDeletedSubmissions = mergeTimestampMaps(remote.meta.deletedSubmissions, local.meta.deletedSubmissions);
        const mergedDeletedStudents = mergeTimestampMaps(remote.meta.deletedStudents, local.meta.deletedStudents);

        const metaMaps = {
          deletedCourses: mergedDeletedCourses,
          deletedModules: mergedDeletedModules,
          deletedResources: mergedDeletedResources,
          deletedAssignments: mergedDeletedAssignments,
          deletedAnnouncements: mergedDeletedAnnouncements,
          deletedProducts: mergedDeletedProducts
        };

        // 1. Fusión granular de cursos, secuencias (modules), recursos, actividades, avisos, productos y ponderaciones
        const preferLocalStructure = Number(local.meta.structureUpdatedAt || 0) >= Number(remote.meta.structureUpdatedAt || 0);
        const remoteCourseMap = new Map((remote.courses || []).filter(c => c && c.id).map(c => [String(c.id), c]));
        const localCourseMap = new Map((local.courses || []).filter(c => c && c.id).map(c => [String(c.id), c]));

        const baseCourses = mergeOrderedCollectionById(
          remote.courses,
          local.courses,
          mergedDeletedCourses,
          preferLocalStructure
        );

        const chosenCourses = baseCourses.map(baseCourse => {
          const cid = String(baseCourse.id);
          const rCourse = remoteCourseMap.get(cid);
          const lCourse = localCourseMap.get(cid);

          if (rCourse && lCourse) {
            const localCourseNewer = Number(lCourse.updatedAt || 0) >= Number(rCourse.updatedAt || 0) || preferLocalStructure;
            const primary = normalizeCourseGrading(JSON.parse(JSON.stringify(localCourseNewer ? lCourse : rCourse)));
            const other = normalizeCourseGrading(JSON.parse(JSON.stringify(localCourseNewer ? rCourse : lCourse)));

            // Unir inscripciones de estudiantes activos
            const enrolledSet = new Set([
              ...(Array.isArray(other.enrolledStudentIds) ? other.enrolledStudentIds : []),
              ...(Array.isArray(primary.enrolledStudentIds) ? primary.enrolledStudentIds : [])
            ]);
            primary.enrolledStudentIds = Array.from(enrolledSet).filter(id => id && !mergedDeletedStudents[id]);

            // Elegir configuración de ponderación más reciente
            const pCfgTs = Number(primary.gradingConfig?.updatedAt || 0);
            const oCfgTs = Number(other.gradingConfig?.updatedAt || 0);
            if (oCfgTs > pCfgTs && other.gradingConfig) {
              primary.gradingConfig = JSON.parse(JSON.stringify(other.gradingConfig));
            }

            // Fusionar secuencias (modules), recursos y actividades granularmente sin perder nuevas secuencias
            primary.modules = mergeCourseModulesGranular(
              rCourse.modules,
              lCourse.modules,
              metaMaps,
              localCourseNewer
            );

            // Fusionar avisos del curso
            primary.announcements = mergeOrderedCollectionById(
              rCourse.announcements,
              lCourse.announcements,
              mergedDeletedAnnouncements,
              localCourseNewer
            );

            // Fusionar productos evaluables independientes
            primary.products = mergeOrderedCollectionById(
              rCourse.products,
              lCourse.products,
              mergedDeletedProducts,
              localCourseNewer
            );

            // Fusionar calificaciones de productos evaluables independientes por celda y timestamp
            const mergedProdGrades = {};
            const allProdIds = new Set([
              ...Object.keys(other.productGrades || {}),
              ...Object.keys(primary.productGrades || {})
            ]);
            allProdIds.forEach(pid => {
              if (mergedDeletedProducts[pid]) return;
              mergedProdGrades[pid] = {};
              const rGrades = (other.productGrades && other.productGrades[pid]) || {};
              const lGrades = (primary.productGrades && primary.productGrades[pid]) || {};
              const stuIds = new Set([...Object.keys(rGrades), ...Object.keys(lGrades)]);
              stuIds.forEach(sid => {
                if (!sid || mergedDeletedStudents[sid]) return;
                const rEntry = rGrades[sid];
                const lEntry = lGrades[sid];
                const rObj = rEntry && typeof rEntry === 'object' ? rEntry : (rEntry !== undefined ? { score: rEntry, updatedAt: 1 } : null);
                const lObj = lEntry && typeof lEntry === 'object' ? lEntry : (lEntry !== undefined ? { score: lEntry, updatedAt: 1 } : null);
                if (rObj && lObj) {
                  mergedProdGrades[pid][sid] = Number(lObj.updatedAt || 0) >= Number(rObj.updatedAt || 0) ? lObj : rObj;
                } else if (lObj || rObj) {
                  mergedProdGrades[pid][sid] = lObj || rObj;
                }
              });
            });
            primary.productGrades = mergedProdGrades;
            primary.updatedAt = Math.max(
              Number(rCourse.updatedAt || 1),
              Number(lCourse.updatedAt || 1),
              ...primary.modules.map(m => Number(m.updatedAt || 1))
            );
            return normalizeCourseGrading(primary);
          }

          return normalizeCourseGrading(JSON.parse(JSON.stringify(lCourse || rCourse || baseCourse)));
        });

        const chosenStructureTs = Math.max(
          Number(remote.meta.structureUpdatedAt || 1),
          Number(local.meta.structureUpdatedAt || 1),
          ...chosenCourses.map(c => Number(c.updatedAt || 1))
        );

        // 2. Estudiantes: unión por ID respetando eliminaciones y excluyendo alumno demo
        const stuMap = new Map();
        [...remote.students, ...local.students].forEach(stu => {
          if (!stu || !stu.id || isDemoStudentRecord(stu)) return;
          const delTs = Number(mergedDeletedStudents[stu.id] || 0);
          const itemTs = Number(stu.updatedAt || 1);
          if (delTs > itemTs) return;
          const prev = stuMap.get(stu.id);
          if (!prev || Number(stu.updatedAt || 0) >= Number(prev.updatedAt || 0)) {
            stuMap.set(stu.id, stu);
          }
        });

        // 3. Entregas de secuencias (Submissions)
        const subMap = new Map();
        [...remote.submissions, ...local.submissions].forEach(sub => {
          if (!sub || !sub.courseId || !sub.assignmentId || !sub.studentId) return;
          if (mergedDeletedStudents[sub.studentId]) return;
          const key = getSubmissionKey(sub);
          const delTs = Number(mergedDeletedSubmissions[key] || 0);
          const itemTs = Number(sub.updatedAt || 1);
          if (delTs > itemTs) return;
          const prev = subMap.get(key);
          if (!prev || Number(sub.updatedAt || 0) >= Number(prev.updatedAt || 0)) {
            subMap.set(key, sub);
          }
        });

        // 4. Asistencias diarias por materia (courseId|date|studentId)
        const attMap = new Map();
        [...remote.attendance, ...local.attendance].forEach(att => {
          if (!att || !att.courseId || !att.date || !att.studentId) return;
          const cleanStudentId = String(att.studentId).trim();
          if (!cleanStudentId || cleanStudentId === 'admin' || mergedDeletedStudents[cleanStudentId]) return;
          const key = `${String(att.courseId).trim()}|${String(att.date).trim()}|${cleanStudentId}`;
          const delTs = Number(mergedDeletedAttendance[key] || 0);
          const itemTs = Number(att.createdAtTs || 1);
          if (delTs >= itemTs) return;
          const prev = attMap.get(key);
          if (!prev || itemTs >= Number(prev.createdAtTs || 0)) {
            attMap.set(key, {
              ...att,
              courseId: String(att.courseId).trim(),
              date: String(att.date).trim(),
              studentId: cleanStudentId,
              createdAtTs: itemTs
            });
          }
        });

        const mergedResult = {
          meta: {
            structureUpdatedAt: chosenStructureTs,
            deletedCourses: mergedDeletedCourses,
            deletedModules: mergedDeletedModules,
            deletedResources: mergedDeletedResources,
            deletedAssignments: mergedDeletedAssignments,
            deletedAnnouncements: mergedDeletedAnnouncements,
            deletedProducts: mergedDeletedProducts,
            deletedAttendance: mergedDeletedAttendance,
            deletedSubmissions: mergedDeletedSubmissions,
            deletedStudents: mergedDeletedStudents
          },
          courses: chosenCourses,
          students: Array.from(stuMap.values()),
          submissions: Array.from(subMap.values()),
          attendance: Array.from(attMap.values())
        };

        return purgeDemoStudentData(mergedResult);
      }

      async function fetchKvdbDatabase() {
        try {
          const key = getKvdbMasterKey();
          const res = await fetch(`${REALTIME_ATT_API}/${encodeURIComponent(key)}?_t=${Date.now()}`, {
            headers: { Accept: 'application/json' },
            cache: 'no-store'
          });
          if (res.status === 404) return null;
          if (!res.ok) return null;
          const parsed = await res.json();
          if (parsed && Array.isArray(parsed.courses)) {
            return normalizeDatabase(parsed);
          }
        } catch (e) {}
        return null;
      }

      async function pushKvdbDatabase(dbObj) {
        try {
          const key = getKvdbMasterKey();
          const res = await fetch(`${REALTIME_ATT_API}/${encodeURIComponent(key)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dbObj)
          });
          return res.ok;
        } catch (e) {
          return false;
        }
      }

      async function resolveSharedGistId(cfg) {
        if (cfg.gistId) {
          activeGistIdMemory = cfg.gistId;
          return cfg.gistId;
        }
        if (activeGistIdMemory) {
          return activeGistIdMemory;
        }
        if (!cfg.token) return '';
        try {
          const res = await fetch(`https://api.github.com/gists?per_page=50&_t=${Date.now()}`, {
            headers: buildGitHubHeaders(cfg.token, false)
          });
          if (!res.ok) return '';
          const list = await res.json();
          if (Array.isArray(list)) {
            const found = list.find(g => g.files && g.files['puma_steam_db.json']);
            if (found && found.id) {
              activeGistIdMemory = found.id;
              cfg.gistId = found.id;
              saveCloudConfig(cfg.token, found.id);
              return found.id;
            }
          }
        } catch (e) {}
        return '';
      }

      async function fetchGistDatabase() {
        const cfg = getCloudConfig();
        const gistId = await resolveSharedGistId(cfg);
        if (!gistId) return null;
        try {
          let res = await fetch(`https://api.github.com/gists/${encodeURIComponent(gistId)}?_t=${Date.now()}`, {
            headers: buildGitHubHeaders(cfg.token, false),
            cache: 'no-store'
          });
          if (res.status === 401 || res.status === 403) {
            res = await fetch(`https://api.github.com/gists/${encodeURIComponent(gistId)}?_t=${Date.now()}`, {
              headers: { Accept: 'application/vnd.github+json' },
              cache: 'no-store'
            });
          }
          if (!res.ok) return null;
          const data = await res.json();
          const fileObj = data.files && (data.files['puma_steam_db.json'] || Object.values(data.files)[0]);
          if (!fileObj) return null;
          let rawContent = fileObj.content;
          if (fileObj.truncated && fileObj.raw_url) {
            const rawRes = await fetch(`${fileObj.raw_url}?_t=${Date.now()}`, { cache: 'no-store' });
            if (rawRes.ok) rawContent = await rawRes.text();
          }
          if (!rawContent) return null;
          const parsed = JSON.parse(rawContent);
          if (parsed && Array.isArray(parsed.courses)) {
            return normalizeDatabase(parsed);
          }
        } catch (e) {}
        return null;
      }

      async function pushGistDatabase(dbObj) {
        const cfg = getCloudConfig();
        if (!cfg.token) return false;
        try {
          const gistId = await resolveSharedGistId(cfg);
          const payload = {
            description: 'PLATAFORMA PUMA STEAM - Base de datos sincronizada',
            public: false,
            files: {
              'puma_steam_db.json': {
                content: JSON.stringify(dbObj, null, 2)
              }
            }
          };
          const url = gistId
            ? `https://api.github.com/gists/${encodeURIComponent(gistId)}`
            : 'https://api.github.com/gists';
          const method = gistId ? 'PATCH' : 'POST';
          const res = await fetch(url, {
            method,
            headers: buildGitHubHeaders(cfg.token, true),
            body: JSON.stringify(payload)
          });
          if (!res.ok) return false;
          const data = await res.json();
          if (data && data.id && data.id !== gistId) {
            activeGistIdMemory = data.id;
            saveCloudConfig(cfg.token, data.id);
          }
          return true;
        } catch (e) {
          return false;
        }
      }

      function updateRealtimeIndicator() {

        if (badge) {

      async function syncNow({ push = false, silent = true, skipRender = false, isStructural = false } = {}) {
        if (!push && (Date.now() - appState.lastLocalWriteTs < 2500 || Date.now() - appState.lastLocalMutationTs < 2500)) {
          return { ok: true, changed: false };
        }

        syncLockPromise = syncLockPromise
          .then(async () => {
            appState.cloudSyncing = true;
            try {
              if (isStructural) {
                const nowTs = Date.now();
                appState.db.meta.structureUpdatedAt = nowTs;
                appState.lastLocalWriteTs = nowTs;
                appState.lastLocalMutationTs = nowTs;
              }

              appState.db = purgeDemoStudentData(normalizeDatabase(appState.db));
              const beforeJson = JSON.stringify(appState.db);

              const [kvData, gistData] = await Promise.all([
                fetchKvdbDatabase(),
                fetchGistDatabase()
              ]);

              let combined = appState.db;
              if (gistData) {
                combined = mergeDatabases(gistData, combined);
              }
              if (kvData) {
                combined = mergeDatabases(kvData, combined);
              }

              combined = purgeDemoStudentData(combined);
              const afterJson = JSON.stringify(combined);
              const changed = beforeJson !== afterJson;
              appState.db = combined;

              try {
                localStorage.setItem(STORAGE_KEY, afterJson);
              } catch (e) {}

              let writeOk = true;
              const kvNeedsUpdate = !kvData || JSON.stringify(kvData) !== afterJson;
              const gistNeedsUpdate = !gistData || JSON.stringify(gistData) !== afterJson;
              if (push || kvNeedsUpdate || gistNeedsUpdate) {
                const [kvOk, gistOk] = await Promise.all([
                  pushKvdbDatabase(appState.db),
                  pushGistDatabase(appState.db)
                ]);
                writeOk = Boolean(kvOk || gistOk);
              }

              appState.lastSyncTime = getSonoraTimeHMS();
              updateRealtimeIndicator();

              if (!skipRender && (changed || push)) {
                refreshActiveViewSafely();
              } else {
                refreshOpenAttendanceModalIfVisible();
              }

              if (!silent) {
                showToast(
                  writeOk ? 'Sincronizado en tiempo real con la nube' : 'Guardado localmente (revisa conexión)',
                  writeOk ? 'success' : 'info'
                );
              }

              return { ok: writeOk, changed };
            } catch (err) {
              if (!silent) {
                showToast('Error de red al sincronizar con la nube', 'error');
              }
              return { ok: false, changed: false };
            } finally {
              appState.cloudSyncing = false;
            }
          })
          .catch(() => ({ ok: false, changed: false }));

        return syncLockPromise;
      }

      function saveState(options = {}) {
        const isObj = options && typeof options === 'object';
        const isStructural = typeof options === 'boolean'
          ? options
          : isObj && options.isStructural !== undefined
          ? options.isStructural
          : true;
        const silent = isObj && options.silent !== undefined ? options.silent : true;
        const nowTs = Date.now();
        if (isStructural) {
          appState.db.meta.structureUpdatedAt = nowTs;
        }
        appState.lastLocalWriteTs = nowTs;
        appState.lastLocalMutationTs = nowTs;
        appState.db = purgeDemoStudentData(normalizeDatabase(appState.db));
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.db));
        } catch (e) {}
        return syncNow({ push: true, silent, skipRender: false, isStructural });
      }

      async function pullFromCloud(silent = true, skipRender = false) {
        const res = await syncNow({ push: false, silent, skipRender, isStructural: false });
        return res.ok;
      }

      async function pushToCloud(silent = true) {
        const res = await syncNow({ push: true, silent, skipRender: false, isStructural: true });
        return res;
      }

      function getCourseById(courseId) {
        return appState.db.courses.find(c => c.id === courseId) || null;
      }

      function getStudentById(studentId) {
        return appState.db.students.find(s => s.id === studentId) || null;

      function getSubmission(courseId, assignmentId, studentId) {
        return (
          appState.db.submissions.find(
            s => s.courseId === courseId && s.assignmentId === assignmentId && s.studentId === studentId
          ) || null
        );

      function getVisibleCourses() {
        if (!appState.session) return [];
        if (appState.session.role === 'admin') return appState.db.courses;
        const sid = appState.session.user.id;
        return appState.db.courses.filter(c => (c.enrolledStudentIds || []).includes(sid));
      }

      function getAllAssignmentsForCourses(courses) {
        const list = [];
        (courses || []).forEach(c => {
          (c.modules || []).forEach(m => {
            (m.assignments || []).forEach(a => {
              list.push({
                ...a,
                courseId: c.id,
                courseTitle: c.title,
                courseCode: c.code,
                moduleTitle: m.title
              });
            });
          });
        });
        return list;
      }

      function getCourseRosterForAttendance(course) {
        if (!course) return [];
        const enrolledSet = new Set(Array.isArray(course.enrolledStudentIds) ? course.enrolledStudentIds : []);
        const validStudents = appState.db.students.filter(s => s && s.id && !isDemoStudentRecord(s));
        const enrolledStudents = validStudents.filter(s => enrolledSet.has(s.id));
        if (enrolledStudents.length > 0) {
          return enrolledStudents.sort((a, b) => String(a.name).localeCompare(String(b.name), 'es'));
        }
        return validStudents.sort((a, b) => String(a.name).localeCompare(String(b.name), 'es'));
      }

      function showToast(message, type = 'info') {
        const root = document.getElementById('toast-root');
        if (!root) return;
        const colors = {
          success: 'bg-emerald-600 text-white border-emerald-700',
          error: 'bg-rose-600 text-white border-rose-700',
          info: 'bg-navy-900 text-white border-slate-700'
        };
        const el = document.createElement('div');
        el.className = `pointer-events-auto flex items-center justify-between gap-3 px-4 py-3 rounded-xl shadow-lg border text-xs sm:text-sm font-medium transition-all duration-200 ${colors[type] || colors.info}`;
        el.innerHTML = `
          <span>${esc(message)}</span>
          <button type="button" class="opacity-80 hover:opacity-100 font-bold text-base leading-none cursor-pointer">&times;</button>
        `;
        el.querySelector('button').addEventListener('click', () => el.remove());
        root.appendChild(el);
        setTimeout(() => {
          if (el.parentNode) el.remove();
        }, 3800);
      }

        if (activeQrScannerInstance) {

            const btn = document.getElementById('reg-submit-btn');
            if (btn) {
              btn.disabled = true;
              btn.textContent = 'Sincronizando registro...';
            }

            await syncNow({ push: false, silent: true, skipRender: true });

            if (
              username.toLowerCase() === ADMIN_USER.toLowerCase() ||
              appState.db.students.some(s => s.username.toLowerCase() === username.toLowerCase())

              if (btn) {

              return;

              id: uid('stu'),
              name,
              username,
              email,
              group,
              password: 'aB123456.',
              mustChangePassword: true,
              createdAt: getSonoraISODate(),
              updatedAt: Date.now()
            };

            appState.db.students.push(newStudent);
            appState.db.courses.forEach(c => {

            appState.activeView = 'dashboard';
            renderMain();
            showToast('Cuenta creada y sincronizada en la nube', 'success');

      // ==================== CÁLCULO DE PONDERACIÓN Y LIBRO DE CALIFICACIONES (100 PTS) ====================
      function getProductScoreValue(course, productId, studentId) {
        if (!course || !course.productGrades || !course.productGrades[productId]) return null;
        const entry = course.productGrades[productId][studentId];
        if (entry === null || entry === undefined || entry === '') return null;
        if (typeof entry === 'object') {
          if (entry.score === null || entry.score === undefined || entry.score === '') return null;
          const n = Number(entry.score);
          return Number.isFinite(n) ? n : null;
        }
        const n = Number(entry);
        return Number.isFinite(n) ? n : null;
      }

      function setProductScoreValue(course, productId, studentId, rawScore) {
        if (!course.productGrades || typeof course.productGrades !== 'object') {
          course.productGrades = {};
        }
        if (!course.productGrades[productId] || typeof course.productGrades[productId] !== 'object') {
          course.productGrades[productId] = {};
        }
        if (rawScore === '' || rawScore === null || rawScore === undefined) {
          course.productGrades[productId][studentId] = { score: null, updatedAt: Date.now() };
          return;
        }
        const clamped = Math.max(0, Math.min(100, Number(rawScore)));
        course.productGrades[productId][studentId] = {
          score: Number.isFinite(clamped) ? Math.round(clamped * 10) / 10 : null,
          updatedAt: Date.now()
        };
      }

      function calculateStudentCourseEvaluation(course, studentId) {
        normalizeCourseGrading(course);
        const cfg = course.gradingConfig;
        const products = Array.isArray(course.products) ? course.products : [];

        // 1. Plataforma: promedio sobre 100 de todas las actividades/tareas en las secuencias de esta materia
        const allAssignments = [];
        (course.modules || []).forEach(m => {
          (m.assignments || []).forEach(a => allAssignments.push(a));
        });

        let platformAvg = 0;
        let gradedAssignmentsCount = 0;
        if (allAssignments.length > 0) {
          let sumNormalized = 0;
          allAssignments.forEach(a => {
            const sub = getSubmission(course.id, a.id, studentId);
            if (sub && sub.grade !== null && sub.grade !== undefined && sub.grade !== '') {
              const maxPts = Number(a.maxPoints) > 0 ? Number(a.maxPoints) : 100;
              const norm = Math.max(0, Math.min(100, (Number(sub.grade) / maxPts) * 100));
              sumNormalized += norm;
              gradedAssignmentsCount += 1;
            }
          });
          platformAvg = sumNormalized / allAssignments.length;
        }
        const platformWeighted = (platformAvg * Number(cfg.platformWeight || 0)) / 100;

        // 2. Asistencia diaria en esta materia específica (course.id)
        const courseAttendance = (appState.db.attendance || []).filter(
          a => a.courseId === course.id && a.studentId && a.studentId !== 'admin'
        );
        const uniqueCourseDates = new Set(courseAttendance.map(a => a.date));
        const totalRecordedDays = uniqueCourseDates.size;
        const effectiveTotalDays =
          Number(cfg.expectedSessions) > 0 ? Number(cfg.expectedSessions) : totalRecordedDays;

        const studentDates = new Set(
          courseAttendance.filter(a => a.studentId === studentId).map(a => a.date)
        );
        const studentAttendanceCount = studentDates.size;

        let attendancePct = 0;
        if (effectiveTotalDays > 0) {
          attendancePct = Math.min(100, (studentAttendanceCount / effectiveTotalDays) * 100);
        }
        const attendanceWeighted = (attendancePct * Number(cfg.attendanceWeight || 0)) / 100;

        // 3. Productos Evaluables independientes de las secuencias
        let productsWeightedTotal = 0;
        const productBreakdown = products.map(p => {
          const score = getProductScoreValue(course, p.id, studentId);
          const numericScore = score !== null ? score : 0;
          const w = Number(p.weight || 0);
          const weightedPts = (numericScore * w) / 100;
          productsWeightedTotal += weightedPts;
          return {
            product: p,
            score,
            numericScore,
            weight: w,
            weightedPts
          };
        });

        const productsWeightSum = products.reduce((acc, p) => acc + Number(p.weight || 0), 0);
        const totalConfiguredWeight =
          Number(cfg.platformWeight || 0) + Number(cfg.attendanceWeight || 0) + productsWeightSum;
        const finalGrade = Math.max(
          0,
          Math.min(100, platformWeighted + attendanceWeighted + productsWeightedTotal)
        );

        return {
          totalAssignments: allAssignments.length,
          gradedAssignmentsCount,
          platformAvg,
          platformWeight: Number(cfg.platformWeight || 0),
          platformWeighted,
          studentAttendanceCount,
          effectiveTotalDays,
          totalRecordedDays,
          attendancePct,
          attendanceWeight: Number(cfg.attendanceWeight || 0),
          attendanceWeighted,
          productBreakdown,
          productsWeightSum,
          productsWeightedTotal,
          totalConfiguredWeight,
          finalGrade
        };
      }

      function wireCourseSequencesEvents(course, container, isAdmin, userId) {
        if (isAdmin) {
          container.querySelectorAll('[data-del-ann]').forEach(btn => {
            btn.addEventListener('click', async () => {
              const id = btn.getAttribute('data-del-ann');
              const nowTs = Date.now();
              if (!appState.db.meta.deletedAnnouncements) appState.db.meta.deletedAnnouncements = {};
              appState.db.meta.deletedAnnouncements[id] = nowTs + 1000;
              course.announcements = (course.announcements || []).filter(a => a.id !== id);
              course.updatedAt = nowTs;
              appState.db.meta.structureUpdatedAt = nowTs;
              renderCourseDetail();
              await saveState(true);
              showToast('Aviso eliminado y sincronizado', 'info');
            });
          });

          container.querySelectorAll('[data-del-mod]').forEach(btn => {
            btn.addEventListener('click', () => {
              const modId = btn.getAttribute('data-del-mod');
              const targetCourse = getCourseById(course.id) || course;
              const mod = (targetCourse.modules || []).find(m => m.id === modId);
              if (!mod) return;
              openModal('Eliminar Secuencia', `
                <p class="text-sm text-slate-600 mb-5">¿Confirmas que deseas eliminar permanentemente la secuencia <strong>${esc(mod.title)}</strong>?</p>
                <div class="flex justify-end gap-2">
                  <button type="button" id="cancel-del-mod" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700 cursor-pointer">Cancelar</button>
                  <button type="button" id="confirm-del-mod" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold cursor-pointer">Eliminar Secuencia</button>
                </div>
              `, () => {
                document.getElementById('cancel-del-mod').addEventListener('click', closeModal);
                document.getElementById('confirm-del-mod').addEventListener('click', async () => {
                  const nowTs = Date.now();
                  const liveCourse = getCourseById(course.id) || course;
                  if (!appState.db.meta.deletedModules) appState.db.meta.deletedModules = {};
                  appState.db.meta.deletedModules[modId] = nowTs + 1000;
                  liveCourse.modules = (liveCourse.modules || []).filter(m => m.id !== modId);
                  liveCourse.updatedAt = nowTs;
                  appState.db.meta.structureUpdatedAt = nowTs;
                  closeModal();
                  renderCourseDetail();
                  await saveState(true);
                  showToast('Secuencia eliminada en tiempo real', 'info');
                });
              });
            });
          });

          container.querySelectorAll('[data-edit-mod]').forEach(btn => {
            btn.addEventListener('click', () => {
              const modId = btn.getAttribute('data-edit-mod');
              const liveCourse = getCourseById(course.id) || course;
              const mod = (liveCourse.modules || []).find(m => m.id === modId);
              if (!mod) return;
              openEditModuleModal(liveCourse, mod);
            });
          });

          container.querySelectorAll('[data-add-res]').forEach(btn => {
            btn.addEventListener('click', () => {
              const modId = btn.getAttribute('data-add-res');
              const liveCourse = getCourseById(course.id) || course;
              openAddResourceModal(liveCourse, modId);
            });
          });

          container.querySelectorAll('[data-del-res]').forEach(btn => {
            btn.addEventListener('click', async () => {
              const [modId, resId] = btn.getAttribute('data-del-res').split('|');
              const liveCourse = getCourseById(course.id) || course;
              const mod = (liveCourse.modules || []).find(m => m.id === modId);
              if (!mod) return;
              const nowTs = Date.now();
              if (!appState.db.meta.deletedResources) appState.db.meta.deletedResources = {};
              appState.db.meta.deletedResources[resId] = nowTs + 1000;
              mod.resources = (mod.resources || []).filter(r => r.id !== resId);
              mod.updatedAt = nowTs;
              liveCourse.updatedAt = nowTs;
              appState.db.meta.structureUpdatedAt = nowTs;
              renderCourseDetail();
              await saveState(true);
              showToast('Recurso eliminado', 'info');
            });
          });

          container.querySelectorAll('[data-add-assign]').forEach(btn => {
            btn.addEventListener('click', () => {
              const modId = btn.getAttribute('data-add-assign');
              const liveCourse = getCourseById(course.id) || course;
              openAddAssignmentModal(liveCourse, modId);
            });
          });

          container.querySelectorAll('[data-del-assign]').forEach(btn => {
            btn.addEventListener('click', async () => {
              const [modId, assignId] = btn.getAttribute('data-del-assign').split('|');
              const liveCourse = getCourseById(course.id) || course;
              const mod = (liveCourse.modules || []).find(m => m.id === modId);
              if (!mod) return;
              const nowTs = Date.now();
              if (!appState.db.meta.deletedAssignments) appState.db.meta.deletedAssignments = {};
              appState.db.meta.deletedAssignments[assignId] = nowTs + 1000;
              mod.assignments = (mod.assignments || []).filter(a => a.id !== assignId);
              mod.updatedAt = nowTs;
              liveCourse.updatedAt = nowTs;
              appState.db.meta.structureUpdatedAt = nowTs;
              renderCourseDetail();
              await saveState(true);
              showToast('Actividad eliminada', 'info');
            });
          });

          container.querySelectorAll('[data-view-subs]').forEach(btn => {
            btn.addEventListener('click', () => {
              appState.activeView = 'submissions';
              renderMain();
            });
          });
        } else {
          container.querySelectorAll('[data-submit-assign]').forEach(btn => {
            btn.addEventListener('click', () => {
              const assignId = btn.getAttribute('data-submit-assign');
              openStudentSubmitModal(course, assignId, userId);
            });
          });
        }
      }

      function openAddModuleModal(course) {
        const targetCourse = getCourseById(course?.id || appState.selectedCourseId) || course;
        if (!targetCourse) return;
        const nextNum = (Array.isArray(targetCourse.modules) ? targetCourse.modules.length : 0) + 1;
        openModal('Nueva Secuencia Didáctica', `
          <form id="mod-form" class="space-y-3.5">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Título de la Secuencia</label>
              <input id="mod-title" type="text" required value="Secuencia ${nextNum}: " placeholder="Ej. Secuencia ${nextNum}: Nombre del tema..."
                class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-puma-500" />
            </div>
            <div class="flex justify-end gap-2">
              <button type="button" id="mod-cancel" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700 cursor-pointer">Cancelar</button>
              <button type="submit" id="mod-submit-btn" class="px-4 py-2 rounded-xl bg-puma-500 hover:bg-puma-600 text-white text-xs font-semibold cursor-pointer">Crear Secuencia</button>
            </div>
          </form>
        `, () => {
          const titleInput = document.getElementById('mod-title');
          if (titleInput) {
            titleInput.focus();
            titleInput.setSelectionRange(titleInput.value.length, titleInput.value.length);
          }
          document.getElementById('mod-cancel').addEventListener('click', closeModal);
          document.getElementById('mod-form').addEventListener('submit', async e => {
            e.preventDefault();
            const rawTitle = document.getElementById('mod-title').value.trim();
            const title = rawTitle || `Secuencia ${nextNum}`;
            const liveCourse = getCourseById(targetCourse.id) || targetCourse;
            const nowTs = Date.now();
            const newModId = uid('mod');

            if (appState.db.meta.deletedModules) {
              delete appState.db.meta.deletedModules[newModId];
            }

            liveCourse.modules = Array.isArray(liveCourse.modules) ? liveCourse.modules : [];
            liveCourse.modules.push({
              id: newModId,
              title,
              resources: [],
              assignments: [],
              updatedAt: nowTs
            });
            liveCourse.updatedAt = nowTs;
            appState.db.meta.structureUpdatedAt = nowTs;
            appState.lastLocalMutationTs = nowTs;
            appState.courseTab = 'content';

            closeModal();
            renderCourseDetail();
            await saveState(true);
            showToast('Secuencia creada y sincronizada en tiempo real con la nube', 'success');
          });
        });
      }

            const currentMod = (currentCourse.modules || []).find(m => m.id === modId) || mod;
            const nowTs = Date.now();
            const newAssignId = uid('task');
            if (appState.db.meta.deletedAssignments) {
              delete appState.db.meta.deletedAssignments[newAssignId];
            }
            currentMod.assignments = Array.isArray(currentMod.assignments) ? currentMod.assignments : [];
            currentMod.assignments.push({
              id: newAssignId,
              title: document.getElementById('as-title').value.trim(),
              instructions: document.getElementById('as-inst').value.trim(),
              dueDate: document.getElementById('as-due').value,
              maxPoints: Number(document.getElementById('as-pts').value) || 100,
              updatedAt: nowTs
            });
            currentMod.updatedAt = nowTs;
            currentCourse.updatedAt = nowTs;
            appState.db.meta.structureUpdatedAt = nowTs;
            appState.lastLocalMutationTs = nowTs;
            closeModal();
            renderCourseDetail();
            await saveState(true);
            showToast('Actividad publicada en la secuencia y sincronizada', 'success');
          });
        });

      function openStudentSubmitModal(course, assignmentId, studentId) {
        let foundAssign = null;
        (course.modules || []).forEach(m => {
          const a = (m.assignments || []).find(x => x.id === assignmentId);
          if (a) foundAssign = a;
        });
        if (!foundAssign) return;

        const existing = getSubmission(course.id, assignmentId, studentId);
        openModal(`Entregar: ${foundAssign.title}`, `
          <form id="sub-form" class="space-y-3.5">
            <p class="text-xs text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-200">${esc(foundAssign.instructions)}</p>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Enlace a tu trabajo (Google Drive, Canva, OneDrive, etc.) o Respuesta</label>
              <textarea id="sub-content" rows="4" required placeholder="Pega aquí el enlace o desarrolla tu respuesta..."
                class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">${esc(existing?.content || '')}</textarea>
            </div>
            <div class="flex justify-end gap-2">
              <button type="button" id="sub-cancel" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700 cursor-pointer">Cancelar</button>
              <button type="submit" class="px-4 py-2 rounded-xl bg-puma-500 hover:bg-puma-600 text-white text-xs font-semibold cursor-pointer">Enviar Entrega</button>
            </div>
          </form>
        `, () => {
          document.getElementById('sub-cancel').addEventListener('click', closeModal);
          document.getElementById('sub-form').addEventListener('submit', async e => {
            e.preventDefault();
            const content = document.getElementById('sub-content').value.trim();
            const nowStamp = `${getSonoraISODate()} ${getSonoraTimeHM()}`;
            const subKey = `${course.id}|${assignmentId}|${studentId}`;
            if (appState.db.meta.deletedSubmissions) {
              delete appState.db.meta.deletedSubmissions[subKey];
            }

            if (existing) {
              existing.content = content;
              existing.submittedAt = nowStamp;
              existing.updatedAt = Date.now();
            } else {
              appState.db.submissions.push({
                id: uid('sub'),
                courseId: course.id,
                assignmentId,
                studentId,
                studentName: appState.session.user.name,
                content,
                submittedAt: nowStamp,
                grade: null,
                feedback: '',
                updatedAt: Date.now()
              });
            }
            closeModal();
            renderCourseDetail();
            await saveState({ isStructural: false });
            showToast('Actividad entregada y sincronizada', 'success');
          });
        });

      function wireCourseGradebookEvents(course, container, isAdmin) {
        if (!isAdmin) return;

        const weightsForm = document.getElementById('gradebook-weights-form');
        if (weightsForm) {
          weightsForm.addEventListener('submit', async e => {
            e.preventDefault();
            const pw = Math.max(0, Math.min(100, Number(document.getElementById('gb-weight-platform').value) || 0));
            const aw = Math.max(0, Math.min(100, Number(document.getElementById('gb-weight-attendance').value) || 0));
            const es = Math.max(0, parseInt(document.getElementById('gb-expected-sessions').value, 10) || 0);
            const nowTs = Date.now();
            const liveCourse = getCourseById(course.id) || course;

            liveCourse.gradingConfig = {
              platformWeight: pw,
              attendanceWeight: aw,
              expectedSessions: es,
              updatedAt: nowTs
            };
            liveCourse.updatedAt = nowTs;
            appState.db.meta.structureUpdatedAt = nowTs;
            renderCourseDetail();
            await saveState(true);
            const prodSum = (liveCourse.products || []).reduce((acc, p) => acc + Number(p.weight || 0), 0);
            const total = pw + aw + prodSum;
            if (Math.abs(total - 100) < 0.01) {
              showToast('Ponderaciones guardadas (Total: 100%)', 'success');
            } else {
              showToast(`Ponderaciones guardadas. Suma actual: ${total.toFixed(1)}% (ajústala a 100%)`, 'info');
            }
          });
        }

        const addProdBtn = document.getElementById('btn-add-product');
        if (addProdBtn) {
          addProdBtn.addEventListener('click', () => openAddOrEditProductModal(course, null));
        }

        container.querySelectorAll('[data-edit-product]').forEach(btn => {
          btn.addEventListener('click', () => {
            const prodId = btn.getAttribute('data-edit-product');
            openAddOrEditProductModal(course, prodId);
          });
        });

        container.querySelectorAll('[data-del-product]').forEach(btn => {
          btn.addEventListener('click', () => {
            const prodId = btn.getAttribute('data-del-product');
            const liveCourse = getCourseById(course.id) || course;
            const prod = (liveCourse.products || []).find(p => p.id === prodId);
            if (!prod) return;
            openModal('Eliminar Producto Evaluable', `
              <p class="text-sm text-slate-600 mb-5">¿Seguro que deseas eliminar el producto <strong>${esc(prod.title)}</strong> (${esc(prod.weight)}%) y sus calificaciones registradas?</p>
              <div class="flex justify-end gap-2">
                <button type="button" id="cancel-del-prod" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700 cursor-pointer">Cancelar</button>
                <button type="button" id="confirm-del-prod" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold cursor-pointer">Eliminar producto</button>
              </div>
            `, () => {
              document.getElementById('cancel-del-prod').addEventListener('click', closeModal);
              document.getElementById('confirm-del-prod').addEventListener('click', async () => {
                const nowTs = Date.now();
                const currentCourse = getCourseById(course.id) || liveCourse;
                if (!appState.db.meta.deletedProducts) appState.db.meta.deletedProducts = {};
                appState.db.meta.deletedProducts[prodId] = nowTs + 1000;
                currentCourse.products = (currentCourse.products || []).filter(p => p.id !== prodId);
                if (currentCourse.productGrades && currentCourse.productGrades[prodId]) {
                  delete currentCourse.productGrades[prodId];
                }
                currentCourse.updatedAt = nowTs;
                appState.db.meta.structureUpdatedAt = nowTs;
                closeModal();
                renderCourseDetail();
                await saveState(true);
                showToast('Producto eliminado del libro de calificaciones', 'info');
              });
            });
          });
        });

        let gradeSaveDebounce = null;
        container.querySelectorAll('[data-prod-grade-input]').forEach(inp => {
          const handleScoreChange = () => {
            const [prodId, stuId] = inp.getAttribute('data-prod-grade-input').split('|');
            setProductScoreValue(course, prodId, stuId, inp.value);

            const ev = calculateStudentCourseEvaluation(course, stuId);
            const item = ev.productBreakdown.find(b => b.product.id === prodId);
            const ptsLabel = container.querySelector(`[data-prod-pts-label="${prodId}|${stuId}"]`);
            if (ptsLabel && item) {
              ptsLabel.textContent = `= ${item.weightedPts.toFixed(2)} / ${item.weight} pts`;
            }

            const finalBadge = container.querySelector(`[data-final-grade-badge="${stuId}"]`);
            if (finalBadge) {
              finalBadge.textContent = `${ev.finalGrade.toFixed(1)} / 100`;
              finalBadge.className = `inline-block px-3 py-1 rounded-full border text-xs font-extrabold ${
                ev.finalGrade >= 80
                  ? 'bg-emerald-100 text-emerald-800 border-emerald-300'
                  : ev.finalGrade >= 60
                  ? 'bg-amber-100 text-amber-800 border-amber-300'
                  : 'bg-rose-100 text-rose-800 border-rose-300'
              }`;
            }

            clearTimeout(gradeSaveDebounce);
            gradeSaveDebounce = setTimeout(() => {
              saveState({ silent: true, isStructural: true });
            }, 450);
          };

          inp.addEventListener('input', handleScoreChange);
          inp.addEventListener('change', () => {
            handleScoreChange();
            saveState({ silent: true, isStructural: true });
          });
        });

        const exportBtn = document.getElementById('btn-export-gradebook-csv');
        if (exportBtn) {
          exportBtn.addEventListener('click', () => exportCourseGradebookCSV(course));
        }
      }

      function openAddOrEditProductModal(course, prodId) {
        normalizeCourseGrading(course);
        const existing = prodId ? (course.products || []).find(p => p.id === prodId) : null;
        const currentProductsSum = (course.products || [])
          .filter(p => p.id !== prodId)
          .reduce((acc, p) => acc + Number(p.weight || 0), 0);
        const usedByBase =
          Number(course.gradingConfig.platformWeight || 0) +
          Number(course.gradingConfig.attendanceWeight || 0) +
          currentProductsSum;
        const remainingFor100 = Math.max(0, Math.round((100 - usedByBase) * 10) / 10);

        openModal(
          existing ? 'Editar Producto Evaluable' : 'Nuevo Producto Evaluable Independiente',
          `
          <form id="product-modal-form" class="space-y-3.5">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre del Producto</label>
              <input id="pm-title" type="text" required value="${esc(existing ? existing.title : '')}" placeholder="Ej. Proyecto Integrador, Examen Parcial, Exposición..."
                class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Ponderación directa sobre el 100% final (%)</label>
              <input id="pm-weight" type="number" min="0" max="100" step="0.5" required value="${esc(existing ? existing.weight : remainingFor100)}"
                class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm font-bold" />
              <span class="text-[11px] text-slate-500">Porcentaje disponible sugerido para completar 100%: <strong>${remainingFor100}%</strong></span>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Descripción o criterios de evaluación (opcional)</label>
              <textarea id="pm-desc" rows="2" placeholder="Se evalúa independientemente de las secuencias de la plataforma..."
                class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">${esc(existing ? existing.description : '')}</textarea>
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" id="pm-cancel" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700 cursor-pointer">Cancelar</button>
              <button type="submit" class="px-4 py-2 rounded-xl bg-puma-500 hover:bg-puma-600 text-white text-xs font-semibold cursor-pointer">${existing ? 'Guardar cambios' : 'Agregar producto'}</button>
            </div>
          </form>
        `,
          () => {
            document.getElementById('pm-cancel').addEventListener('click', closeModal);
            document.getElementById('product-modal-form').addEventListener('submit', async e => {
              e.preventDefault();
              const title = document.getElementById('pm-title').value.trim();
              const weight = Math.max(0, Math.min(100, Number(document.getElementById('pm-weight').value) || 0));
              const description = document.getElementById('pm-desc').value.trim();
              const nowTs = Date.now();
              const liveCourse = getCourseById(course.id) || course;
              const liveExisting = prodId ? (liveCourse.products || []).find(p => p.id === prodId) : null;

              if (liveExisting) {
                liveExisting.title = title;
                liveExisting.weight = weight;
                liveExisting.description = description;
                liveExisting.updatedAt = nowTs;
              } else {
                const newProdId = uid('prod');
                if (appState.db.meta.deletedProducts) {
                  delete appState.db.meta.deletedProducts[newProdId];
                }
                liveCourse.products = Array.isArray(liveCourse.products) ? liveCourse.products : [];
                liveCourse.products.push({
                  id: newProdId,
                  title,
                  weight,
                  description,
                  updatedAt: nowTs
                });
              }
              liveCourse.updatedAt = nowTs;
              appState.db.meta.structureUpdatedAt = nowTs;
              closeModal();
              renderCourseDetail();
              await saveState(true);
              showToast(liveExisting ? 'Producto actualizado' : 'Producto evaluable agregado', 'success');
            });
          }
        );
      }

      function exportCourseGradebookCSV(course) {
        normalizeCourseGrading(course);
        const roster = getCourseRosterForAttendance(course);
        const products = course.products || [];
        const headers = [
          'Nombre',
          'Usuario',
          'Grupo',
          'Promedio Plataforma (0-100)',
          `Puntos Plataforma (${course.gradingConfig.platformWeight}%)`,
          `Asistencias en ${course.code}`,
          '% Asistencia (0-100)',
          `Puntos Asistencia (${course.gradingConfig.attendanceWeight}%)`,
          ...products.flatMap(p => [`${p.title} (0-100)`, `Puntos ${p.title} (${p.weight}%)`]),
          'Calificacion Final (100)'
        ];

        const rows = roster.map(stu => {
          const ev = calculateStudentCourseEvaluation(course, stu.id);
          return [
            stu.name,
            stu.username,
            stu.group,
            ev.platformAvg.toFixed(1),
            ev.platformWeighted.toFixed(2),
            `${ev.studentAttendanceCount}/${ev.effectiveTotalDays}`,
            ev.attendancePct.toFixed(1),
            ev.attendanceWeighted.toFixed(2),
            ...ev.productBreakdown.flatMap(b => [
              b.score !== null ? b.score : 0,
              b.weightedPts.toFixed(2)
            ]),
            ev.finalGrade.toFixed(1)
          ];
        });

        const csvContent = [headers, ...rows]
          .map(r => r.map(cell => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(','))
          .join('\n');

        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Calificaciones_${course.code}_${getSonoraISODate()}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Archivo CSV descargado', 'success');
      }

      // ==================== ASISTENCIA DIARIA POR MATERIA (QR, MANUAL Y BAJAS) ====================
      function markManualStudentAttendance(course, studentId, dateStr = getSonoraISODate()) {
        if (!course || !studentId) return;
        const stu = getStudentById(studentId);
        if (!stu || isDemoStudentRecord(stu)) return;

        const cleanCourseId = String(course.id).trim();
        const cleanDate = String(dateStr).trim();
        const cleanStudentId = String(stu.id).trim();
        const key = `${cleanCourseId}|${cleanDate}|${cleanStudentId}`;

        if (!appState.db.meta.deletedAttendance) {
          appState.db.meta.deletedAttendance = {};
        }
        delete appState.db.meta.deletedAttendance[key];

        if (!course.enrolledStudentIds.includes(cleanStudentId)) {
          course.enrolledStudentIds.push(cleanStudentId);
        }

        const existingIdx = appState.db.attendance.findIndex(
          a => a.courseId === cleanCourseId && a.date === cleanDate && a.studentId === cleanStudentId
        );

        const record = {
          id: existingIdx >= 0 ? appState.db.attendance[existingIdx].id : uid('att'),
          courseId: cleanCourseId,
          courseTitle: course.title,
          studentId: cleanStudentId,
          studentName: stu.name,
          date: cleanDate,
          time: getSonoraTimeHM(),
          createdAtTs: Date.now()
        };

        if (existingIdx >= 0) {
          appState.db.attendance[existingIdx] = record;
        } else {
          appState.db.attendance.push(record);
        }
      }

      function removeSingleAttendanceRecord(courseId, dateStr, studentId) {
        const cleanCourseId = String(courseId || '').trim();
        const cleanDate = String(dateStr || '').trim();
        const cleanStudentId = String(studentId || '').trim();
        const key = `${cleanCourseId}|${cleanDate}|${cleanStudentId}`;

        if (!appState.db.meta.deletedAttendance) {
          appState.db.meta.deletedAttendance = {};
        }
        appState.db.meta.deletedAttendance[key] = Date.now() + 500;

        appState.db.attendance = (appState.db.attendance || []).filter(
          a => !(a.courseId === cleanCourseId && a.date === cleanDate && a.studentId === cleanStudentId)
        );
      }

      // ==================== ESCÁNER QR DEL ESTUDIANTE (AISLADO POR ALUMNO Y MATERIA) ====================
      function openStudentAttendanceScannerModal(courseContext) {
        if (!appState.session || appState.session.role !== 'student') return;
        const activeStudent = appState.session.user;

        openModal(
          courseContext ? `Registrar Asistencia · ${courseContext.title}` : 'Escanear Código QR de Asistencia',
          `
          <div id="scanner-view-body" class="space-y-4">
            <div class="p-3 rounded-xl bg-blue-50 border border-blue-200 text-xs text-blue-800 flex items-center justify-between">
              <span>Alumno autenticado: <strong>${esc(activeStudent.name)}</strong></span>
              <span class="font-mono">@${esc(activeStudent.username)}</span>
            </div>
            <div id="qr-reader" class="w-full rounded-2xl overflow-hidden border border-slate-300 bg-slate-900 min-h-[240px]"></div>
            <div class="pt-2 border-t border-slate-200">
              <label class="block text-xs font-semibold text-slate-600 mb-1">¿Tu cámara no abre? Pega aquí el código manual proyectado por el docente:</label>
              <div class="flex gap-2">
                <input id="manual-qr-input" type="text" placeholder="PUMA_ASISTENCIA|..."
                  class="flex-1 rounded-xl border border-slate-300 px-3 py-2 text-xs font-mono" />
                <button type="button" id="btn-manual-qr-submit"
                  class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold cursor-pointer">
                  Registrar
                </button>
              </div>
            </div>
          </div>
        `,
          async () => {
            // Sincronizar primero con la nube por si el docente eliminó una asistencia previa y el alumno desea re-escanear
            await syncNow({ push: false, silent: true, skipRender: true });

            let isProcessingScan = false;

            async function processScannedPayload(rawText) {
              if (isProcessingScan) return false;
              const parts = String(rawText || '').trim().split('|');
              if (parts[0] !== 'PUMA_ASISTENCIA' || parts.length < 3) {
                showToast('El código QR escaneado no corresponde a una asistencia válida.', 'error');
                return false;
              }

              isProcessingScan = true;
              const scannedCourseId = String(parts[1] || '').trim();
              const scannedDate = String(parts[2] || '').trim();
              const scannedGistId = parts[3] ? String(parts[3]).trim() : '';

              if (scannedGistId) {
                const cfg = getCloudConfig();
                if (!cfg.gistId || cfg.gistId !== scannedGistId) {
                  saveCloudConfig(cfg.token, scannedGistId);
                }
              }

              // Descargar estado fresco justo antes de registrar para respetar bajas recientes del docente
              await syncNow({ push: false, silent: true, skipRender: true });

              const currentStudent = appState.session?.user;
              if (!currentStudent || !currentStudent.id || currentStudent.id === 'admin') {
                isProcessingScan = false;
                showToast('Sesión de estudiante inválida.', 'error');
                return false;
              }

              const cleanStudentId = String(currentStudent.id).trim();
              const targetCourse = getCourseById(scannedCourseId) || courseContext;
              const attKey = `${scannedCourseId}|${scannedDate}|${cleanStudentId}`;

              // Si el alumno vuelve a escanear después de que el docente borró su asistencia, limpiar la marca de baja
              if (appState.db.meta && appState.db.meta.deletedAttendance) {
                delete appState.db.meta.deletedAttendance[attKey];
              }

              // Auto-inscribir únicamente a este estudiante en la materia si aún no estaba en la lista
              if (targetCourse && Array.isArray(targetCourse.enrolledStudentIds)) {
                if (!targetCourse.enrolledStudentIds.includes(cleanStudentId)) {
                  targetCourse.enrolledStudentIds.push(cleanStudentId);
                }
              }

              if (!Array.isArray(appState.db.attendance)) {
                appState.db.attendance = [];
              }

              const already = appState.db.attendance.find(
                a => a.courseId === scannedCourseId && a.date === scannedDate && a.studentId === cleanStudentId
              );

              const nowTime = getSonoraTimeHM();
              if (!already) {
                appState.db.attendance.push({
                  id: uid('att'),
                  courseId: scannedCourseId,
                  courseTitle: targetCourse ? targetCourse.title : scannedCourseId,
                  studentId: cleanStudentId,
                  studentName: currentStudent.name,
                  date: scannedDate,
                  time: nowTime,
                  createdAtTs: Date.now()
                });
              } else {
                already.time = already.time || nowTime;
                already.createdAtTs = Date.now();
              }

              stopActiveQrScanner();

              const body = document.getElementById('scanner-view-body');
              if (body) {
                body.innerHTML = `
                  <div class="text-center py-4">
                    <div class="w-14 h-14 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto mb-3 text-2xl font-extrabold">✓</div>
                    <h4 class="text-base font-extrabold text-slate-900 mb-1">
                      ${esc(currentStudent.name)}
                    </h4>
                    <p class="text-sm text-slate-600 mb-1">
                      Tu asistencia del día <strong>${esc(scannedDate)}</strong> (${esc(nowTime)} hrs Sonora) ha sido registrada.
                    </p>
                    ${
                      targetCourse
                        ? `<p class="text-xs font-bold text-puma-600 mb-3">Materia: ${esc(targetCourse.title)} (${esc(targetCourse.code)})</p>`
                        : ''
                    }
                    <p id="att-cloud-sync-note" class="text-xs font-semibold text-blue-600 mb-5">
                      Sincronizando asistencia en tiempo real con el docente...
                    </p>
                    <button type="button" id="btn-att-done" class="px-6 py-2.5 rounded-xl bg-navy-900 hover:bg-navy-800 text-white text-xs font-bold cursor-pointer">
                      Aceptar
                    </button>
                  </div>
                `;
                document.getElementById('btn-att-done').addEventListener('click', () => {
                  closeModal();
                  renderMain();
                });
              }

              const syncRes = await saveState({ isStructural: false, silent: true });
              const noteEl = document.getElementById('att-cloud-sync-note');
              if (noteEl) {
                noteEl.textContent = syncRes.ok
                  ? '✓ Asistencia sincronizada en tiempo real en la pantalla del docente.'
                  : '✓ Asistencia guardada en el dispositivo.';
                noteEl.className = syncRes.ok
                  ? 'text-xs font-semibold text-emerald-600 mb-5'
                  : 'text-xs font-semibold text-amber-600 mb-5';
              }
              return true;
            }

            const manualBtn = document.getElementById('btn-manual-qr-submit');
            if (manualBtn) {
              manualBtn.addEventListener('click', () => {
                const raw = document.getElementById('manual-qr-input').value.trim();
                if (raw) processScannedPayload(raw);
              });
            }

            if (window.Html5Qrcode) {
              try {
                const scanner = new Html5Qrcode('qr-reader');
                activeQrScannerInstance = scanner;
                scanner
                  .start(
                    { facingMode: 'environment' },
                    { fps: 10, qrbox: { width: 220, height: 220 } },
                    decodedText => {
                      processScannedPayload(decodedText);
                    },
                    () => {}
                  )
                  .catch(() => {});
              } catch (e) {}
            }
          }
        );
      }
