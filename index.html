    function getSonoraDateParts(dateObj = new Date()) {
      try {
        const fmt = new Intl.DateTimeFormat('en-CA', {
          timeZone: SONORA_TIMEZONE,
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
        const parts = {};
        fmt.formatToParts(dateObj).forEach(p => { parts[p.type] = p.value; });
        return {
          year: Number(parts.year),
          month: Number(parts.month) - 1,
          dateStr: `${parts.year}-${parts.month}-${parts.day}`,
          timeShort: `${parts.hour}:${parts.minute}`,
          timeFull: `${parts.hour}:${parts.minute}:${parts.second}`
        };
      } catch (e) {
        const iso = dateObj.toISOString();
        return {
          year: dateObj.getFullYear(),
          month: dateObj.getMonth(),
          dateStr: iso.slice(0, 10),
          timeShort: dateObj.toTimeString().slice(0, 5),
          timeFull: dateObj.toTimeString().slice(0, 8)
        };
      }
    }

    function normalizeCourseGrading(course) {
      if (!course || typeof course !== 'object') return course;

      if (!dbObj.meta.deletedStudents || typeof dbObj.meta.deletedStudents !== 'object') {
        dbObj.meta.deletedStudents = {};
      }
      const purgedIds = new Set(['s-demo-1', 'std-1', 'stu-demo', 'demo-1']);
      if (Array.isArray(dbObj.students)) {
        dbObj.students.forEach(s => {
          if (isDemoStudentRecord(s) && s.id) purgedIds.add(String(s.id));
        });
        dbObj.students = dbObj.students.filter(s => !isDemoStudentRecord(s) && !purgedIds.has(String(s?.id || '')));
      }
      purgedIds.forEach(id => {
        dbObj.meta.deletedStudents[id] = Math.max(Number(dbObj.meta.deletedStudents[id] || 0), 9999999999999);
      });

      // Filtrar cursos eliminados explícitamente
      if (Array.isArray(dbObj.courses)) {
        dbObj.courses = dbObj.courses
          .filter(c => {
            if (!c || !c.id) return false;
            const delTs = Number(dbObj.meta.deletedCourses[c.id] || 0);
            const itemTs = Number(c.updatedAt || 1);
            return !(delTs > 0 && delTs >= itemTs);
          })
          .map(c => {
            if (Array.isArray(c.enrolledStudentIds)) {
              c.enrolledStudentIds = c.enrolledStudentIds.filter(id => !purgedIds.has(String(id)));
            }
            return normalizeCourseGrading(c);
          });
      }

      if (Array.isArray(dbObj.submissions)) {
        dbObj.submissions = dbObj.submissions.filter(sub => !purgedIds.has(String(sub?.studentId || '')));
      }
      if (Array.isArray(dbObj.attendance)) {

          return !purgedIds.has(sid) && !sname.includes('alumno demostración') && !sname.includes('alumno de demostración');

      }
      return dbObj;
    }

        submissions: Array.isArray(base.submissions) ? base.submissions : [],
        attendance: Array.isArray(base.attendance) ? base.attendance : []

      return purgeDemoAndDeletedData(normalized);

    async function fetchWithTimeout(url, options = {}, timeoutMs = 3500) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: ctrl.signal });
      } finally {
        clearTimeout(timer);

    function mergeTimestampMaps(mapA = {}, mapB = {}) {
      const out = { ...(mapA || {}) };
      Object.entries(mapB || {}).forEach(([k, v]) => {
        const ts = Number(v || 0);
        if (ts > Number(out[k] || 0)) out[k] = ts;
      });
      return out;
    }

    function mergeOrderedCollectionById(remoteArr = [], localArr = [], deletedMap = {}, preferLocalOrder = true) {
      const primary = preferLocalOrder ? localArr : remoteArr;
      const secondary = preferLocalOrder ? remoteArr : localArr;
      const itemMap = new Map();

      [...(secondary || []), ...(primary || [])].forEach(item => {
        if (!item || !item.id) return;
        const delTs = Number(deletedMap[item.id] || 0);
        const itemTs = Number(item.updatedAt || 1);
        if (delTs > 0 && delTs >= itemTs) return;
        const existing = itemMap.get(item.id);
        if (!existing || itemTs >= Number(existing.updatedAt || 1)) {
          itemMap.set(item.id, JSON.parse(JSON.stringify(item)));
        }
      });

      const orderedIds = [];
      const seen = new Set();
      [...(primary || []), ...(secondary || [])].forEach(item => {
        if (item && item.id && itemMap.has(item.id) && !seen.has(item.id)) {
          seen.add(item.id);
          orderedIds.push(item.id);
        }
      });
      return orderedIds.map(id => itemMap.get(id));
    }

    function mergeCourseModulesGranular(remoteModules = [], localModules = [], metaDeleted = {}, preferLocalOrder = true) {
      const baseMerged = mergeOrderedCollectionById(remoteModules, localModules, metaDeleted.deletedModules || {}, preferLocalOrder);
      const rMap = new Map((remoteModules || []).map(m => [m.id, m]));
      const lMap = new Map((localModules || []).map(m => [m.id, m]));

      return baseMerged.map(mod => {
        const rMod = rMap.get(mod.id) || {};
        const lMod = lMap.get(mod.id) || {};
        const rTr = rMod.teacherTranscript || {};
        const lTr = lMod.teacherTranscript || {};
        const chosenTranscript = Number(lTr.updatedAt || 0) >= Number(rTr.updatedAt || 0) ? lTr : rTr;

        return {
          ...mod,
          teacherTranscript: {
            rawText: String(chosenTranscript.rawText || ''),
            summary: String(chosenTranscript.summary || ''),
            updatedAt: Number(chosenTranscript.updatedAt || 0)
          },
          resources: mergeOrderedCollectionById(rMod.resources || [], lMod.resources || [], metaDeleted.deletedResources || {}, preferLocalOrder),
          assignments: mergeOrderedCollectionById(rMod.assignments || [], lMod.assignments || [], metaDeleted.deletedAssignments || {}, preferLocalOrder)
        };
      });
    }

    function mergeDatabases(remoteRaw, localRaw) {
      const remote = normalizeDatabase(remoteRaw);
      const local = normalizeDatabase(localRaw);

      const mergedDeletedCourses = mergeTimestampMaps(
        loadPersistedDeletedCourses(),
        mergeTimestampMaps(remote.meta.deletedCourses, local.meta.deletedCourses)
      );
      savePersistedDeletedCourses(mergedDeletedCourses);

      const mergedDeletedModules = mergeTimestampMaps(remote.meta.deletedModules, local.meta.deletedModules);
      const mergedDeletedResources = mergeTimestampMaps(remote.meta.deletedResources, local.meta.deletedResources);
      const mergedDeletedAssignments = mergeTimestampMaps(remote.meta.deletedAssignments, local.meta.deletedAssignments);
      const mergedDeletedAnnouncements = mergeTimestampMaps(remote.meta.deletedAnnouncements, local.meta.deletedAnnouncements);
      const mergedDeletedProducts = mergeTimestampMaps(remote.meta.deletedProducts, local.meta.deletedProducts);
      const mergedDeletedAttendance = mergeTimestampMaps(remote.meta.deletedAttendance, local.meta.deletedAttendance);
      const mergedDeletedSubmissions = mergeTimestampMaps(remote.meta.deletedSubmissions, local.meta.deletedSubmissions);
      const mergedDeletedStudents = mergeTimestampMaps(remote.meta.deletedStudents, local.meta.deletedStudents);

      const preferLocal = local.meta.structureUpdatedAt >= remote.meta.structureUpdatedAt;
      const metaDelBundle = {
        deletedModules: mergedDeletedModules,
        deletedResources: mergedDeletedResources,
        deletedAssignments: mergedDeletedAssignments
      };

      const baseCourses = mergeOrderedCollectionById(remote.courses, local.courses, mergedDeletedCourses, preferLocal);
      const rCourseMap = new Map((remote.courses || []).map(c => [c.id, c]));
      const lCourseMap = new Map((local.courses || []).map(c => [c.id, c]));

      const chosenCourses = baseCourses.map(course => {
        const rCourse = rCourseMap.get(course.id) || {};
        const lCourse = lCourseMap.get(course.id) || {};
        const enrolledSet = new Set([
          ...(Array.isArray(rCourse.enrolledStudentIds) ? rCourse.enrolledStudentIds : []),
          ...(Array.isArray(lCourse.enrolledStudentIds) ? lCourse.enrolledStudentIds : [])
        ]);

        const rGc = rCourse.gradingConfig || {};
        const lGc = lCourse.gradingConfig || {};
        const chosenGc = Number(lGc.updatedAt || 1) >= Number(rGc.updatedAt || 1) ? lGc : rGc;

        const mergedProducts = mergeOrderedCollectionById(rCourse.products || [], lCourse.products || [], mergedDeletedProducts, preferLocal);
        const mergedAnnouncements = mergeOrderedCollectionById(rCourse.announcements || [], lCourse.announcements || [], mergedDeletedAnnouncements, preferLocal);
        const mergedModules = mergeCourseModulesGranular(rCourse.modules || [], lCourse.modules || [], metaDelBundle, preferLocal);

        const mergedProdGrades = {};
        const allProdIds = new Set([
          ...Object.keys(rCourse.productGrades || {}),
          ...Object.keys(lCourse.productGrades || {})
        ]);
        allProdIds.forEach(pid => {
          mergedProdGrades[pid] = {};
          const rG = (rCourse.productGrades && rCourse.productGrades[pid]) || {};
          const lG = (lCourse.productGrades && lCourse.productGrades[pid]) || {};
          new Set([...Object.keys(rG), ...Object.keys(lG)]).forEach(sid => {
            if (mergedDeletedStudents[sid]) return;
            const rE = rG[sid];
            const lE = lG[sid];
            const rO = rE && typeof rE === 'object' ? rE : (rE !== undefined ? { score: Number(rE), updatedAt: 1 } : null);
            const lO = lE && typeof lE === 'object' ? lE : (lE !== undefined ? { score: Number(lE), updatedAt: 1 } : null);
            if (rO && lO) {
              mergedProdGrades[pid][sid] = Number(lO.updatedAt || 0) >= Number(rO.updatedAt || 0) ? lO : rO;
            } else {
              mergedProdGrades[pid][sid] = lO || rO;
            }
          });
        });

        return normalizeCourseGrading({
          ...course,
          enrolledStudentIds: Array.from(enrolledSet).filter(id => !mergedDeletedStudents[id]),
          gradingConfig: chosenGc,
          products: mergedProducts,
          productGrades: mergedProdGrades,
          announcements: mergedAnnouncements,
          modules: mergedModules
        });
      });

      // Estudiantes
      const stuMap = new Map();
      [...remote.students, ...local.students].forEach(stu => {
        if (!stu || !stu.id || isDemoStudentRecord(stu)) return;
        const delTs = Number(mergedDeletedStudents[stu.id] || 0);
        const itemTs = Number(stu.updatedAt || 1);
        if (delTs > itemTs) return;
        const prev = stuMap.get(stu.id);
        if (!prev || itemTs >= Number(prev.updatedAt || 0)) stuMap.set(stu.id, stu);
      });

      // Entregas
      const subMap = new Map();
      [...remote.submissions, ...local.submissions].forEach(sub => {
        if (!sub || !sub.courseId || !sub.assignmentId || !sub.studentId) return;
        if (mergedDeletedCourses[sub.courseId]) return;
        const key = getSubmissionKey(sub);
        const delTs = Number(mergedDeletedSubmissions[key] || 0);
        const itemTs = Number(sub.updatedAt || 1);
        if (delTs > itemTs) return;
        const prev = subMap.get(key);
        if (!prev || itemTs >= Number(prev.updatedAt || 0)) subMap.set(key, sub);
      });

      // Asistencias por materia (courseId|date|studentId)
      const attMap = new Map();
      [...remote.attendance, ...local.attendance].forEach(att => {
        if (!att || !att.courseId || !att.date || !att.studentId) return;
        if (mergedDeletedCourses[att.courseId]) return;
        const cleanStudentId = String(att.studentId).trim();
        if (!cleanStudentId || cleanStudentId === 'admin' || DEMO_STUDENT_IDS.has(cleanStudentId)) return;
        const key = getAttendanceKey(att);
        const delTs = Number(mergedDeletedAttendance[key] || 0);
        const itemTs = Number(att.createdAtTs || 1);
        if (delTs >= itemTs) return;
        const prev = attMap.get(key);
        if (!prev || itemTs >= Number(prev.createdAtTs || 0)) {
          attMap.set(key, { ...att, studentId: cleanStudentId });
        }
      });

      return purgeDemoAndDeletedData({
        meta: {
          structureUpdatedAt: Math.max(remote.meta.structureUpdatedAt, local.meta.structureUpdatedAt),
          deletedCourses: mergedDeletedCourses,
          deletedModules: mergedDeletedModules,
          deletedResources: mergedDeletedResources,
          deletedAssignments: mergedDeletedAssignments,
          deletedAnnouncements: mergedDeletedAnnouncements,
          deletedProducts: mergedDeletedProducts,
          deletedAttendance: mergedDeletedAttendance,
          deletedSubmissions: mergedDeletedSubmissions,
          deletedStudents: mergedDeletedStudents
        },
        courses: chosenCourses,
        students: Array.from(stuMap.values()),
        submissions: Array.from(subMap.values()),
        attendance: Array.from(attMap.values())
      });
    }

    async function fetchKvdbMaster() {
      try {
        const key = getKvdbMasterKey();
        const res = await fetchWithTimeout(`${REALTIME_ATT_API}/${encodeURIComponent(key)}?_t=${Date.now()}`, {
          headers: { Accept: 'application/json' }
        });
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function pushKvdbMaster(dbPayload) {
      try {
        const key = getKvdbMasterKey();
        const res = await fetchWithTimeout(`${REALTIME_ATT_API}/${encodeURIComponent(key)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dbPayload)
        });
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    async function fetchGistMaster() {
      const cfg = getCloudConfig();
      const gistId = cfg.gistId || DEFAULT_PUBLIC_GIST_ID;
      if (!gistId) return null;
      try {
        let res = await fetchWithTimeout(`https://api.github.com/gists/${encodeURIComponent(gistId)}?_t=${Date.now()}`, {
          headers: buildGitHubHeaders(cfg.token, false)
        });
        if (res.status === 401 || res.status === 403) {
          res = await fetchWithTimeout(`https://api.github.com/gists/${encodeURIComponent(gistId)}?_t=${Date.now()}`, {
            headers: { Accept: 'application/vnd.github+json' }
          });
        }
        if (!res.ok) return null;
        const data = await res.json();
        const fileObj = data.files && (data.files['puma_steam_db.json'] || Object.values(data.files)[0]);
        if (!fileObj || !fileObj.content) return null;
        return JSON.parse(fileObj.content);
      } catch (e) {
        return null;
      }
    }

    async function pushGistMaster(dbPayload) {
      const cfg = getCloudConfig();
      if (!cfg.token) return false;
      const gistId = cfg.gistId || DEFAULT_PUBLIC_GIST_ID;
      try {
        const res = await fetchWithTimeout(`https://api.github.com/gists/${encodeURIComponent(gistId)}`, {
          method: 'PATCH',
          headers: buildGitHubHeaders(cfg.token, true),
          body: JSON.stringify({
            description: 'PLATAFORMA PUMA STEAM - Base de datos sincronizada en tiempo real',
            files: { 'puma_steam_db.json': { content: JSON.stringify(dbPayload, null, 2) } }
          })
        });
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    let syncLockPromise = Promise.resolve({ ok: true });

    function isUserTyping() {
      const active = document.activeElement;
      if (!active) return false;
      const tag = active.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || active.isContentEditable;

    function updateRealtimeIndicator() {
      const badge = document.getElementById('realtime-sync-badge');
      if (badge) {
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 pulse-dot inline-block mr-1.5"></span>En vivo${appState.lastSyncTime ? ' · ' + esc(appState.lastSyncTime) : ''}`;
      }
    }

    function syncNow({ push = false, silent = true, forceRender = false } = {}) {
      syncLockPromise = syncLockPromise
        .then(async () => {
          appState.cloudSyncing = true;
          try {
            const beforeJson = JSON.stringify(appState.db);
            const [kvRemote, gistRemote] = await Promise.all([fetchKvdbMaster(), fetchGistMaster()]);
            let working = appState.db;
            if (gistRemote) working = mergeDatabases(gistRemote, working);
            if (kvRemote) working = mergeDatabases(kvRemote, working);

            appState.db = working;
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.db));
            } catch (e) {}

            let pushOk = true;
            const afterJson = JSON.stringify(appState.db);
            const changed = beforeJson !== afterJson;

            if (push || changed) {
              const [kvOk, gistOk] = await Promise.all([
                pushKvdbMaster(appState.db),
                pushGistMaster(appState.db)
              ]);
              pushOk = Boolean(kvOk || gistOk);
            }

            appState.lastSyncTime = getNowTimeFull();
            appState.initialCloudReady = true;
            updateRealtimeIndicator();

            if (changed || forceRender) {
              refreshActiveViewSafely();
            }
            if (!silent && push) {
              showToast('Sincronizado en tiempo real con la nube', 'success');
            }
            return { ok: pushOk, changed };
          } catch (e) {
            return { ok: false, error: e?.message || 'Error de red' };
          } finally {
            appState.cloudSyncing = false;
          }
        })
        .catch(() => ({ ok: false }));
      return syncLockPromise;
    }

    function getCourseById(courseId) {

    }

    function getStudentById(studentId) {

    function getSubmission(courseId, assignmentId, studentId) {
      return (appState.db.submissions || []).find(
        s => s.courseId === courseId && s.assignmentId === assignmentId && s.studentId === studentId
      ) || null;

    function getProductScoreValue(course, productId, studentId) {
      if (!course || !course.productGrades || !course.productGrades[productId]) return null;
      const entry = course.productGrades[productId][studentId];
      if (entry === null || entry === undefined || entry === '') return null;
      if (typeof entry === 'object') {
        if (entry.score === null || entry.score === undefined || entry.score === '') return null;
        const n = Number(entry.score);
        return Number.isFinite(n) ? n : null;
      }
      const n = Number(entry);
      return Number.isFinite(n) ? n : null;
    }

    function setProductScoreValue(course, productId, studentId, rawScore) {
      if (!course.productGrades || typeof course.productGrades !== 'object') course.productGrades = {};
      if (!course.productGrades[productId] || typeof course.productGrades[productId] !== 'object') {
        course.productGrades[productId] = {};
      }
      if (rawScore === '' || rawScore === null || rawScore === undefined) {
        course.productGrades[productId][studentId] = { score: null, updatedAt: Date.now() };
        return;
      }
      const clamped = Math.max(0, Math.min(100, Number(rawScore)));
      course.productGrades[productId][studentId] = {
        score: Number.isFinite(clamped) ? Math.round(clamped * 10) / 10 : null,
        updatedAt: Date.now()
      };
    }

    function calculateStudentCourseEvaluation(course, studentId) {
      normalizeCourseGrading(course);
      const cfg = course.gradingConfig;
      const products = Array.isArray(course.products) ? course.products : [];

      const allAssignments = [];
      (course.modules || []).forEach(m => {
        (m.assignments || []).forEach(a => allAssignments.push(a));
      });

      let platformAvg = 0;
      let gradedAssignmentsCount = 0;
      if (allAssignments.length > 0) {
        let sumNormalized = 0;
        allAssignments.forEach(a => {
          const sub = getSubmission(course.id, a.id, studentId);
          if (sub && sub.grade !== null && sub.grade !== undefined && sub.grade !== '') {
            const maxPts = Number(a.maxPoints) > 0 ? Number(a.maxPoints) : 100;
            const norm = Math.max(0, Math.min(100, (Number(sub.grade) / maxPts) * 100));
            sumNormalized += norm;
            gradedAssignmentsCount += 1;
          }
        });
        platformAvg = sumNormalized / allAssignments.length;
      }
      const platformWeighted = (platformAvg * Number(cfg.platformWeight || 0)) / 100;

      const courseAttendance = (appState.db.attendance || []).filter(
        a => a.courseId === course.id && a.studentId && a.studentId !== 'admin'
      );
      const uniqueCourseDates = new Set(courseAttendance.map(a => a.date));
      const totalRecordedDays = uniqueCourseDates.size;
      const effectiveTotalDays = Number(cfg.expectedSessions) > 0 ? Number(cfg.expectedSessions) : totalRecordedDays;

      const studentDates = new Set(
        courseAttendance.filter(a => a.studentId === studentId).map(a => a.date)
      );
      const studentAttendanceCount = studentDates.size;

      let attendancePct = 0;
      if (effectiveTotalDays > 0) {
        attendancePct = Math.min(100, (studentAttendanceCount / effectiveTotalDays) * 100);
      }
      const attendanceWeighted = (attendancePct * Number(cfg.attendanceWeight || 0)) / 100;

      let productsWeightedTotal = 0;
      const productBreakdown = products.map(p => {
        const score = getProductScoreValue(course, p.id, studentId);
        const numericScore = score !== null ? score : 0;
        const w = Number(p.weight || 0);
        const weightedPts = (numericScore * w) / 100;
        productsWeightedTotal += weightedPts;
        return { product: p, score, numericScore, weight: w, weightedPts };
      });

      const productsWeightSum = products.reduce((acc, p) => acc + Number(p.weight || 0), 0);
      const totalConfiguredWeight = Number(cfg.platformWeight || 0) + Number(cfg.attendanceWeight || 0) + productsWeightSum;
      const finalGrade = Math.max(0, Math.min(100, platformWeighted + attendanceWeighted + productsWeightedTotal));

      return {
        totalAssignments: allAssignments.length,
        gradedAssignmentsCount,
        platformAvg,
        platformWeight: Number(cfg.platformWeight || 0),
        platformWeighted,
        studentAttendanceCount,
        effectiveTotalDays,
        totalRecordedDays,
        attendancePct,
        attendanceWeight: Number(cfg.attendanceWeight || 0),
        attendanceWeighted,
        productBreakdown,
        productsWeightSum,
        productsWeightedTotal,
        totalConfiguredWeight,
        finalGrade
      };
    }

    async function generateTeacherSummaryWithAI(rawTranscript, courseTitle, sequenceTitle) {
      const text = String(rawTranscript || '').trim();
      if (!text) return '';

      const apiKey = getGeminiApiKey();
      if (apiKey) {
        try {
          const prompt = `Eres un asistente pedagógico de nivel bachillerato en la Plataforma PUMA STEAM.
Materia: "${courseTitle}"
Secuencia didáctica: "${sequenceTitle}"

A partir de la siguiente transcripción hablada de la explicación del docente en clase, genera un resumen estructurado, claro y didáctico para los estudiantes que incluya:
1. Ideas Clave Explicadas por el Docente (viñetas claras).
2. Conceptos Fundamentales Mencionados.
3. Recomendaciones o Acciones para los Estudiantes.

Transcripción del docente:
"""
${text}
"""`;
          const res = await fetchWithTimeout(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { temperature: 0.35 }
              })
            },
            12000
          );
          if (res.ok) {
            const data = await res.json();
            const candidateText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (candidateText) return candidateText.trim();
          }
        } catch (e) {}
      }

      // Motor estructurador inteligente integrado (fallback automático sin requerir llave externa)
      const cleanSentences = text
        .replace(/\s+/g, ' ')
        .split(/(?<=[.?!;])\s+|\n+/)
        .map(s => s.trim())
        .filter(s => s.length > 8);

      const words = text
        .toLowerCase()
        .replace(/[^a-záéíóúñü0-9\s]/gi, '')
        .split(/\s+/)
        .filter(w => w.length > 5 && !['porque', 'cuando', 'también', 'entonces', 'vamos', 'tienen', 'pueden', 'dentro', 'sobre', 'donde', 'estamos', 'hacer', 'manera'].includes(w));

      const freq = {};
      words.forEach(w => { freq[w] = (freq[w] || 0) + 1; });
      const topKeywords = Object.entries(freq)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 6)
        .map(([w]) => w.charAt(0).toUpperCase() + w.slice(1));

      const keyPoints = cleanSentences.slice(0, 5).map(s => `• ${s.endsWith('.') ? s : s + '.'}`);
      const actionSentences = cleanSentences.filter(s =>
        /tarea|práctica|entreg|realiz|investig|estudi|recuerd|importan|examen|proyecto|calcular|subir/i.test(s)
      );

      return [
        `📌 RESUMEN EJECUTIVO DE LA EXPLICACIÓN (${sequenceTitle})`,
        ``,
        `🔹 Puntos Clave Explicados por el Docente:`,
        ...(keyPoints.length ? keyPoints : [`• ${text}`]),
        ``,
        `🧠 Conceptos Centrales Detectados:`,
        topKeywords.length ? `• ${topKeywords.join(' · ')}` : `• Contenidos fundamentales de ${sequenceTitle}`,
        ``,
        `✅ Indicaciones y Seguimiento para el Estudiante:`,
        ...(actionSentences.length
          ? actionSentences.slice(0, 3).map(s => `• ${s}`)
          : [`• Repasar los puntos expuestos en esta secuencia y consultar los materiales adjuntos.`])
      ].join('\n');
    }

          </div>

          </div>
        </div>`,
        () => {
          const rawEl = document.getElementById('inp-teacher-raw');
          const sumEl = document.getElementById('inp-teacher-summary');
          const interimEl = document.getElementById('live-interim-preview');
          const pillEl = document.getElementById('mic-status-pill');
          const btnStart = document.getElementById('btn-start-mic');
          const btnStop = document.getElementById('btn-stop-mic');
          const btnAi = document.getElementById('btn-generate-ai-summary');

          document.getElementById('btn-cancel-tr').addEventListener('click', closeModal);

          document.getElementById('btn-save-gemini-key').addEventListener('click', () => {
            saveGeminiApiKey(document.getElementById('inp-gemini-key').value);
            showToast('Clave Gemini guardada en este navegador', 'success');
          });

          document.getElementById('btn-clear-transcript').addEventListener('click', () => {
            rawEl.value = '';
            sumEl.value = '';
            interimEl.textContent = '';
          });

          btnStart.addEventListener('click', () => {
            if (!SpeechRec) {
              showToast('Tu navegador no soporta dictado directo por voz. Usa Chrome o Edge, o escribe el texto.', 'error');
              return;
            }
            stopActiveSpeechRecognition();
            const rec = new SpeechRec();
            activeSpeechRecognition = rec;
            rec.lang = 'es-MX';
            rec.continuous = true;
            rec.interimResults = true;

            rec.onstart = () => {
              pillEl.textContent = '🔴 Escuchando al docente...';
              pillEl.className = 'shrink-0 px-2.5 py-1 rounded-full text-[11px] font-bold bg-rose-600 text-white mic-recording';
              btnStart.classList.add('hidden');
              btnStop.classList.remove('hidden');
            };

            rec.onresult = event => {
              let interimTranscript = '';
              let finalChunk = '';
              for (let i = event.resultIndex; i < event.results.length; i++) {
                const txt = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                  finalChunk += txt + ' ';
                } else {
                  interimTranscript += txt;
                }
              }
              if (finalChunk) {
                rawEl.value = (rawEl.value ? rawEl.value.trim() + ' ' : '') + finalChunk.trim();
              }
              interimEl.textContent = interimTranscript ? `Escuchando: "${interimTranscript}"` : '';
            };

            rec.onerror = () => {
              pillEl.textContent = 'Micrófono pausado';
              pillEl.className = 'shrink-0 px-2.5 py-1 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800';
              btnStart.classList.remove('hidden');
              btnStop.classList.add('hidden');
            };

            rec.onend = () => {
              pillEl.textContent = 'Grabación finalizada';
              pillEl.className = 'shrink-0 px-2.5 py-1 rounded-full text-[11px] font-bold bg-slate-200 text-slate-700';
              btnStart.classList.remove('hidden');
              btnStop.classList.add('hidden');
              interimEl.textContent = '';
            };

            try {
              rec.start();
            } catch (e) {}
          });

          btnStop.addEventListener('click', () => {
            stopActiveSpeechRecognition();
          });

          btnAi.addEventListener('click', async () => {
            const rawText = rawEl.value.trim();
            if (!rawText) {
              showToast('Primero graba con el micrófono o escribe la explicación del docente.', 'error');
              return;
            }
            btnAi.disabled = true;
            btnAi.innerHTML = '<span>⏳ Procesando resumen con Gemini IA...</span>';
            try {
              const generated = await generateTeacherSummaryWithAI(rawText, course.title, mod.title);
              sumEl.value = generated;
              showToast('Resumen generado con éxito', 'success');
            } finally {
              btnAi.disabled = false;
              btnAi.innerHTML = '<span>✨ Generar Resumen con Gemini IA</span>';
            }
          });

          document.getElementById('btn-save-tr').addEventListener('click', async () => {
            stopActiveSpeechRecognition();
            const liveCourse = getCourseById(courseId);
            const liveMod = (liveCourse?.modules || []).find(m => m.id === moduleId);
            if (!liveMod) return;

            let rawText = rawEl.value.trim();
            let summaryText = sumEl.value.trim();
            if (rawText && !summaryText) {
              summaryText = await generateTeacherSummaryWithAI(rawText, liveCourse.title, liveMod.title);
            }

            const now = Date.now();
            liveMod.teacherTranscript = {
              rawText,
              summary: summaryText,
              updatedAt: now
            };
            liveMod.updatedAt = now;
            liveCourse.updatedAt = now;

            closeModal();
            renderMain();
            await saveState(true);
            showToast('Transcripción y resumen del maestro publicados en tiempo real', 'success');
          });
        },
        'max-w-2xl'
      );
    }

    function refreshOpenAttendanceModalIfVisible() {

      );
      const todayRecords = (appState.db.attendance || []).filter(
        a => a.courseId === courseId && a.date === dateStr && a.studentId !== 'admin'
      );
      const presentIds = new Set(todayRecords.map(r => r.studentId));

      container.innerHTML = `
        <div class="space-y-3">
          <div class="bg-amber-50 border border-amber-200 rounded-xl p-3">

                : `<div class="max-h-36 overflow-y-auto divide-y divide-amber-200/60">

                      .map(
                        stu => `<div class="py-1.5 flex items-center justify-between gap-2 text-xs">

                        </div>`
                      )
                      .join('')}
                  </div>`
            }
          </div>

          <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3">
            <div class="flex items-center justify-between mb-2">
              <h4 class="text-xs font-bold text-emerald-950">Asistencias registradas hoy en ${esc(course.title)} (${todayRecords.length})</h4>
              <span class="text-[11px] text-emerald-700">${esc(dateStr)}</span>
            </div>

              todayRecords.length === 0
                ? `<p class="text-xs text-slate-500">Ningún estudiante ha registrado asistencia todavía en esta materia hoy.</p>`
                : `<div class="max-h-40 overflow-y-auto divide-y divide-emerald-200/60">
                    ${todayRecords
                      .map(
                        r => `<div class="py-1.5 flex items-center justify-between gap-2 text-xs">
                          <div>
                            <span class="font-bold text-emerald-900">✓ ${esc(r.studentName)}</span>
                            <span class="text-slate-500 ml-1">${esc(r.time || '')} hrs</span>
                          </div>
                          <button type="button" data-del-att-stu="${esc(r.studentId)}" class="px-2 py-0.5 rounded-md bg-rose-100 hover:bg-rose-200 text-rose-700 text-[11px] font-semibold">Eliminar</button>
                        </div>`
                      )
                      .join('')}
                  </div>`

      container.querySelectorAll('[data-manual-att-stu]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const sid = btn.getAttribute('data-manual-att-stu');
          const stu = getStudentById(sid);
          if (!stu) return;
          const key = `${courseId}|${dateStr}|${sid}`;
          if (appState.db.meta.deletedAttendance) delete appState.db.meta.deletedAttendance[key];

          const exists = (appState.db.attendance || []).find(

    function openStudentAttendanceScannerModal(courseContext = null) {
      if (!appState.session || appState.session.role !== 'student') return;
      const activeStudent = getStudentById(appState.session.user.id) || appState.session.user;

      openModal(
        'Registrar Asistencia por QR',
        `<div id="scanner-view-body" class="space-y-4">
          <p class="text-xs text-slate-600">Escanea el código QR proyectado por tu profesor o pega el código manual de la materia.</p>
          <div id="qr-reader" class="w-full rounded-xl overflow-hidden border border-slate-300 bg-slate-900 min-h-[240px]"></div>
          <div class="pt-2 border-t border-slate-200">
            <label class="block text-xs font-bold text-slate-700 mb-1">¿Sin cámara? Ingresa el código manual:</label>
            <div class="flex gap-2">
              <input id="inp-manual-qr" type="text" placeholder="PUMA_ASISTENCIA|..." class="flex-1 px-3 py-2 rounded-xl border border-slate-300 text-xs font-mono" />
              <button id="btn-submit-manual-qr" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">Validar</button>
            </div>
          </div>
        </div>`,
        () => {
          syncNow({ push: false, silent: true });

          async function handleCode(rawText) {
            const parts = String(rawText || '').trim().split('|');
            if (parts[0] !== 'PUMA_ASISTENCIA' || parts.length < 3) {
              showToast('Código QR no válido para asistencia', 'error');
              return;
            }
            const scannedCourseId = parts[1];
            const scannedDate = parts[2];
            stopActiveQrScanner();

            await syncNow({ push: false, silent: true });
            const targetCourse = getCourseById(scannedCourseId) || courseContext;
            const attKey = `${scannedCourseId}|${scannedDate}|${activeStudent.id}`;

            if (appState.db.meta.deletedAttendance) {
              delete appState.db.meta.deletedAttendance[attKey];
            }

            if (targetCourse && !targetCourse.enrolledStudentIds.includes(activeStudent.id)) {
              targetCourse.enrolledStudentIds.push(activeStudent.id);
            }

            const existing = (appState.db.attendance || []).find(
              a => a.courseId === scannedCourseId && a.date === scannedDate && a.studentId === activeStudent.id
            );
            const nowTs = Date.now();
            if (existing) {
              existing.createdAtTs = nowTs;
              existing.time = getNowTimeShort();
            } else {
              appState.db.attendance.push({
                id: uid('att'),
                courseId: scannedCourseId,
                courseTitle: targetCourse ? targetCourse.title : scannedCourseId,
                studentId: activeStudent.id,
                studentName: activeStudent.name,
                date: scannedDate,
                time: getNowTimeShort(),
                createdAtTs: nowTs
              });
            }

            const body = document.getElementById('scanner-view-body');
            if (body) {
              body.innerHTML = `<div class="text-center py-6 space-y-3">
                <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto text-2xl font-bold">✓</div>
                <h4 class="font-bold text-slate-900 text-base">${esc(activeStudent.name)}</h4>
                <p class="text-xs text-slate-600">Asistencia registrada en <strong>${esc(targetCourse ? targetCourse.title : scannedCourseId)}</strong> (${esc(scannedDate)}).</p>
                <p id="att-sync-status" class="text-xs font-semibold text-indigo-600">Sincronizando en tiempo real...</p>
                <button id="btn-close-qr-done" class="px-5 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold">Aceptar</button>
              </div>`;
              document.getElementById('btn-close-qr-done').addEventListener('click', () => {
                closeModal();
                renderMain();
              });
            }

            const res = await saveState(false);
            const stEl = document.getElementById('att-sync-status');
            if (stEl) {
              stEl.textContent = res.ok ? '✓ Sincronizada en la nube del docente' : 'Guardada en el dispositivo';
              stEl.className = 'text-xs font-semibold text-emerald-600';
            }
          }

          document.getElementById('btn-submit-manual-qr').addEventListener('click', () => {
            handleCode(document.getElementById('inp-manual-qr').value);
          });

          if (window.Html5Qrcode) {
            try {
              const scanner = new Html5Qrcode('qr-reader');
              activeQrScannerInstance = scanner;
              scanner.start(
                { facingMode: 'environment' },
                { fps: 10, qrbox: { width: 220, height: 220 } },
                decodedText => handleCode(decodedText),
                () => {}
              ).catch(() => {});
            } catch (e) {}
          }
        }
      );
    }

      // -------------------- PESTAÑA 2: LIBRO DE CALIFICACIONES (100 PTS) --------------------
      if (appState.courseTab === 'gradebook') {
        const cfg = course.gradingConfig;
        const productsWeightSum = (course.products || []).reduce((acc, p) => acc + Number(p.weight || 0), 0);
        const totalConfigured = Number(cfg.platformWeight || 0) + Number(cfg.attendanceWeight || 0) + productsWeightSum;

        if (!isAdmin) {
          const ev = calculateStudentCourseEvaluation(course, userId);
          tabPanel.innerHTML = `
            <div class="bg-white rounded-2xl border border-slate-200 p-6 space-y-4">
              <div class="flex items-center justify-between border-b pb-4">
                <div>
                  <h3 class="font-bold text-base text-slate-900">Mi Desglose de Calificación Final</h3>
                  <p class="text-xs text-slate-500">Ponderación configurada sobre 100 puntos</p>
                </div>
                <div class="text-right">
                  <span class="text-xs text-slate-400 block">Calificación Final</span>
                  <span class="text-3xl font-extrabold text-indigo-700">${ev.finalGrade.toFixed(1)} <span class="text-sm">/ 100</span></span>

              </div>

                  <p class="text-xl font-extrabold text-emerald-700 mt-1">${ev.attendanceWeighted.toFixed(1)} pts</p>
                  <p class="text-[11px] text-emerald-700 mt-0.5">${ev.studentAttendanceCount} de ${ev.effectiveTotalDays} sesiones</p>
                </div>
                <div class="p-4 rounded-xl bg-amber-50 border border-amber-200">
                  <p class="font-bold text-amber-950">Productos Evaluables (${ev.productsWeightSum}%)</p>
                  <p class="text-xl font-extrabold text-amber-700 mt-1">${ev.productsWeightedTotal.toFixed(1)} pts</p>
                </div>
              </div>

        } else {

            <div class="space-y-4">
              <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <h3 class="font-bold text-sm text-slate-900">Configuración de Ponderación y Productos Independientes</h3>
                    <p class="text-xs text-slate-500">Suma total actual: <strong class="${totalConfigured === 100 ? 'text-emerald-600' : 'text-rose-600'}">${totalConfigured}% de 100%</strong></p>
                  </div>
                  <button id="btn-add-product" class="px-3.5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">+ Nuevo Producto Evaluable</button>
                </div>

                <div class="grid sm:grid-cols-3 gap-3 text-xs">
                  <div>
                    <label class="block font-bold text-slate-700 mb-1">% Actividades en Plataforma</label>

                  <div>
                    <label class="block font-bold text-slate-700 mb-1">% Asistencia de la Materia</label>

                <table class="w-full text-xs text-left">

                    <tr>
                      <th class="p-3">Estudiante</th>
                      <th class="p-3">Plataforma (${cfg.platformWeight}%)</th>
                      <th class="p-3">Asistencia (${cfg.attendanceWeight}%)</th>
                      ${(course.products || []).map(p => `<th class="p-3">${esc(p.title)} (${p.weight}%)</th>`).join('')}
                      <th class="p-3 font-extrabold text-amber-300">Final (100)</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y">
                    ${enrolledStudents
                      .map(stu => {
                        const ev = calculateStudentCourseEvaluation(course, stu.id);
                        return `<tr>
                          <td class="p-3 font-bold">${esc(stu.name)}</td>
                          <td class="p-3">${ev.platformWeighted.toFixed(1)} pts</td>
                          <td class="p-3">${ev.attendanceWeighted.toFixed(1)} pts (${ev.studentAttendanceCount}/${ev.effectiveTotalDays})</td>
                          ${(course.products || [])
                            .map(p => {
                              const val = getProductScoreValue(course, p.id, stu.id);
                              return `<td class="p-3">
                                <input type="number" min="0" max="100" data-prod-grade="${esc(p.id)}|${esc(stu.id)}" value="${val !== null ? val : ''}" placeholder="0-100" class="w-20 px-2 py-1 rounded border text-xs" />
                              </td>`;
                            })
                            .join('')}
                          <td class="p-3 font-extrabold text-indigo-700 text-sm">${ev.finalGrade.toFixed(1)}</td>
                        </tr>`;
                      })
                      .join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `;

          document.getElementById('btn-save-weights').addEventListener('click', async () => {
            course.gradingConfig.platformWeight = Number(document.getElementById('inp-w-platform').value || 0);
            course.gradingConfig.attendanceWeight = Number(document.getElementById('inp-w-attendance').value || 0);
            course.gradingConfig.updatedAt = Date.now();
            course.updatedAt = Date.now();
            renderCourseDetail();
            await saveState(true);
            showToast('Ponderación actualizada', 'success');

          document.getElementById('btn-add-product').addEventListener('click', () => {

                  <label class="block text-xs font-bold mb-1">Ponderación (%)</label>
                  <input id="prod-weight" type="number" min="1" max="100" value="20" required class="w-full px-3 py-2 rounded-xl border text-xs" />

                  <label class="block text-xs font-bold mb-1">Descripción</label>
                  <input id="prod-desc" type="text" class="w-full px-3 py-2 rounded-xl border text-xs" />

                <button type="submit" class="w-full py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">Agregar Producto</button>
              </form>`,

                document.getElementById('form-new-prod').addEventListener('submit', async e => {
                  e.preventDefault();
                  const now = Date.now();
                  course.products.push({
                    id: uid('prod'),
                    title: document.getElementById('prod-title').value.trim(),
                    weight: Number(document.getElementById('prod-weight').value || 0),
                    description: document.getElementById('prod-desc').value.trim(),
                    updatedAt: now

                  course.updatedAt = now;
                  closeModal();
                  renderCourseDetail();
                  await saveState(true);

            );

          tabPanel.querySelectorAll('[data-del-prod]').forEach(btn => {
            btn.addEventListener('click', async () => {
              const pid = btn.getAttribute('data-del-prod');
              appState.db.meta.deletedProducts[pid] = Date.now() + 1000;
              course.products = (course.products || []).filter(p => p.id !== pid);
              course.updatedAt = Date.now();
              renderCourseDetail();
              await saveState(true);
            });
          });

          tabPanel.querySelectorAll('[data-prod-grade]').forEach(inp => {
            inp.addEventListener('change', async () => {
              const [pid, sid] = inp.getAttribute('data-prod-grade').split('|');
              setProductScoreValue(course, pid, sid, inp.value);
              course.updatedAt = Date.now();
              renderCourseDetail();
              await saveState(true);
            });
          });
        }
      }

      // -------------------- PESTAÑA 3: LIBRO DE ASISTENCIA POR MATERIA --------------------
      if (appState.courseTab === 'attendance') {
        const courseAtt = (appState.db.attendance || []).filter(a => a.courseId === course.id && a.studentId !== 'admin');
        tabPanel.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-4">
            <h3 class="font-bold text-sm text-slate-900">Registro de Asistencia Diaria · ${esc(course.title)}</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-xs text-left">
                <thead class="bg-slate-900 text-white">
                  <tr>
                    <th class="p-3">Estudiante</th>
                    <th class="p-3">Total Días Presente</th>
                    <th class="p-3">Fechas Registradas (Hermosillo, Son.)</th>
                  </tr>
                </thead>
                <tbody class="divide-y">
                  ${enrolledStudents
                    .map(stu => {
                      const recs = courseAtt.filter(a => a.studentId === stu.id);
                      return `<tr>
                        <td class="p-3 font-bold">${esc(stu.name)}</td>
                        <td class="p-3 font-extrabold text-emerald-700">${recs.length}</td>
                        <td class="p-3">
                          <div class="flex flex-wrap gap-1.5">
                            ${
                              recs.length === 0
                                ? `<span class="text-slate-400">Sin asistencias</span>`
                                : recs
                                    .map(
                                      r => `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-emerald-50 border border-emerald-200 text-emerald-900">
                                        ${esc(r.date)} (${esc(r.time || '')})
                                        ${
                                          isAdmin
                                            ? `<button data-del-book-att="${esc(r.courseId)}|${esc(r.date)}|${esc(r.studentId)}" class="text-rose-600 font-bold ml-1 hover:underline">Eliminar</button>`
                                            : ''
                                        }
                                      </span>`
                                    )
                                    .join('')
                            }
                          </div>
                        </td>
                      </tr>`;
                    })
                    .join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;

        tabPanel.querySelectorAll('[data-del-book-att]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const key = btn.getAttribute('data-del-book-att');
            const [cid, dt, sid] = key.split('|');
            appState.db.meta.deletedAttendance[key] = Date.now() + 1000;
            appState.db.attendance = (appState.db.attendance || []).filter(
              a => !(a.courseId === cid && a.date === dt && a.studentId === sid)
            );
            renderCourseDetail();
            await saveState(false);
            showToast('Asistencia eliminada de la nube', 'info');
          });
        });
      }
    }

    // ==================== SHELL PRINCIPAL Y LISTADO DE MATERIAS ====================
    function renderMain() {
      if (!appState.session) {
        renderAuth();
        return;
      }
      const root = document.getElementById('app-root');
      const isAdmin = appState.session.role === 'admin';

      root.innerHTML = `
        <div class="min-h-screen flex flex-col">
          <header class="bg-slate-900 text-white px-6 py-3.5 flex flex-wrap items-center justify-between gap-3 shadow-md">
            <div class="flex items-center gap-3">
              <span class="px-2.5 py-1 rounded-lg bg-indigo-600 font-extrabold text-xs">PUMA STEAM</span>
              <h1 class="font-bold text-sm sm:text-base">Aula Virtual · Prepa Lázaro Cárdenas</h1>
              <span id="realtime-sync-badge" class="px-2.5 py-0.5 rounded-full bg-slate-800 text-emerald-400 text-[11px] font-semibold">
                <span class="w-2 h-2 rounded-full bg-emerald-500 pulse-dot inline-block mr-1"></span>En vivo
              </span>
            </div>
            <div class="flex items-center gap-2">
              <button id="nav-courses" class="px-3 py-1.5 rounded-xl text-xs font-bold ${appState.activeView === 'courses' || appState.activeView === 'dashboard' ? 'bg-white text-slate-900' : 'bg-slate-800 text-slate-200'}">Materias</button>
              ${
                !isAdmin
                  ? `<button id="nav-scan-qr" class="px-3 py-1.5 rounded-xl bg-amber-400 text-slate-950 text-xs font-extrabold">📷 Escanear QR</button>`
                  : ''
              }
              <span class="text-xs text-slate-300 hidden sm:inline ml-2">${esc(appState.session.user.name)}</span>
              <button id="btn-logout" class="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold">Salir</button>
            </div>
          </header>

          <main id="view-content" class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6"></main>
        </div>
      `;

      updateRealtimeIndicator();

      document.getElementById('nav-courses').addEventListener('click', () => {
        appState.activeView = 'courses';
        renderMain();
      });

      const scanBtn = document.getElementById('nav-scan-qr');
      if (scanBtn) scanBtn.addEventListener('click', () => openStudentAttendanceScannerModal(null));

      document.getElementById('btn-logout').addEventListener('click', () => {
        appState.session = null;
        renderAuth();
      });

      if (appState.activeView === 'course-detail' && appState.selectedCourseId) {
        renderCourseDetail();
        return;
      }

      const container = document.getElementById('view-content');
      const courses = appState.db.courses || [];
      const deletedCount = Object.keys(appState.db.meta?.deletedCourses || {}).length;

      container.innerHTML = `
        <div class="space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 class="text-xl font-extrabold text-slate-900">Catálogo de Materias Sincronizadas</h2>
              <p class="text-xs text-slate-500">Zona horaria activa: Hermosillo, Sonora (${esc(getTodayFormatted())})</p>
            </div>
            ${
              isAdmin
                ? `<div class="flex items-center gap-2">
                    ${
                      deletedCount > 0
                        ? `<button id="btn-restore-deleted-courses" class="px-3 py-2 rounded-xl border border-slate-300 bg-white text-slate-700 text-xs font-semibold hover:bg-slate-50">Papelera en Nube (${deletedCount})</button>`
                        : ''
                    }
                    <button id="btn-new-course" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-xs">+ Nueva Materia</button>
                  </div>`
                : ''
            }
          </div>

          ${
            courses.length === 0
              ? `<div class="bg-white rounded-2xl p-10 text-center border border-slate-200">
                  <p class="text-sm text-slate-500">No hay materias activas registradas.</p>
                </div>`
              : `<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
                  ${courses
                    .map(
                      c => `<div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden flex flex-col justify-between">
                        <div>
                          <div class="p-5 bg-gradient-to-r ${esc(c.color || 'from-indigo-600 to-blue-700')} text-white">
                            <div class="flex justify-between items-center text-[11px] font-bold uppercase opacity-90">
                              <span>${esc(c.code)}</span>
                              <span>${esc(c.semester)}</span>

                            <h3 class="text-lg font-extrabold mt-1">${esc(c.title)}</h3>
                            <p class="text-xs text-white/85 mt-1 line-clamp-2">${esc(c.description)}</p>
                          </div>
                          <div class="p-4 text-xs text-slate-600 space-y-1">
                            <p><strong>Docente:</strong> ${esc(c.teacher)}</p>

                          </div>

                        <div class="p-4 pt-0 flex items-center gap-2">
                          <button data-open-course="${esc(c.id)}" class="flex-1 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold">Entrar a la Materia</button>
                          ${
                            isAdmin
                              ? `<button data-quick-del-course="${esc(c.id)}" title="Eliminar materia" class="px-3 py-2.5 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-700 text-xs font-bold">🗑</button>`
                              : ''
                          }
                        </div>
                      </div>`
                    )
                    .join('')}
                </div>`
          }
        </div>
      `;

      container.querySelectorAll('[data-open-course]').forEach(btn => {
        btn.addEventListener('click', () => {
          appState.selectedCourseId = btn.getAttribute('data-open-course');
          appState.activeView = 'course-detail';
          appState.courseTab = 'content';
          renderMain();
        });
      });

      container.querySelectorAll('[data-quick-del-course]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const cid = btn.getAttribute('data-quick-del-course');
          const target = getCourseById(cid);
          if (!target) return;
          if (!confirm(`¿Eliminar permanentemente la materia "${target.title}" en todos los dispositivos?`)) return;
          const now = Date.now() + 5000;
          appState.db.meta.deletedCourses[cid] = now;
          savePersistedDeletedCourses(appState.db.meta.deletedCourses);
          appState.db.courses = (appState.db.courses || []).filter(c => c.id !== cid);
          renderMain();
          await saveState(true);
          showToast('Materia eliminada y sincronizada en la nube', 'info');
        });

      const restoreBtn = document.getElementById('btn-restore-deleted-courses');
      if (restoreBtn) {
        restoreBtn.addEventListener('click', () => {
          const delMap = appState.db.meta.deletedCourses || {};
          const keys = Object.keys(delMap);
          openModal(
            'Papelera de Materias Eliminadas en Nube',
            `<div class="space-y-3">
              <p class="text-xs text-slate-600">Estas materias están marcadas como eliminadas en la nube para que no vuelvan a aparecer al recargar.</p>
              <div class="divide-y border rounded-xl">
                ${keys
                  .map(k => {
                    const seedMatch = SEED_COURSES.find(s => s.id === k);
                    return `<div class="p-3 flex items-center justify-between text-xs">
                      <span class="font-bold">${esc(seedMatch ? seedMatch.title : k)}</span>
                      <button data-restore-cid="${esc(k)}" class="px-3 py-1 rounded-lg bg-emerald-600 text-white font-bold">Restaurar</button>
                    </div>`;
                  })
                  .join('')}
              </div>
            </div>`,
            () => {
              document.querySelectorAll('[data-restore-cid]').forEach(b => {
                b.addEventListener('click', async () => {
                  const cid = b.getAttribute('data-restore-cid');
                  delete appState.db.meta.deletedCourses[cid];
                  savePersistedDeletedCourses(appState.db.meta.deletedCourses);
                  const seedMatch = SEED_COURSES.find(s => s.id === cid);
                  if (seedMatch && !getCourseById(cid)) {
                    appState.db.courses.push(normalizeCourseGrading({ ...JSON.parse(JSON.stringify(seedMatch)), updatedAt: Date.now() + 10000 }));
                  }
                  closeModal();
                  renderMain();
                  await saveState(true);
                  showToast('Materia restaurada', 'success');
                });
              });
            }
          );
        });
      }

      const newCourseBtn = document.getElementById('btn-new-course');
      if (newCourseBtn) {
        newCourseBtn.addEventListener('click', () => {
          openModal(
            'Crear Nueva Materia',
            `<form id="form-new-course" class="space-y-3">
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-xs font-bold mb-1">Código</label>

                  <input id="nc-sem" type="text" required placeholder="3° Semestre" class="w-full px-3 py-2 rounded-xl border text-xs" />
                </div>
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">Nombre de la Materia</label>
                <input id="nc-title" type="text" required placeholder="Introducción al Turismo" class="w-full px-3 py-2 rounded-xl border text-xs" />
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">Descripción</label>
                <textarea id="nc-desc" rows="2" required class="w-full px-3 py-2 rounded-xl border text-xs"></textarea>
              </div>
              <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold">Crear y Sincronizar Materia</button>
            </form>`,
            () => {
              document.getElementById('form-new-course').addEventListener('submit', async e => {
                e.preventDefault();
                const now = Date.now();
                const newCourse = normalizeCourseGrading({
                  id: uid('course'),
                  code: document.getElementById('nc-code').value.trim(),
                  semester: document.getElementById('nc-sem').value.trim(),
                  title: document.getElementById('nc-title').value.trim(),
                  category: 'STEAM',
                  teacher: 'Mtro. Francisco J. Tapia López',
                  description: document.getElementById('nc-desc').value.trim(),
                  color: 'from-indigo-600 to-blue-700',
                  updatedAt: now,
                  enrolledStudentIds: (appState.db.students || []).map(s => s.id),
                  modules: []
                });
                appState.db.courses.push(newCourse);
                closeModal();
                renderMain();
                await saveState(true);
                showToast('Materia creada y sincronizada en la nube', 'success');
              });
            }
          );
        });
      }
    }

    // ==================== REFRESCO SEGURO EN TIEMPO REAL ====================
    function refreshActiveViewSafely() {
      const modalOpen = !document.getElementById('modal-root').classList.contains('hidden');
      if (modalOpen) {
        refreshOpenAttendanceModalIfVisible();
        return;
      }
      if (isUserTyping()) return;
      if (Date.now() - appState.lastLocalMutationTs < 1800) return;

      if (appState.session) {
        renderMain();
      } else {
        renderAuth();
      }
    }

    // Arranque inicial y ciclo continuo de sincronización cada 2.5s
    renderMain();
    syncNow({ push: false, silent: true, forceRender: true });

    setInterval(() => {
      if (document.hidden || appState.cloudSyncing) return;
      syncNow({ push: false, silent: true, forceRender: false });
    }, 2500);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && !appState.cloudSyncing) {
        syncNow({ push: false, silent: true, forceRender: false });
      }
    });
  })();
  </script>
</body>
</html>
