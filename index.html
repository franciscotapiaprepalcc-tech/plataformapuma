    function getSonoraDateParts(dateObj = new Date()) {
      try {
        const fmt = new Intl.DateTimeFormat('en-CA', {
          timeZone: SONORA_TIMEZONE,
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
        const parts = {};
        fmt.formatToParts(dateObj).forEach(p => { parts[p.type] = p.value; });
        return {
          year: Number(parts.year),
          month: Number(parts.month) - 1,
          dateStr: `${parts.year}-${parts.month}-${parts.day}`,
          timeShort: `${parts.hour}:${parts.minute}`,
          timeFull: `${parts.hour}:${parts.minute}:${parts.second}`
        };
      } catch (e) {
        const iso = dateObj.toISOString();
        return {
          year: dateObj.getFullYear(),
          month: dateObj.getMonth(),
          dateStr: iso.slice(0, 10),
          timeShort: dateObj.toTimeString().slice(0, 5),
          timeFull: dateObj.toTimeString().slice(0, 8)
        };
      }
    }

      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')

    // ==================== SANITIZADOR Y RENDERIZADOR DE HIPERTEXTO SEGURO ====================
    function sanitizeHypertextHtml(rawInput) {
      const str = String(rawInput ?? '').trim();
      if (!str) return '';

      const hasHtmlTags = /<\/?[a-z][\s\S]*>/i.test(str);
      if (!hasHtmlTags) {
        const escaped = esc(str);
        const linked = escaped.replace(
          /(https?:\/\/[^\s<]+)/g,
          '<a href="$1" target="_blank" rel="noopener noreferrer">$1 ↗</a>'
        );
        return linked
          .split(/\n{2,}/)
          .map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`)
          .join('');
      }

      const template = document.createElement('template');
      template.innerHTML = str;

      const allowedTags = new Set([
        'P', 'BR', 'STRONG', 'B', 'EM', 'I', 'U', 'S',
        'H1', 'H2', 'H3', 'H4', 'UL', 'OL', 'LI',
        'A', 'BLOCKQUOTE', 'CODE', 'PRE', 'DIV', 'SPAN',
        'TABLE', 'THEAD', 'TBODY', 'TR', 'TH', 'TD', 'HR'
      ]);

      function cleanNode(node) {
        if (node.nodeType === Node.TEXT_NODE) return;
        if (node.nodeType !== Node.ELEMENT_NODE) {
          node.remove();
          return;
        }
        const tag = node.tagName.toUpperCase();
        if (!allowedTags.has(tag)) {
          if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'IFRAME' || tag === 'OBJECT' || tag === 'EMBED') {
            node.remove();
            return;
          }
          const parent = node.parentNode;
          while (node.firstChild) {
            parent.insertBefore(node.firstChild, node);
          }
          node.remove();
          return;
        }

        Array.from(node.attributes).forEach(attr => {
          const name = attr.name.toLowerCase();
          const val = attr.value.trim();
          if (name.startsWith('on')) {
            node.removeAttribute(attr.name);
            return;
          }
          if (tag === 'A' && name === 'href') {
            if (!/^(https?:\/\/|mailto:|#)/i.test(val)) {
              node.removeAttribute('href');
            }
          } else if (name === 'class') {
            const safeClasses = val
              .split(/\s+/)
              .filter(c => /^(callout|bg-|text-|border-|p-|px-|py-|m-|mt-|mb-|rounded|font-|flex|gap-|grid|space-y-)[a-z0-9-]*$/i.test(c));
            if (safeClasses.length) node.setAttribute('class', safeClasses.join(' '));
            else node.removeAttribute('class');
          } else if (tag === 'A' && (name === 'target' || name === 'rel')) {
            // Se normalizan abajo
          } else {
            node.removeAttribute(attr.name);
          }
        });

        if (tag === 'A' && node.getAttribute('href')) {
          node.setAttribute('target', '_blank');
          node.setAttribute('rel', 'noopener noreferrer');
        }

        Array.from(node.childNodes).forEach(child => cleanNode(child));
      }

      Array.from(template.content.childNodes).forEach(child => cleanNode(child));
      return template.innerHTML;
    }

      if (!course.productGrades || typeof course.productGrades !== 'object') {

      }
      if (Array.isArray(dbObj.attendance)) {
        dbObj.attendance = dbObj.attendance.filter(att => {
          const sid = String(att?.studentId || '');
          const sname = String(att?.studentName || '').toLowerCase();
          return !purgedIds.has(sid) && !sname.includes('alumno demostración') && !sname.includes('alumno de demostración');
        });
      }
      return dbObj;
    }

    function normalizeStudentRecord(stu) {
      if (!stu || typeof stu !== 'object') return stu;
      const baseGroup = String(stu.group || '').trim();
      const rawGroups = Array.isArray(stu.groups) ? stu.groups.filter(Boolean).map(g => String(g).trim()) : [];
      if (baseGroup && !rawGroups.includes(baseGroup)) {
        rawGroups.unshift(baseGroup);
      }
      const cleanPass = String(stu.password || 'aB123456.').trim();
      return {
        ...stu,
        phone: String(stu.phone || '').trim(),
        group: baseGroup || rawGroups[0] || '1A',
        groups: rawGroups.length ? Array.from(new Set(rawGroups)) : [baseGroup || '1A'],
        accessCode: String(stu.accessCode || cleanPass).trim().toUpperCase(),
        manualPoints: stu.manualPoints && typeof stu.manualPoints === 'object' ? stu.manualPoints : {},
        updatedAt: Number(stu.updatedAt || 1)
      };
    }

    function normalizeGroupsList(rawGroups, deletedGroupsMap = {}, courses = []) {
      const source = Array.isArray(rawGroups) && rawGroups.length > 0
        ? rawGroups
        : JSON.parse(JSON.stringify(DEFAULT_DATA.groups));
      const validCourseIds = new Set((courses || []).map(c => c.id));
      const out = [];
      const seen = new Set();
      source.forEach(g => {
        if (!g || !g.key) return;
        const key = String(g.key).trim();
        if (!key || seen.has(key)) return;
        const delTs = Number(deletedGroupsMap[key] || 0);
        const itemTs = Number(g.updatedAt || 1);
        if (delTs > 0 && delTs >= itemTs) return;
        seen.add(key);
        const cIds = Array.isArray(g.courseIds)
          ? g.courseIds.filter(id => validCourseIds.size === 0 || validCourseIds.has(id))
          : [];
        out.push({
          key,
          label: String(g.label || key),
          courseIds: cIds.length ? cIds : (courses || []).map(c => c.id),
          updatedAt: itemTs
        });
      });
      return out;
    }

    function normalizeDatabase(rawDb) {
      const hasRaw = rawDb && typeof rawDb === 'object';
      const base = hasRaw ? rawDb : JSON.parse(JSON.stringify(DEFAULT_DATA));
      const meta = base.meta && typeof base.meta === 'object' ? base.meta : {};
      const persistedDelCourses = loadPersistedDeletedCourses();

      const deletedGroups = meta.deletedGroups && typeof meta.deletedGroups === 'object' ? meta.deletedGroups : {};
      const deletedPartialBackups = meta.deletedPartialBackups && typeof meta.deletedPartialBackups === 'object' ? meta.deletedPartialBackups : {};
      const normalizedCourses = Array.isArray(base.courses) ? base.courses.map(c => normalizeCourseGrading({ ...c })) : [];

      const normalized = {
        meta: {
          structureUpdatedAt: Number(meta.structureUpdatedAt || base.structureUpdatedAt || 1),
          deletedCourses: { ...persistedDelCourses, ...(meta.deletedCourses || {}) },
          deletedModules: meta.deletedModules && typeof meta.deletedModules === 'object' ? meta.deletedModules : {},
          deletedResources: meta.deletedResources && typeof meta.deletedResources === 'object' ? meta.deletedResources : {},
          deletedAssignments: meta.deletedAssignments && typeof meta.deletedAssignments === 'object' ? meta.deletedAssignments : {},
          deletedAnnouncements: meta.deletedAnnouncements && typeof meta.deletedAnnouncements === 'object' ? meta.deletedAnnouncements : {},
          deletedProducts: meta.deletedProducts && typeof meta.deletedProducts === 'object' ? meta.deletedProducts : {},
          deletedAttendance: meta.deletedAttendance && typeof meta.deletedAttendance === 'object' ? meta.deletedAttendance : {},
          deletedSubmissions: meta.deletedSubmissions && typeof meta.deletedSubmissions === 'object' ? meta.deletedSubmissions : {},
          deletedStudents: meta.deletedStudents && typeof meta.deletedStudents === 'object' ? meta.deletedStudents : {},
          deletedGroups,
          deletedPartialBackups
        },
        groups: normalizeGroupsList(base.groups, deletedGroups, normalizedCourses),
        partialBackups: Array.isArray(base.partialBackups)
          ? base.partialBackups.filter(b => b && b.id && !(Number(deletedPartialBackups[b.id] || 0) >= Number(b.createdAtTs || 1)))
          : [],
        computerSeating: base.computerSeating && typeof base.computerSeating === 'object' ? base.computerSeating : {},
        courses: normalizedCourses,
        students: Array.isArray(base.students) ? base.students.map(s => normalizeStudentRecord(s)) : [],
        submissions: Array.isArray(base.submissions) ? base.submissions : [],
        attendance: Array.isArray(base.attendance) ? base.attendance : []
      };
      return purgeDemoAndDeletedData(normalized);
    }

        if (raw) {
          return normalizeDatabase(JSON.parse(raw));
        }
      } catch (e) {}
      return normalizeDatabase(JSON.parse(JSON.stringify(DEFAULT_DATA)));
    }

    // ==================== CONFIGURACIÓN Y CONEXIÓN NUBE ====================
    function getCloudConfig() {
      let cfg = { token: DEFAULT_GITHUB_TOKEN, gistId: DEFAULT_PUBLIC_GIST_ID };
      try {
        const raw = localStorage.getItem(CLOUD_CONFIG_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.token) cfg.token = parsed.token;
          if (parsed.gistId) cfg.gistId = parsed.gistId;
        }
      } catch (e) {}
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const urlGist = urlParams.get('gist');
        if (urlGist) cfg.gistId = urlGist.trim();
      } catch (e) {}
      return cfg;
    }

    function saveCloudConfig(token, gistId) {
      try {
        localStorage.setItem(
          CLOUD_CONFIG_KEY,
          JSON.stringify({ token: String(token || '').trim(), gistId: String(gistId || '').trim() })
        );

    }

    function getGeminiApiKey() {
      try {
        return localStorage.getItem(GEMINI_KEY_STORAGE) || '';
      } catch (e) {

    function saveGeminiApiKey(key) {

    function buildGitHubHeaders(token, hasBody = false) {
      const headers = { Accept: 'application/vnd.github+json' };
      const clean = String(token || '').trim();
      if (clean) headers['Authorization'] = `token ${clean}`;
      if (hasBody) headers['Content-Type'] = 'application/json';
      return headers;
    }

    function getKvdbMasterKey() {
      const cfg = getCloudConfig();
      const cleanId = (cfg.gistId || DEFAULT_PUBLIC_GIST_ID || 'puma_default').replace(/[^a-zA-Z0-9_-]/g, '');
      return `puma_master_v2_${cleanId}`;
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 3500) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: ctrl.signal });
      } finally {
        clearTimeout(timer);
      }
    }

    // ==================== MOTOR DE FUSIÓN EN TIEMPO REAL ====================
    function mergeTimestampMaps(mapA = {}, mapB = {}) {
      const out = { ...(mapA || {}) };
      Object.entries(mapB || {}).forEach(([k, v]) => {
        const ts = Number(v || 0);
        if (ts > Number(out[k] || 0)) out[k] = ts;
      });
      return out;
    }

    function getAttendanceKey(att) {
      if (!att) return '';
      return `${att.courseId}|${att.date}|${att.studentId}`;
    }

    function getSubmissionKey(sub) {
      if (!sub) return '';
      return `${sub.courseId}|${sub.assignmentId}|${sub.studentId}`;
    }

    function mergeOrderedCollectionById(remoteArr = [], localArr = [], deletedMap = {}, preferLocalOrder = true) {
      const primary = preferLocalOrder ? localArr : remoteArr;
      const secondary = preferLocalOrder ? remoteArr : localArr;
      const itemMap = new Map();

      [...(secondary || []), ...(primary || [])].forEach(item => {
        if (!item || !item.id) return;
        const delTs = Number(deletedMap[item.id] || 0);
        const itemTs = Number(item.updatedAt || 1);
        if (delTs > 0 && delTs >= itemTs) return;
        const existing = itemMap.get(item.id);
        if (!existing || itemTs >= Number(existing.updatedAt || 1)) {
          itemMap.set(item.id, JSON.parse(JSON.stringify(item)));
        }
      });

      const orderedIds = [];
      const seen = new Set();
      [...(primary || []), ...(secondary || [])].forEach(item => {
        if (item && item.id && itemMap.has(item.id) && !seen.has(item.id)) {
          seen.add(item.id);
          orderedIds.push(item.id);
        }
      });
      return orderedIds.map(id => itemMap.get(id));
    }

    function mergeCourseModulesGranular(remoteModules = [], localModules = [], metaDeleted = {}, preferLocalOrder = true) {
      const baseMerged = mergeOrderedCollectionById(remoteModules, localModules, metaDeleted.deletedModules || {}, preferLocalOrder);
      const rMap = new Map((remoteModules || []).map(m => [m.id, m]));
      const lMap = new Map((localModules || []).map(m => [m.id, m]));

      return baseMerged.map(mod => {
        const rMod = rMap.get(mod.id) || {};
        const lMod = lMap.get(mod.id) || {};
        const rTr = rMod.teacherTranscript || {};
        const lTr = lMod.teacherTranscript || {};
        const chosenTranscript = Number(lTr.updatedAt || 0) >= Number(rTr.updatedAt || 0) ? lTr : rTr;

        return {
          ...mod,
          teacherTranscript: {
            rawText: String(chosenTranscript.rawText || ''),
            summary: String(chosenTranscript.summary || ''),
            updatedAt: Number(chosenTranscript.updatedAt || 0)
          },
          resources: mergeOrderedCollectionById(rMod.resources || [], lMod.resources || [], metaDeleted.deletedResources || {}, preferLocalOrder),
          assignments: mergeOrderedCollectionById(rMod.assignments || [], lMod.assignments || [], metaDeleted.deletedAssignments || {}, preferLocalOrder)
        };
      });
    }

    function mergeDatabases(remoteRaw, localRaw) {
      const remote = normalizeDatabase(remoteRaw);
      const local = normalizeDatabase(localRaw);

      const mergedDeletedCourses = mergeTimestampMaps(
        loadPersistedDeletedCourses(),
        mergeTimestampMaps(remote.meta.deletedCourses, local.meta.deletedCourses)
      );
      savePersistedDeletedCourses(mergedDeletedCourses);

      const mergedDeletedModules = mergeTimestampMaps(remote.meta.deletedModules, local.meta.deletedModules);
      const mergedDeletedResources = mergeTimestampMaps(remote.meta.deletedResources, local.meta.deletedResources);
      const mergedDeletedAssignments = mergeTimestampMaps(remote.meta.deletedAssignments, local.meta.deletedAssignments);
      const mergedDeletedAnnouncements = mergeTimestampMaps(remote.meta.deletedAnnouncements, local.meta.deletedAnnouncements);
      const mergedDeletedProducts = mergeTimestampMaps(remote.meta.deletedProducts, local.meta.deletedProducts);
      const mergedDeletedAttendance = mergeTimestampMaps(remote.meta.deletedAttendance, local.meta.deletedAttendance);
      const mergedDeletedSubmissions = mergeTimestampMaps(remote.meta.deletedSubmissions, local.meta.deletedSubmissions);
      const mergedDeletedStudents = mergeTimestampMaps(remote.meta.deletedStudents, local.meta.deletedStudents);
      const mergedDeletedGroups = mergeTimestampMaps(remote.meta.deletedGroups, local.meta.deletedGroups);
      const mergedDeletedPartialBackups = mergeTimestampMaps(remote.meta.deletedPartialBackups, local.meta.deletedPartialBackups);

      const preferLocal = local.meta.structureUpdatedAt >= remote.meta.structureUpdatedAt;
      const metaDelBundle = {
        deletedModules: mergedDeletedModules,
        deletedResources: mergedDeletedResources,
        deletedAssignments: mergedDeletedAssignments
      };

      const baseCourses = mergeOrderedCollectionById(remote.courses, local.courses, mergedDeletedCourses, preferLocal);
      const rCourseMap = new Map((remote.courses || []).map(c => [c.id, c]));
      const lCourseMap = new Map((local.courses || []).map(c => [c.id, c]));

      const chosenCourses = baseCourses.map(course => {
        const rCourse = rCourseMap.get(course.id) || {};
        const lCourse = lCourseMap.get(course.id) || {};
        const enrolledSet = new Set([
          ...(Array.isArray(rCourse.enrolledStudentIds) ? rCourse.enrolledStudentIds : []),
          ...(Array.isArray(lCourse.enrolledStudentIds) ? lCourse.enrolledStudentIds : [])
        ]);

        const rGc = rCourse.gradingConfig || {};
        const lGc = lCourse.gradingConfig || {};
        const chosenGc = Number(lGc.updatedAt || 1) >= Number(rGc.updatedAt || 1) ? lGc : rGc;

        const mergedProducts = mergeOrderedCollectionById(rCourse.products || [], lCourse.products || [], mergedDeletedProducts, preferLocal);
        const mergedAnnouncements = mergeOrderedCollectionById(rCourse.announcements || [], lCourse.announcements || [], mergedDeletedAnnouncements, preferLocal);
        const mergedModules = mergeCourseModulesGranular(rCourse.modules || [], lCourse.modules || [], metaDelBundle, preferLocal);

        const mergedProdGrades = {};
        const allProdIds = new Set([
          ...Object.keys(rCourse.productGrades || {}),
          ...Object.keys(lCourse.productGrades || {})
        ]);
        allProdIds.forEach(pid => {
          mergedProdGrades[pid] = {};
          const rG = (rCourse.productGrades && rCourse.productGrades[pid]) || {};
          const lG = (lCourse.productGrades && lCourse.productGrades[pid]) || {};
          new Set([...Object.keys(rG), ...Object.keys(lG)]).forEach(sid => {
            if (mergedDeletedStudents[sid]) return;
            const rE = rG[sid];
            const lE = lG[sid];
            const rO = rE && typeof rE === 'object' ? rE : (rE !== undefined ? { score: Number(rE), updatedAt: 1 } : null);
            const lO = lE && typeof lE === 'object' ? lE : (lE !== undefined ? { score: Number(lE), updatedAt: 1 } : null);
            if (rO && lO) {
              mergedProdGrades[pid][sid] = Number(lO.updatedAt || 0) >= Number(rO.updatedAt || 0) ? lO : rO;
            } else {
              mergedProdGrades[pid][sid] = lO || rO;
            }
          });
        });

        return normalizeCourseGrading({
          ...course,
          enrolledStudentIds: Array.from(enrolledSet).filter(id => !mergedDeletedStudents[id]),
          gradingConfig: chosenGc,
          products: mergedProducts,
          productGrades: mergedProdGrades,
          announcements: mergedAnnouncements,
          modules: mergedModules
        });
      });

      const stuMap = new Map();
      [...remote.students, ...local.students].forEach(stu => {
        if (!stu || !stu.id || isDemoStudentRecord(stu)) return;
        const delTs = Number(mergedDeletedStudents[stu.id] || 0);
        const itemTs = Number(stu.updatedAt || 1);
        if (delTs > itemTs) return;
        const prev = stuMap.get(stu.id);
        if (!prev || itemTs >= Number(prev.updatedAt || 0)) stuMap.set(stu.id, stu);
      });

      const subMap = new Map();
      [...remote.submissions, ...local.submissions].forEach(sub => {
        if (!sub || !sub.courseId || !sub.assignmentId || !sub.studentId) return;
        if (mergedDeletedCourses[sub.courseId]) return;
        const key = getSubmissionKey(sub);
        const delTs = Number(mergedDeletedSubmissions[key] || 0);
        const itemTs = Number(sub.updatedAt || 1);
        if (delTs > itemTs) return;
        const prev = subMap.get(key);
        if (!prev || itemTs >= Number(prev.updatedAt || 0)) subMap.set(key, sub);
      });

      const attMap = new Map();
      [...remote.attendance, ...local.attendance].forEach(att => {
        if (!att || !att.courseId || !att.date || !att.studentId) return;
        if (mergedDeletedCourses[att.courseId]) return;
        const cleanStudentId = String(att.studentId).trim();
        if (!cleanStudentId || cleanStudentId === 'admin' || DEMO_STUDENT_IDS.has(cleanStudentId)) return;
        const key = getAttendanceKey(att);
        const delTs = Number(mergedDeletedAttendance[key] || 0);
        const itemTs = Number(att.createdAtTs || 1);
        if (delTs >= itemTs) return;
        const prev = attMap.get(key);
        if (!prev || itemTs >= Number(prev.createdAtTs || 0)) {
          attMap.set(key, { ...att, studentId: cleanStudentId });
        }
      });

      // Grupos (Base44): unión por key respetando eliminaciones y última edición
      const grpMap = new Map();
      [...(remote.groups || []), ...(local.groups || [])].forEach(g => {
        if (!g || !g.key) return;
        const delTs = Number(mergedDeletedGroups[g.key] || 0);
        const itemTs = Number(g.updatedAt || 1);
        if (delTs > 0 && delTs >= itemTs) return;
        const prev = grpMap.get(g.key);
        if (!prev || itemTs >= Number(prev.updatedAt || 1)) {
          grpMap.set(g.key, JSON.parse(JSON.stringify(g)));
        }
      });
      const mergedGroups = normalizeGroupsList(Array.from(grpMap.values()), mergedDeletedGroups, chosenCourses);

      // Respaldos de Parciales (PartialBackupModal)
      const backupMap = new Map();
      [...(remote.partialBackups || []), ...(local.partialBackups || [])].forEach(b => {
        if (!b || !b.id) return;
        const delTs = Number(mergedDeletedPartialBackups[b.id] || 0);
        const itemTs = Number(b.createdAtTs || 1);
        if (delTs > 0 && delTs >= itemTs) return;
        const prev = backupMap.get(b.id);
        if (!prev || itemTs >= Number(prev.createdAtTs || 1)) {
          backupMap.set(b.id, JSON.parse(JSON.stringify(b)));
        }
      });

      // Asignación de computadoras por grupo (ComputerSeatingModal)
      const mergedComputerSeating = {};
      const allSeatKeys = new Set([
        ...Object.keys(remote.computerSeating || {}),
        ...Object.keys(local.computerSeating || {})
      ]);
      allSeatKeys.forEach(gk => {
        const rSeat = remote.computerSeating?.[gk];
        const lSeat = local.computerSeating?.[gk];
        if (rSeat && lSeat) {
          mergedComputerSeating[gk] = Number(lSeat.updatedAt || 0) >= Number(rSeat.updatedAt || 0) ? lSeat : rSeat;
        } else {
          mergedComputerSeating[gk] = lSeat || rSeat;
        }
      });

      return purgeDemoAndDeletedData({
        meta: {
          structureUpdatedAt: Math.max(remote.meta.structureUpdatedAt, local.meta.structureUpdatedAt),
          deletedCourses: mergedDeletedCourses,
          deletedModules: mergedDeletedModules,
          deletedResources: mergedDeletedResources,
          deletedAssignments: mergedDeletedAssignments,
          deletedAnnouncements: mergedDeletedAnnouncements,
          deletedProducts: mergedDeletedProducts,
          deletedAttendance: mergedDeletedAttendance,
          deletedSubmissions: mergedDeletedSubmissions,
          deletedStudents: mergedDeletedStudents,
          deletedGroups: mergedDeletedGroups,
          deletedPartialBackups: mergedDeletedPartialBackups
        },
        groups: mergedGroups,
        partialBackups: Array.from(backupMap.values()).sort((a, b) => Number(b.createdAtTs || 0) - Number(a.createdAtTs || 0)),
        computerSeating: mergedComputerSeating,
        courses: chosenCourses,
        students: Array.from(stuMap.values()),
        submissions: Array.from(subMap.values()),
        attendance: Array.from(attMap.values())
      });
    }

    // ==================== SINCRONIZACIÓN KVDB + GITHUB GIST ====================
    async function fetchKvdbMaster() {
      try {
        const key = getKvdbMasterKey();
        const res = await fetchWithTimeout(`${REALTIME_ATT_API}/${encodeURIComponent(key)}?_t=${Date.now()}`, {
          headers: { Accept: 'application/json' }
        });
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function pushKvdbMaster(dbPayload) {
      try {
        const key = getKvdbMasterKey();
        const res = await fetchWithTimeout(`${REALTIME_ATT_API}/${encodeURIComponent(key)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dbPayload)
        });
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    async function fetchGistMaster() {
      const cfg = getCloudConfig();
      const gistId = cfg.gistId || DEFAULT_PUBLIC_GIST_ID;
      if (!gistId) return null;
      try {
        let res = await fetchWithTimeout(`https://api.github.com/gists/${encodeURIComponent(gistId)}?_t=${Date.now()}`, {
          headers: buildGitHubHeaders(cfg.token, false)
        });
        if (res.status === 401 || res.status === 403) {
          res = await fetchWithTimeout(`https://api.github.com/gists/${encodeURIComponent(gistId)}?_t=${Date.now()}`, {
            headers: { Accept: 'application/vnd.github+json' }
          });
        }
        if (!res.ok) return null;
        const data = await res.json();
        const fileObj = data.files && (data.files['puma_steam_db.json'] || Object.values(data.files)[0]);
        if (!fileObj || !fileObj.content) return null;
        return JSON.parse(fileObj.content);
      } catch (e) {
        return null;
      }
    }

    async function pushGistMaster(dbPayload) {
      const cfg = getCloudConfig();
      if (!cfg.token) return false;
      const gistId = cfg.gistId || DEFAULT_PUBLIC_GIST_ID;
      try {
        const res = await fetchWithTimeout(`https://api.github.com/gists/${encodeURIComponent(gistId)}`, {
          method: 'PATCH',
          headers: buildGitHubHeaders(cfg.token, true),
          body: JSON.stringify({
            description: 'PLATAFORMA PUMA STEAM - Base de datos sincronizada en tiempo real',
            files: { 'puma_steam_db.json': { content: JSON.stringify(dbPayload, null, 2) } }
          })
        });
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    let syncLockPromise = Promise.resolve({ ok: true });

    function isUserTyping() {
      const active = document.activeElement;
      if (!active) return false;
      const tag = active.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || active.isContentEditable;
    }

    function updateRealtimeIndicator() {
      const badge = document.getElementById('realtime-sync-badge');
      if (badge) {
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 pulse-dot inline-block mr-1.5"></span>En vivo${appState.lastSyncTime ? ' · ' + esc(appState.lastSyncTime) : ''}`;
      }
    }

    function syncNow({ push = false, silent = true, forceRender = false } = {}) {
      syncLockPromise = syncLockPromise
        .then(async () => {
          appState.cloudSyncing = true;
          try {
            const beforeJson = JSON.stringify(appState.db);
            const [kvRemote, gistRemote] = await Promise.all([fetchKvdbMaster(), fetchGistMaster()]);
            let working = appState.db;
            if (gistRemote) working = mergeDatabases(gistRemote, working);
            if (kvRemote) working = mergeDatabases(kvRemote, working);

            appState.db = working;
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.db));
            } catch (e) {}

            let pushOk = true;
            const afterJson = JSON.stringify(appState.db);
            const changed = beforeJson !== afterJson;

            if (push || changed) {
              const [kvOk, gistOk] = await Promise.all([
                pushKvdbMaster(appState.db),
                pushGistMaster(appState.db)
              ]);
              pushOk = Boolean(kvOk || gistOk);
            }

            appState.lastSyncTime = getNowTimeFull();
            appState.initialCloudReady = true;
            updateRealtimeIndicator();

            if (changed || forceRender) {
              refreshActiveViewSafely();
            }
            if (!silent && push) {
              showToast('Sincronizado en tiempo real con la nube', 'success');
            }
            return { ok: pushOk, changed };
          } catch (e) {
            return { ok: false, error: e?.message || 'Error de red' };
          } finally {
            appState.cloudSyncing = false;
          }
        })
        .catch(() => ({ ok: false }));
      return syncLockPromise;
    }

    function touchStructureVersion() {
      const now = Date.now();
      appState.lastLocalMutationTs = now;
      appState.db.meta.structureUpdatedAt = Math.max(now, Number(appState.db.meta.structureUpdatedAt || 0) + 1);
    }

    function saveState(touchStructure = false) {
      if (touchStructure) touchStructureVersion();
      purgeDemoAndDeletedData(appState.db);
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.db));
      } catch (e) {}
      return syncNow({ push: true, silent: true, forceRender: false });
    }

    // ==================== FUNCIONES DE CONSULTA Y EVALUACIÓN ====================
    function getCourseById(courseId) {
      return (appState.db.courses || []).find(c => c.id === courseId) || null;
    }

    function getStudentById(studentId) {
      return (appState.db.students || []).find(s => s.id === studentId) || null;
    }

    function getSubmission(courseId, assignmentId, studentId) {
      return (appState.db.submissions || []).find(
        s => s.courseId === courseId && s.assignmentId === assignmentId && s.studentId === studentId
      ) || null;
    }

    function getProductScoreValue(course, productId, studentId) {
      if (!course || !course.productGrades || !course.productGrades[productId]) return null;
      const entry = course.productGrades[productId][studentId];
      if (entry === null || entry === undefined || entry === '') return null;
      if (typeof entry === 'object') {
        if (entry.score === null || entry.score === undefined || entry.score === '') return null;
        const n = Number(entry.score);
        return Number.isFinite(n) ? n : null;
      }
      const n = Number(entry);
      return Number.isFinite(n) ? n : null;
    }

    function setProductScoreValue(course, productId, studentId, rawScore) {
      if (!course.productGrades || typeof course.productGrades !== 'object') course.productGrades = {};
      if (!course.productGrades[productId] || typeof course.productGrades[productId] !== 'object') {
        course.productGrades[productId] = {};
      }
      if (rawScore === '' || rawScore === null || rawScore === undefined) {
        course.productGrades[productId][studentId] = { score: null, updatedAt: Date.now() };
        return;
      }
      const clamped = Math.max(0, Math.min(100, Number(rawScore)));
      course.productGrades[productId][studentId] = {
        score: Number.isFinite(clamped) ? Math.round(clamped * 10) / 10 : null,
        updatedAt: Date.now()
      };
    }

    function calculateStudentCourseEvaluation(course, studentId) {
      normalizeCourseGrading(course);
      const cfg = course.gradingConfig;
      const products = Array.isArray(course.products) ? course.products : [];
      const stu = getStudentById(studentId);

      const allAssignments = [];
      (course.modules || []).forEach(m => {
        (m.assignments || []).forEach(a => allAssignments.push(a));
      });

      let platformAvg = 0;
      let gradedAssignmentsCount = 0;
      if (allAssignments.length > 0) {
        let sumNormalized = 0;
        allAssignments.forEach(a => {
          const sub = getSubmission(course.id, a.id, studentId);
          if (sub && sub.grade !== null && sub.grade !== undefined && sub.grade !== '') {
            const maxPts = Number(a.maxPoints) > 0 ? Number(a.maxPoints) : 100;
            const norm = Math.max(0, Math.min(100, (Number(sub.grade) / maxPts) * 100));
            sumNormalized += norm;
            gradedAssignmentsCount += 1;
          }
        });
        platformAvg = sumNormalized / allAssignments.length;
      }

      // Compatibilidad con puntos directos de Calificación Rápida (Base44 QuickGradingModal)
      const manualEntry = stu && stu.manualPoints && stu.manualPoints[course.id];
      const hasManualPts = manualEntry && manualEntry.points !== null && manualEntry.points !== undefined && manualEntry.points !== '';
      if (hasManualPts && gradedAssignmentsCount === 0) {
        platformAvg = Math.max(0, Math.min(100, Number(manualEntry.points)));
      }
      const platformWeighted = (platformAvg * Number(cfg.platformWeight || 0)) / 100;

      const courseAttendance = (appState.db.attendance || []).filter(
        a => a.courseId === course.id && a.studentId && a.studentId !== 'admin'
      );
      const uniqueCourseDates = new Set(courseAttendance.map(a => a.date));
      const totalRecordedDays = uniqueCourseDates.size;
      const effectiveTotalDays = Number(cfg.expectedSessions) > 0 ? Number(cfg.expectedSessions) : totalRecordedDays;

      const studentDates = new Set(
        courseAttendance.filter(a => a.studentId === studentId).map(a => a.date)
      );
      const studentAttendanceCount = studentDates.size;

      let attendancePct = 0;
      if (effectiveTotalDays > 0) {
        attendancePct = Math.min(100, (studentAttendanceCount / effectiveTotalDays) * 100);
      }
      const attendanceWeighted = (attendancePct * Number(cfg.attendanceWeight || 0)) / 100;

      let productsWeightedTotal = 0;
      const productBreakdown = products.map(p => {
        const score = getProductScoreValue(course, p.id, studentId);
        const numericScore = score !== null ? score : 0;
        const w = Number(p.weight || 0);
        const weightedPts = (numericScore * w) / 100;
        productsWeightedTotal += weightedPts;
        return { product: p, score, numericScore, weight: w, weightedPts };
      });

      const productsWeightSum = products.reduce((acc, p) => acc + Number(p.weight || 0), 0);
      const totalConfiguredWeight = Number(cfg.platformWeight || 0) + Number(cfg.attendanceWeight || 0) + productsWeightSum;
      const finalGrade = Math.max(0, Math.min(100, platformWeighted + attendanceWeighted + productsWeightedTotal));

      return {
        totalAssignments: allAssignments.length,
        gradedAssignmentsCount,
        platformAvg,
        platformWeight: Number(cfg.platformWeight || 0),
        platformWeighted,
        studentAttendanceCount,
        effectiveTotalDays,
        totalRecordedDays,
        attendancePct,
        attendanceWeight: Number(cfg.attendanceWeight || 0),
        attendanceWeighted,
        productBreakdown,
        productsWeightSum,
        productsWeightedTotal,
        totalConfiguredWeight,
        finalGrade
      };
    }

    // ==================== INTEGRACIÓN BASE44: GRUPOS, RANKING, PARCIALES Y HERRAMIENTAS DOCENTES ====================
    function getAllGroups() {
      const dbGroups = Array.isArray(appState.db.groups) ? appState.db.groups : [];
      const map = new Map();
      dbGroups.forEach(g => {
        if (g && g.key) map.set(g.key, g);
      });
      // Asegurar que cualquier grupo usado por un estudiante exista en pestañas
      (appState.db.students || []).forEach(s => {
        if (isDemoStudentRecord(s)) return;
        const sGroups = Array.isArray(s.groups) && s.groups.length ? s.groups : [s.group || '1A'];
        sGroups.forEach(gk => {
          const clean = String(gk || '').trim();
          if (clean && !map.has(clean)) {
            map.set(clean, {
              key: clean,
              label: clean,
              courseIds: (appState.db.courses || []).map(c => c.id),
              updatedAt: 1
            });
          }
        });
      });
      if (map.size === 0) {
        const def = { key: '1A', label: '1°A · General', courseIds: (appState.db.courses || []).map(c => c.id), updatedAt: 1 };
        map.set('1A', def);
      }
      return Array.from(map.values());
    }

    function getGroupByKey(groupKey) {
      return getAllGroups().find(g => g.key === groupKey) || getAllGroups()[0] || null;
    }

    function getCoursesForGroup(groupKey) {
      const grp = getGroupByKey(groupKey);
      const allCourses = appState.db.courses || [];
      if (!grp || !Array.isArray(grp.courseIds) || grp.courseIds.length === 0) return allCourses;
      const filtered = allCourses.filter(c => grp.courseIds.includes(c.id));
      return filtered.length > 0 ? filtered : allCourses;
    }

    function getStudentsInGroup(groupKey) {
      return (appState.db.students || [])
        .filter(s => {
          if (isDemoStudentRecord(s)) return false;
          const gList = Array.isArray(s.groups) && s.groups.length ? s.groups : [s.group];
          return gList.includes(groupKey) || s.group === groupKey;
        })
        .sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'es'));
    }

    function computeGroupSubjectMaxes(groupKey) {
      const students = getStudentsInGroup(groupKey);
      const courses = getCoursesForGroup(groupKey);
      const maxes = {};
      courses.forEach(c => {
        let maxVal = 0;
        students.forEach(s => {
          const ev = calculateStudentCourseEvaluation(c, s.id);
          if (ev.platformAvg > maxVal) maxVal = ev.platformAvg;
        });
        maxes[c.id] = Math.max(maxVal, 100);
      });
      return maxes;
    }

    function computeStudentGroupSummary(student, groupKey) {
      const courses = getCoursesForGroup(groupKey);
      if (!student || courses.length === 0) {
        return { coursesBreakdown: [], averageGrade: 0, platformAvg: 0, attendancePct: 0, productsAvg: 0 };
      }
      let sumFinal = 0;
      let sumPlat = 0;
      let sumAtt = 0;
      let sumProd = 0;
      const coursesBreakdown = courses.map(c => {
        const ev = calculateStudentCourseEvaluation(c, student.id);
        sumFinal += ev.finalGrade;
        sumPlat += ev.platformAvg;
        sumAtt += ev.attendancePct;
        sumProd += ev.productsWeightSum > 0 ? (ev.productsWeightedTotal / ev.productsWeightSum) * 100 : 0;
        return { course: c, ev };
      });
      const n = courses.length;
      return {
        coursesBreakdown,
        averageGrade: sumFinal / n,
        platformAvg: sumPlat / n,
        attendancePct: sumAtt / n,
        productsAvg: sumProd / n
      };
    }

    function getGradeToneBadgeClass(grade) {
      if (grade >= 70) return 'bg-emerald-100 text-emerald-700 border border-emerald-200';
      if (grade >= 60) return 'bg-amber-100 text-amber-700 border border-amber-200';
      return 'bg-rose-100 text-rose-700 border border-rose-200';
    }

    function getGradeToneGradient(grade) {
      if (grade >= 70) return 'from-emerald-500 to-emerald-600';
      if (grade >= 60) return 'from-amber-500 to-amber-600';
      return 'from-rose-500 to-red-600';
    }

    function buildRankingList(groupKey = 'ALL') {
      const groups = getAllGroups();
      const targetStudents = groupKey === 'ALL'
        ? (appState.db.students || []).filter(s => !isDemoStudentRecord(s))
        : getStudentsInGroup(groupKey);

      const scored = targetStudents.map(stu => {
        const grp = groupKey === 'ALL' ? (stu.group || groups[0]?.key || '1A') : groupKey;
        const summary = computeStudentGroupSummary(stu, grp);
        return {
          student: stu,
          groupKey: grp,
          grade: summary.averageGrade,
          platformAvg: summary.platformAvg
        };
      });

      return scored
        .sort((a, b) => b.grade - a.grade || a.student.name.localeCompare(b.student.name, 'es'))
        .slice(0, 10);
    }

              const grpCourses = getCoursesForGroup(groupKey);

                  c.updatedAt = now;

              });
              closeModal();
              renderMain();

          </div>
        </div>`,
        () => {
          document.getElementById('btn-csv-cancel').addEventListener('click', closeModal);
          const fileInp = document.getElementById('csv-file-input');
          const txtArea = document.getElementById('csv-text-area');

          fileInp.addEventListener('change', e => {
            const f = e.target.files?.[0];
            if (!f) return;
            const reader = new FileReader();
            reader.onload = ev => { txtArea.value = String(ev.target.result || ''); };
            reader.readAsText(f);
          });

          document.getElementById('btn-csv-import').addEventListener('click', async () => {
            const raw = txtArea.value.trim();
            if (!raw) {
              showToast('Pega o carga al menos un registro CSV', 'error');
              return;
            }
            const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            const grpCourses = getCoursesForGroup(groupKey);
            const now = Date.now();
            let added = 0;

            lines.forEach((line, idx) => {
              const cols = line.split(/[,;\t]/).map(c => c.trim().replace(/^"|"$/g, ''));
              const name = cols[0];
              if (!name || (idx === 0 && /nombre/i.test(name))) return;
              const phone = cols[1] || '';
              const baseUser = (cols[2] || name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '.').replace(/^\.|\.$/g, '')).slice(0, 22);
              let username = baseUser || `alu${Date.now().toString(36).slice(-4)}${idx}`;
              if ((appState.db.students || []).some(s => s.username.toLowerCase() === username.toLowerCase())) {
                username = `${username}.${Math.floor(10 + Math.random() * 89)}`;
              }
              const genCode = (cols[3] || `PUMA${Math.floor(1000 + Math.random() * 9000)}`).toUpperCase();
              const stu = normalizeStudentRecord({
                id: uid('stu'),
                name,
                username,
                phone,
                group: groupKey,
                groups: [groupKey],
                password: genCode,
                accessCode: genCode,
                updatedAt: now + idx
              });
              appState.db.students.push(stu);
              grpCourses.forEach(c => {
                if (!c.enrolledStudentIds.includes(stu.id)) c.enrolledStudentIds.push(stu.id);
                c.updatedAt = now;
              });
              added += 1;
            });

            closeModal();
            renderMain();
            await saveState(true);
            showToast(`${added} estudiante(s) importados a ${grp.label}`, 'success');
          });
        },
        'max-w-xl'
      );
    }

    function copyTextFallback(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        return true;
      } catch (e) {
        return false;
      }
    }

    function openPartialBackupModal(groupKey) {
      const grp = getGroupByKey(groupKey);
      const students = getStudentsInGroup(groupKey);
      const grpCourses = getCoursesForGroup(groupKey);
      if (!grp) return;

      const existingBackups = (appState.db.partialBackups || []).filter(b => b.groupKey === groupKey);

      openModal(
        `📦 Nuevo Parcial y Respaldo en Nube · ${grp.label}`,
        `<div class="space-y-4">
          <div class="p-3.5 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-950 leading-relaxed">
            Guarda una fotografía completa de las calificaciones actuales de <strong>${esc(grp.label)}</strong> en la nube antes de iniciar un nuevo parcial. Opcionalmente puedes reiniciar los puntajes de productos y captura rápida para comenzar en limpio el siguiente parcial.
          </div>
          <form id="form-partial-backup" class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Nombre del Parcial a Archivar</label>
              <input id="pb-name" type="text" required value="Parcial ${existingBackups.length + 1} (${esc(getTodayFormatted())})" class="w-full px-3 py-2 rounded-xl border text-xs font-bold" />
            </div>
            <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
              <input id="pb-reset-chk" type="checkbox" class="rounded" />
              <span>Reiniciar calificaciones de productos y puntos rápidos de este grupo para iniciar el nuevo parcial</span>
            </label>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold cursor-pointer">📦 Archivar Parcial en la Nube</button>
          </form>

          <div class="pt-3 border-t space-y-2">
            <h4 class="text-xs font-bold text-slate-700">Historial de Parciales Archivados (${existingBackups.length})</h4>
            ${
              existingBackups.length === 0
                ? `<p class="text-xs text-slate-400 italic">Aún no hay parciales archivados para este grupo.</p>`
                : `<div class="space-y-2 max-h-48 overflow-y-auto">
                    ${existingBackups
                      .map(b => `<div class="p-2.5 rounded-xl bg-slate-50 border flex items-center justify-between gap-2 text-xs">
                        <div>
                          <strong class="text-slate-900">${esc(b.partialName)}</strong>
                          <p class="text-[11px] text-slate-500">${esc(b.createdAt)} · ${(b.records || []).length} estudiantes</p>
                        </div>
                        <button type="button" data-dl-backup="${esc(b.id)}" class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-bold cursor-pointer">⬇ CSV</button>
                      </div>`)
                      .join('')}
                  </div>`
            }
          </div>
        </div>`,
        () => {
          document.getElementById('form-partial-backup').addEventListener('submit', async e => {
            e.preventDefault();
            const partialName = document.getElementById('pb-name').value.trim();
            const shouldReset = document.getElementById('pb-reset-chk').checked;
            const now = Date.now();

            const records = students.map(stu => {
              const sum = computeStudentGroupSummary(stu, groupKey);
              return {
                studentId: stu.id,
                studentName: stu.name,
                averageGrade: Number(sum.averageGrade.toFixed(1)),
                courses: sum.coursesBreakdown.map(cb => ({
                  courseId: cb.course.id,
                  courseTitle: cb.course.title,
                  finalGrade: Number(cb.ev.finalGrade.toFixed(1))
                }))
              };
            });

            if (!Array.isArray(appState.db.partialBackups)) appState.db.partialBackups = [];
            appState.db.partialBackups.unshift({
              id: uid('pb'),
              groupKey,
              groupLabel: grp.label,
              partialName,
              createdAt: `${getTodayFormatted()} ${getNowTimeShort()}`,
              createdAtTs: now,
              records
            });

            if (shouldReset) {
              students.forEach(stu => {
                grpCourses.forEach(c => {
                  if (stu.manualPoints && stu.manualPoints[c.id]) {
                    stu.manualPoints[c.id] = { points: null, updatedAt: now };
                  }
                  (c.products || []).forEach(p => setProductScoreValue(c, p.id, stu.id, null));
                  c.updatedAt = now;
                });
                stu.updatedAt = now;
              });
            }

            closeModal();
            renderMain();
            await saveState(true);
            showToast(`Parcial "${partialName}" respaldado en la nube`, 'success');
          });

          document.querySelectorAll('[data-dl-backup]').forEach(btn => {
            btn.addEventListener('click', () => {
              const b = (appState.db.partialBackups || []).find(x => x.id === btn.getAttribute('data-dl-backup'));
              if (!b) return;
              const lines = ['Estudiante,Promedio Final'];
              (b.records || []).forEach(r => {
                lines.push(`"${String(r.studentName || '').replace(/"/g, '""')}",${r.averageGrade}`);
              });
              const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `Respaldo_${b.groupKey}_${b.partialName.replace(/[^a-zA-Z0-9_-]/g, '_')}.csv`;
              document.body.appendChild(a);
              a.click();
              a.remove();
              URL.revokeObjectURL(url);
            });
          });
        },
        'max-w-xl'
      );
    }

    // ==================== SISTEMA DE VIDEOCONFERENCIA EN VIVO (DOCENTE -> ESTUDIANTES) + CHAT EN VIVO ====================
    const liveState = {
      courseId: null,
      role: null, // 'teacher' | 'student'
      isBroadcasting: false,
      isWatching: false,
      peer: null,
      hostPeerId: '',
      localStream: null,
      screenStream: null,
      activeStream: null,
      remoteStream: null,
      micEnabled: true,
      camEnabled: true,
      isScreenSharing: false,
      sessionTitle: '',
      startedAt: 0,
      viewerConnections: new Map(), // peerId -> { conn, call, studentId, studentName, joinedAt }
      studentDataConn: null,
      studentMediaCall: null,
      chatMessages: [],
      remoteRoom: null,
      pollTimer: null,
      clockTimer: null,
      audioCtx: null,
      audioMeterFrame: null
    };

    function getLiveRoomKvKey(courseId) {
      const cfg = getCloudConfig();
      const space = (cfg.gistId || DEFAULT_PUBLIC_GIST_ID || 'puma_default').replace(/[^a-zA-Z0-9_-]/g, '');
      const cleanCourse = String(courseId || 'default').replace(/[^a-zA-Z0-9_-]/g, '');
      return `puma_live_room_${space}_${cleanCourse}`;
    }

    function getLiveChatKvKey(courseId) {
      const cfg = getCloudConfig();
      const space = (cfg.gistId || DEFAULT_PUBLIC_GIST_ID || 'puma_default').replace(/[^a-zA-Z0-9_-]/g, '');
      const cleanCourse = String(courseId || 'default').replace(/[^a-zA-Z0-9_-]/g, '');
      return `puma_live_chat_${space}_${cleanCourse}`;
    }

    async function fetchLiveRoomCloud(courseId) {
      try {
        const key = getLiveRoomKvKey(courseId);
        const res = await fetchWithTimeout(`${REALTIME_ATT_API}/${encodeURIComponent(key)}?_t=${Date.now()}`, {
          headers: { Accept: 'application/json' }
        }, 3000);
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function pushLiveRoomCloud(courseId, roomPayload) {
      try {
        const key = getLiveRoomKvKey(courseId);
        const res = await fetchWithTimeout(`${REALTIME_ATT_API}/${encodeURIComponent(key)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(roomPayload)
        }, 3000);
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    async function fetchLiveChatCloud(courseId) {
      try {
        const key = getLiveChatKvKey(courseId);
        const res = await fetchWithTimeout(`${REALTIME_ATT_API}/${encodeURIComponent(key)}?_t=${Date.now()}`, {
          headers: { Accept: 'application/json' }
        }, 3000);
        if (!res.ok) return null;
        const data = await res.json();
        return Array.isArray(data) ? data : null;
      } catch (e) {
        return null;
      }
    }

    async function pushLiveChatCloud(courseId, messages) {
      try {
        const key = getLiveChatKvKey(courseId);
        const trimmed = (messages || []).slice(-120);
        const res = await fetchWithTimeout(`${REALTIME_ATT_API}/${encodeURIComponent(key)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(trimmed)
        }, 3000);
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    function isRemoteRoomCurrentlyLive(room) {
      if (!room || !room.active || !room.hostPeerId) return false;
      const age = Date.now() - Number(room.heartbeatTs || room.startedAt || 0);
      return age < 65000;
    }

    function mergeLiveChatList(existingList = [], incomingList = []) {
      const map = new Map();
      [...(existingList || []), ...(incomingList || [])].forEach(m => {
        if (!m || !m.id) return;
        map.set(m.id, m);
      });
      return Array.from(map.values())
        .sort((a, b) => Number(a.ts || 0) - Number(b.ts || 0))
        .slice(-120);
    }

    function stopLiveAudioMeter() {
      if (liveState.audioMeterFrame) {
        cancelAnimationFrame(liveState.audioMeterFrame);
        liveState.audioMeterFrame = null;
      }
      if (liveState.audioCtx) {
        try { liveState.audioCtx.close(); } catch (e) {}
        liveState.audioCtx = null;
      }
    }

    function startTeacherAudioMeter(stream) {
      stopLiveAudioMeter();
      if (!stream || stream.getAudioTracks().length === 0) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        liveState.audioCtx = ctx;
        const src = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 64;
        src.connect(analyser);
        const dataArr = new Uint8Array(analyser.frequencyBinCount);

        const tick = () => {
          const bar = document.getElementById('live-mic-level-bar');
          if (!bar || !liveState.isBroadcasting) {
            stopLiveAudioMeter();
            return;
          }
          if (!liveState.micEnabled) {
            bar.style.width = '0%';
          } else {
            analyser.getByteFrequencyData(dataArr);
            let sum = 0;
            for (let i = 0; i < dataArr.length; i++) sum += dataArr[i];
            const avg = sum / dataArr.length;
            const pct = Math.min(100, Math.round((avg / 140) * 100));
            bar.style.width = `${pct}%`;
          }
          liveState.audioMeterFrame = requestAnimationFrame(tick);
        };
        tick();
      } catch (e) {}
    }

    function formatLiveDuration(startedAt) {
      if (!startedAt) return '00:00';
      const secTotal = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
      const h = Math.floor(secTotal / 3600);
      const m = Math.floor((secTotal % 3600) / 60);
      const s = secTotal % 60;
      const pad = n => String(n).padStart(2, '0');
      return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    }

    function stopLiveConferenceSession({ notifyCloud = false } = {}) {
      const prevCourseId = liveState.courseId;
      const wasTeacherLive = liveState.role === 'teacher' && liveState.isBroadcasting;

      if (liveState.pollTimer) {
        clearInterval(liveState.pollTimer);
        liveState.pollTimer = null;
      }
      if (liveState.clockTimer) {
        clearInterval(liveState.clockTimer);
        liveState.clockTimer = null;
      }
      stopLiveAudioMeter();

      if (wasTeacherLive) {
        liveState.viewerConnections.forEach(entry => {
          try { entry.conn?.send({ type: 'LIVE_ENDED' }); } catch (e) {}
          try { entry.call?.close(); } catch (e) {}
          try { entry.conn?.close(); } catch (e) {}
        });
      }
      liveState.viewerConnections.clear();

      if (liveState.studentMediaCall) {
        try { liveState.studentMediaCall.close(); } catch (e) {}
        liveState.studentMediaCall = null;
      }
      if (liveState.studentDataConn) {
        try { liveState.studentDataConn.close(); } catch (e) {}
        liveState.studentDataConn = null;
      }
      if (liveState.peer) {
        try { liveState.peer.destroy(); } catch (e) {}
        liveState.peer = null;
      }
      if (liveState.screenStream) {
        liveState.screenStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
        liveState.screenStream = null;
      }
      if (liveState.localStream) {
        liveState.localStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
        liveState.localStream = null;
      }

      liveState.activeStream = null;
      liveState.remoteStream = null;
      liveState.isBroadcasting = false;
      liveState.isWatching = false;
      liveState.isScreenSharing = false;
      liveState.micEnabled = true;
      liveState.camEnabled = true;
      liveState.hostPeerId = '';
      liveState.startedAt = 0;

      if (notifyCloud && wasTeacherLive && prevCourseId) {
        pushLiveRoomCloud(prevCourseId, {
          active: false,
          courseId: prevCourseId,
          endedAt: Date.now(),
          heartbeatTs: 0
        });
      }
    }

    function updateLiveViewersUi() {

              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>${esc(v.studentName)}
            </span>`)

              <span class="text-[10px] text-slate-400">${esc(m.time || '')}</span>

    async function sendLiveChatMessage(courseId, text, kind = 'chat') {
      const clean = String(text || '').trim();
      if (!clean || !appState.session) return;

      const msg = {
        id: uid('lchat'),
        senderId: appState.session.user.id,
        senderName: appState.session.user.name,
        role: appState.session.role,
        kind,
        text: clean,
        time: getNowTimeShort(),
        ts: Date.now()
      };

      liveState.chatMessages = mergeLiveChatList(liveState.chatMessages, [msg]);
      renderLiveChatMessagesOnly();

      // Envío instantáneo por canales P2P si existen
      if (liveState.role === 'teacher') {
        liveState.viewerConnections.forEach(entry => {
          try { entry.conn?.send({ type: 'CHAT_MSG', message: msg }); } catch (e) {}
        });
      } else if (liveState.studentDataConn && liveState.studentDataConn.open) {
        try { liveState.studentDataConn.send({ type: 'CHAT_MSG', message: msg }); } catch (e) {}
      }

      // Respaldo persistente en tiempo real en KVDB
      const remoteChat = await fetchLiveChatCloud(courseId);
      if (remoteChat) {
        liveState.chatMessages = mergeLiveChatList(remoteChat, liveState.chatMessages);
      }
      await pushLiveChatCloud(courseId, liveState.chatMessages);
      renderLiveChatMessagesOnly();
    }

    function startLivePolling(courseId, role) {
      if (liveState.pollTimer) clearInterval(liveState.pollTimer);
      liveState.pollTimer = setInterval(async () => {
        if (document.hidden || appState.activeView !== 'course-detail' || appState.courseTab !== 'live') return;

        // 1. Sincronizar mensajes de chat desde KVDB
        const remoteChat = await fetchLiveChatCloud(courseId);
        if (remoteChat) {
          const prevLen = liveState.chatMessages.length;
          const prevLast = liveState.chatMessages[prevLen - 1]?.id || '';
          const merged = mergeLiveChatList(remoteChat, liveState.chatMessages);
          const nextLast = merged[merged.length - 1]?.id || '';
          if (merged.length !== prevLen || nextLast !== prevLast) {
            liveState.chatMessages = merged;
            renderLiveChatMessagesOnly();
          }
        }

        // 2. Heartbeat del docente o detección en vivo del estudiante
        if (role === 'teacher' && liveState.isBroadcasting && liveState.hostPeerId) {
          const course = getCourseById(courseId);
          await pushLiveRoomCloud(courseId, {
            active: true,
            hostPeerId: liveState.hostPeerId,
            courseId,
            courseTitle: course ? course.title : courseId,
            teacherName: appState.session.user.name,
            title: liveState.sessionTitle || (course ? course.title : 'Clase en Vivo'),
            startedAt: liveState.startedAt,
            startedTime: getNowTimeShort(),
            heartbeatTs: Date.now(),
            screenSharing: liveState.isScreenSharing,
            viewersCount: liveState.viewerConnections.size
          });
        } else if (role === 'student') {
          const room = await fetchLiveRoomCloud(courseId);
          const prevHost = liveState.remoteRoom?.hostPeerId || '';
          const prevLive = isRemoteRoomCurrentlyLive(liveState.remoteRoom);
          liveState.remoteRoom = room;
          const nowLive = isRemoteRoomCurrentlyLive(room);
          updateLiveViewersUi();

          const statusBanner = document.getElementById('student-live-status-text');
          const connectBtn = document.getElementById('btn-student-join-live');
          if (nowLive) {
            if (statusBanner && !liveState.isWatching) {
              statusBanner.innerHTML = `<span class="text-emerald-400 font-bold">🔴 ¡El docente está transmitiendo en vivo!</span> · "${esc(room.title || 'Clase en Vivo')}"`;
            }
            if (connectBtn) {
              connectBtn.disabled = false;
              connectBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
            // Si el docente reinició transmisión con nuevo hostPeerId mientras el alumno veía, reconectar
            if (liveState.isWatching && room.hostPeerId !== prevHost) {
              const c = getCourseById(courseId);
              if (c) connectStudentToLiveBroadcast(c, room);
            }
          } else {
            if (prevLive && liveState.isWatching) {
              handleStudentStreamEnded('El docente ha finalizado la clase en vivo.');
            } else if (statusBanner && !liveState.isWatching) {
              statusBanner.textContent = 'Esperando a que el docente inicie la transmisión en vivo...';
            }
          }
        }
      }, 2500);
    }

    async function replaceBroadcastVideoTrack(newTrack) {
      if (!newTrack) return;
      liveState.viewerConnections.forEach(entry => {
        try {
          const pc = entry.call && entry.call.peerConnection;
          if (!pc) return;
          const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
          if (sender) {
            sender.replaceTrack(newTrack);
          }
        } catch (e) {}
      });
    }

    async function startTeacherLiveBroadcast(course) {
      if (typeof window.Peer === 'undefined') {
        showToast('No se cargó el motor de videoconferencia (PeerJS). Verifica tu conexión.', 'error');
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showToast('Tu navegador no permite acceso a cámara/micrófono en este entorno.', 'error');
        return;
      }

      const titleInput = document.getElementById('inp-live-session-title');
      const sessionTitle = (titleInput ? titleInput.value.trim() : '') || `Clase en Vivo · ${course.title}`;

      let stream = null;
      let hasVideo = true;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
      } catch (err) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
          hasVideo = false;
          showToast('Cámara no detectada: transmitiendo solo audio (puedes compartir pantalla).', 'info');
        } catch (err2) {
          showToast('Permiso denegado o sin micrófono/cámara disponible.', 'error');
          return;
        }
      }

      stopLiveConferenceSession({ notifyCloud: false });
      liveState.courseId = course.id;
      liveState.role = 'teacher';
      liveState.localStream = stream;
      liveState.activeStream = stream;
      liveState.camEnabled = hasVideo;
      liveState.micEnabled = true;
      liveState.isScreenSharing = false;
      liveState.sessionTitle = sessionTitle;
      liveState.startedAt = Date.now();
      liveState.isBroadcasting = true;

      const cleanId = String(course.id || 'c').replace(/[^a-zA-Z0-9]/g, '').slice(0, 14);
      const desiredPeerId = `pumasteam-${cleanId}-${Date.now().toString(36)}`;

      const peer = new window.Peer(desiredPeerId, {
        debug: 0,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });
      liveState.peer = peer;

      const tabPanel = document.getElementById('course-tab-panel');
      if (tabPanel) renderCourseLiveConferenceTab(tabPanel, course);

      const videoEl = document.getElementById('live-video-player');
      if (videoEl) {
        videoEl.srcObject = stream;
        videoEl.muted = true;
        videoEl.play().catch(() => {});
      }
      startTeacherAudioMeter(stream);

      peer.on('open', async peerId => {
        liveState.hostPeerId = peerId;
        await pushLiveRoomCloud(course.id, {
          active: true,
          hostPeerId: peerId,
          courseId: course.id,
          courseTitle: course.title,
          teacherName: appState.session.user.name,
          title: sessionTitle,
          startedAt: liveState.startedAt,
          startedTime: getNowTimeShort(),
          heartbeatTs: Date.now(),
          screenSharing: false,
          viewersCount: 0
        });
        await sendLiveChatMessage(course.id, `🔴 El docente inició la videoconferencia: "${sessionTitle}"`, 'system');
        showToast('Transmisión en vivo iniciada. Los estudiantes ya pueden conectarse.', 'success');
      });

      peer.on('connection', conn => {
        const meta = conn.metadata || {};
        const entry = {
          conn,
          call: null,
          studentId: meta.studentId || conn.peer,
          studentName: meta.studentName || 'Estudiante',
          joinedAt: getNowTimeShort()
        };
        liveState.viewerConnections.set(conn.peer, entry);
        updateLiveViewersUi();

        const sendStreamToViewer = () => {
          if (!liveState.activeStream || !liveState.peer || liveState.peer.destroyed) return;
          try {
            if (entry.call) {
              try { entry.call.close(); } catch (e) {}
            }
            entry.call = liveState.peer.call(conn.peer, liveState.activeStream);
          } catch (e) {}
        };

        conn.on('open', () => {
          sendStreamToViewer();
          try {
            conn.send({ type: 'CHAT_SYNC', messages: liveState.chatMessages.slice(-80) });
          } catch (e) {}
        });

        conn.on('data', async data => {
          if (!data || typeof data !== 'object') return;
          if (data.type === 'REQUEST_STREAM') {
            if (data.studentName) entry.studentName = data.studentName;
            updateLiveViewersUi();
            sendStreamToViewer();
          } else if (data.type === 'CHAT_MSG' && data.message) {
            liveState.chatMessages = mergeLiveChatList(liveState.chatMessages, [data.message]);
            renderLiveChatMessagesOnly();
            // Retransmitir al resto de estudiantes conectados
            liveState.viewerConnections.forEach((other, otherId) => {
              if (otherId !== conn.peer) {
                try { other.conn?.send({ type: 'CHAT_MSG', message: data.message }); } catch (e) {}
              }
            });
            pushLiveChatCloud(course.id, liveState.chatMessages);
          }
        });

        conn.on('close', () => {
          try { entry.call?.close(); } catch (e) {}
          liveState.viewerConnections.delete(conn.peer);
          updateLiveViewersUi();
        });

        conn.on('error', () => {
          liveState.viewerConnections.delete(conn.peer);
          updateLiveViewersUi();
        });
      });

      peer.on('error', err => {
        showToast(`Aviso de conexión de video (${err?.type || 'red'}). El chat en vivo sigue activo.`, 'info');
      });

      startLivePolling(course.id, 'teacher');
      if (liveState.clockTimer) clearInterval(liveState.clockTimer);
      liveState.clockTimer = setInterval(() => {
        const el = document.getElementById('live-duration-clock');
        if (el && liveState.isBroadcasting) {
          el.textContent = formatLiveDuration(liveState.startedAt);
        }
      }, 1000);
    }

    async function toggleTeacherScreenShare(course) {
      if (!liveState.isBroadcasting || !liveState.localStream) return;
      const videoEl = document.getElementById('live-video-player');

      if (liveState.isScreenSharing) {
        if (liveState.screenStream) {
          liveState.screenStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
          liveState.screenStream = null;
        }
        liveState.isScreenSharing = false;
        liveState.activeStream = liveState.localStream;
        const camTrack = liveState.localStream.getVideoTracks()[0];
        if (camTrack) await replaceBroadcastVideoTrack(camTrack);
        if (videoEl) {
          videoEl.srcObject = liveState.localStream;
          videoEl.play().catch(() => {});
        }
        const btn = document.getElementById('btn-live-toggle-screen');
        if (btn) {
          btn.textContent = '🖥️ Compartir Pantalla';
          btn.className = 'px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold cursor-pointer';
        }
        showToast('Volviste a transmitir tu cámara', 'info');
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        showToast('Tu navegador no soporta compartir pantalla.', 'error');
        return;
      }

      try {
        const scrStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
        const scrTrack = scrStream.getVideoTracks()[0];
        liveState.screenStream = scrStream;
        liveState.isScreenSharing = true;

        const combined = new MediaStream([
          scrTrack,
          ...liveState.localStream.getAudioTracks()
        ]);
        liveState.activeStream = combined;
        await replaceBroadcastVideoTrack(scrTrack);

        if (videoEl) {
          videoEl.srcObject = combined;
          videoEl.play().catch(() => {});
        }

        const btn = document.getElementById('btn-live-toggle-screen');
        if (btn) {
          btn.textContent = '🛑 Dejar de Compartir';
          btn.className = 'px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold cursor-pointer';
        }
        showToast('Compartiendo pantalla con todos los estudiantes', 'success');

        scrTrack.onended = () => {
          if (liveState.isScreenSharing) toggleTeacherScreenShare(course);
        };
      } catch (e) {
        showToast('Compartir pantalla cancelado', 'info');
      }
    }

    function handleStudentStreamEnded(reasonMsg) {

        try { liveState.studentDataConn.close(); } catch (e) {}
        liveState.studentDataConn = null;

      liveState.remoteStream = null;
      liveState.isWatching = false;

      if (videoEl) videoEl.srcObject = null;
      const overlay = document.getElementById('student-video-overlay');
      if (overlay) overlay.classList.remove('hidden');
      const statusText = document.getElementById('student-live-status-text');
      if (statusText) statusText.textContent = reasonMsg || 'Transmisión finalizada.';
      showToast(reasonMsg || 'La clase en vivo ha finalizado', 'info');

    async function connectStudentToLiveBroadcast(course, roomState) {
      if (typeof window.Peer === 'undefined') {
        showToast('No se cargó el motor de video en vivo (PeerJS).', 'error');
        return;
      }
      const room = roomState || (await fetchLiveRoomCloud(course.id));
      liveState.remoteRoom = room;
      if (!isRemoteRoomCurrentlyLive(room)) {
        showToast('El docente aún no ha iniciado la transmisión en vivo.', 'info');
        return;
      }

      if (liveState.studentMediaCall) {
        try { liveState.studentMediaCall.close(); } catch (e) {}
      }
      if (liveState.studentDataConn) {
        try { liveState.studentDataConn.close(); } catch (e) {}
      }
      if (liveState.peer) {
        try { liveState.peer.destroy(); } catch (e) {}
      }

      const statusText = document.getElementById('student-live-status-text');
      if (statusText) statusText.textContent = 'Conectando audio y video con el docente...';

      const peer = new window.Peer(undefined, {
        debug: 0,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });
      liveState.peer = peer;
      liveState.courseId = course.id;
      liveState.role = 'student';
      liveState.isWatching = true;

      peer.on('call', incomingCall => {
        liveState.studentMediaCall = incomingCall;
        // El estudiante responde sin enviar cámara/micrófono (solo recibe audio y video del docente)
        incomingCall.answer();
        incomingCall.on('stream', remoteStream => {
          liveState.remoteStream = remoteStream;
          const videoEl = document.getElementById('live-video-player');
          const overlay = document.getElementById('student-video-overlay');
          const unmuteOverlay = document.getElementById('student-unmute-overlay');
          if (overlay) overlay.classList.add('hidden');
          if (videoEl) {
            videoEl.srcObject = remoteStream;
            videoEl.muted = false;
            videoEl.play().then(() => {
              if (unmuteOverlay) unmuteOverlay.classList.add('hidden');
            }).catch(() => {
              // Si el navegador bloquea autoplay con audio, reproducir en silencio y mostrar botón de activar audio
              videoEl.muted = true;
              videoEl.play().catch(() => {});
              if (unmuteOverlay) unmuteOverlay.classList.remove('hidden');
            });
          }
          const badge = document.getElementById('live-connection-badge');
          if (badge) {
            badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500 pulse-dot inline-block mr-1.5"></span>EN VIVO · Audio y Video Activos`;
          }
          showToast('Conectado a la clase en vivo del docente', 'success');
        });

        incomingCall.on('close', () => {
          handleStudentStreamEnded('Se cerró la señal de video del docente.');
        });
      });

      peer.on('open', () => {
        const conn = peer.connect(room.hostPeerId, {
          reliable: true,
          metadata: {
            studentId: appState.session.user.id,
            studentName: appState.session.user.name
          }
        });
        liveState.studentDataConn = conn;

        conn.on('open', () => {
          conn.send({
            type: 'REQUEST_STREAM',
            studentId: appState.session.user.id,
            studentName: appState.session.user.name
          });
        });

        conn.on('data', data => {
          if (!data || typeof data !== 'object') return;
          if (data.type === 'CHAT_SYNC' && Array.isArray(data.messages)) {
            liveState.chatMessages = mergeLiveChatList(liveState.chatMessages, data.messages);
            renderLiveChatMessagesOnly();
          } else if (data.type === 'CHAT_MSG' && data.message) {
            liveState.chatMessages = mergeLiveChatList(liveState.chatMessages, [data.message]);
            renderLiveChatMessagesOnly();
          } else if (data.type === 'LIVE_ENDED') {
            handleStudentStreamEnded('El docente ha finalizado la videoconferencia.');
          }
        });

        conn.on('error', () => {
          if (statusText && !liveState.remoteStream) {
            statusText.textContent = 'No se pudo conectar directo al video. Pulsa "Reconectar" o usa el chat en vivo.';
          }
        });
      });

      peer.on('error', () => {
        if (statusText && !liveState.remoteStream) {
          statusText.textContent = 'Esperando señal del docente... Pulsa "Conectar a Clase en Vivo" para reintentar.';
        }
      });
    }

    async function callGeminiTextOrHtml(promptText, temperature = 0.4) {
      const apiKey = getGeminiApiKey();
      if (!apiKey) return '';
      const models = ['gemini-2.5-flash', 'gemini-2.0-flash'];

      for (const modelName of models) {
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(apiKey)}`;
          const res = await fetchWithTimeout(
            url,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: promptText }] }],
                generationConfig: { temperature }
              })
            },
            14000
          );
          if (res.ok) {
            const data = await res.json();
            const candidateText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (candidateText) {
              return candidateText
                .replace(/^```html\s*/i, '')
                .replace(/^```\s*/i, '')
                .replace(/\s*```$/i, '')
                .trim();
            }
          }
        } catch (e) {}
      }
      return '';
    }

      const prompt = `Actúa como un docente experto de bachillerato en la Plataforma PUMA STEAM (Cananea, Sonora).
