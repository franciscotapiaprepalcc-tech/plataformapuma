      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.courses) && Array.isArray(parsed.students)) {
              if (!Array.isArray(parsed.attendance)) parsed.attendance = [];
              if (!Array.isArray(parsed.submissions)) parsed.submissions = [];
              return parsed;
            }
          }
        } catch (e) {
          // Fallback to in-memory default
        }
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }

      const appState = {
        db: loadState(),
        session: null,
        authMode: 'login',
        activeView: 'dashboard',

        lastSyncTime: ''

      function getCloudConfig() {
        let cfg = { token: DEFAULT_GITHUB_TOKEN, gistId: DEFAULT_PUBLIC_GIST_ID };
        try {
          const raw = localStorage.getItem(CLOUD_CONFIG_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.token) cfg.token = parsed.token;
            if (parsed.gistId) cfg.gistId = parsed.gistId;
          }
        } catch (e) {}
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const urlGist = urlParams.get('gist');
          if (urlGist) cfg.gistId = urlGist.trim();
        } catch (e) {}
        return cfg;
      }

      function saveCloudConfig(token, gistId) {
        try {
          localStorage.setItem(
            CLOUD_CONFIG_KEY,
            JSON.stringify({ token: String(token || '').trim(), gistId: String(gistId || '').trim() })
          );
        } catch (e) {}
      }

      let activeGistIdMemory = DEFAULT_PUBLIC_GIST_ID;
      let syncLockPromise = Promise.resolve();

      function buildGitHubHeaders(token, hasBody = false) {
        const headers = { Accept: 'application/vnd.github+json' };
        const clean = String(token || '').trim();
        if (clean) {
          headers['Authorization'] = `token ${clean}`;
        }
        if (hasBody) {
          headers['Content-Type'] = 'application/json';
        }
        return headers;
      }

      async function resolveSharedGistId(cfg) {
        if (cfg.gistId) {
          activeGistIdMemory = cfg.gistId;
          return cfg.gistId;
        }
        if (activeGistIdMemory) {
          return activeGistIdMemory;
        }
        if (!cfg.token) return '';
        try {
          const res = await fetch(`https://api.github.com/gists?per_page=50&_t=${Date.now()}`, {
            headers: buildGitHubHeaders(cfg.token, false)
          });
          if (!res.ok) return '';
          const list = await res.json();
          if (Array.isArray(list)) {
            const found = list.find(g => g.files && g.files['puma_steam_db.json']);
            if (found && found.id) {
              activeGistIdMemory = found.id;
              cfg.gistId = found.id;
              saveCloudConfig(cfg.token, found.id);
              return found.id;
            }
          }
        } catch (e) {}
        return '';
      }

      function isUserTyping() {
        const active = document.activeElement;
        if (!active) return false;
        const tag = active.tagName;
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
      }

      function updateRealtimeIndicator() {
        const badge = document.getElementById('realtime-sync-badge');
        if (badge) {

        }
      }

      function refreshOpenAttendanceModalIfVisible() {
        const attList = document.getElementById('att-today-list');
        const courseIdAttr = attList ? attList.getAttribute('data-att-course-id') : null;
        if (!attList || !courseIdAttr) return;
        const todayStr = getTodayFormatted();
        const todayRecords = (appState.db.attendance || []).filter(
          a => a.courseId === courseIdAttr && a.date === todayStr
        );
        const countEl = document.getElementById('att-today-count');
        if (countEl) {
          countEl.textContent = `Asistencias registradas hoy (${todayRecords.length})`;
        }
        attList.innerHTML =
          todayRecords.length === 0
            ? '<p class="text-xs text-slate-400">Ningún estudiante ha escaneado el código todavía.</p>'
            : todayRecords
                .map(
                  r => `
                <div class="flex items-center justify-between px-3 py-2 rounded-lg bg-slate-50 border border-slate-100 text-xs">
                  <span class="font-semibold text-slate-900">${esc(r.studentName)}</span>
                  <span class="text-slate-500">${esc(r.time)}</span>
                </div>
              `
                )
                .join('');
      }

      async function pullFromCloud(silent = true, skipRender = false) {
        const cfg = getCloudConfig();
        const gistId = await resolveSharedGistId(cfg);
        if (!gistId) {
          if (cfg.token) {
            await pushToCloud(true);
          }
          return false;
        }
        try {
          let res = await fetch(`https://api.github.com/gists/${encodeURIComponent(gistId)}?_t=${Date.now()}`, {
            headers: buildGitHubHeaders(cfg.token, false)
          });
          if (res.status === 401 || res.status === 403) {
            res = await fetch(`https://api.github.com/gists/${encodeURIComponent(gistId)}?_t=${Date.now()}`, {
              headers: { Accept: 'application/vnd.github+json' }
            });
          }
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }
          const data = await res.json();
          const fileObj = data.files && (data.files['puma_steam_db.json'] || Object.values(data.files)[0]);
          if (fileObj && fileObj.content) {
            const parsed = JSON.parse(fileObj.content);
            if (parsed && Array.isArray(parsed.courses) && Array.isArray(parsed.students)) {
              if (!Array.isArray(parsed.attendance)) parsed.attendance = [];
              if (!Array.isArray(parsed.submissions)) parsed.submissions = [];
              const prevJson = JSON.stringify(appState.db);
              const nextJson = JSON.stringify(parsed);
              appState.lastSyncTime = new Date().toTimeString().slice(0, 5);
              if (prevJson === nextJson) {
                if (!silent) showToast('La plataforma ya está al día', 'info');
                updateRealtimeIndicator();
                return false;
              }
              appState.db = parsed;
              try {
                localStorage.setItem(STORAGE_KEY, nextJson);
              } catch (e) {}
              if (!silent) showToast('Datos sincronizados desde la nube', 'success');
              if (!skipRender) {
                if (appState.session) {
                  const modalOpen = !document.getElementById('modal-root').classList.contains('hidden');
                  if (!modalOpen && !isUserTyping()) {
                    renderMain();
                  } else {
                    refreshOpenAttendanceModalIfVisible();
                  }
                } else if (!isUserTyping()) {
                  renderAuth();
                }
              }
              updateRealtimeIndicator();
              return true;
            }
          }
        } catch (e) {
          if (!silent) showToast('No se pudo cargar desde la nube. Verifica el token o conexión.', 'error');
        }
        return false;
      }

      function pushToCloud(silent = true) {
        syncLockPromise = syncLockPromise
          .then(async () => {
            const cfg = getCloudConfig();
            if (!cfg.token) return false;
            appState.cloudSyncing = true;
            try {
              const gistId = await resolveSharedGistId(cfg);
              const payload = {
                description: 'PLATAFORMA PUMA STEAM - Base de datos sincronizada',
                public: false,
                files: {
                  'puma_steam_db.json': {
                    content: JSON.stringify(appState.db, null, 2)
                  }
                }
              };
              const url = gistId
                ? `https://api.github.com/gists/${encodeURIComponent(gistId)}`
                : 'https://api.github.com/gists';
              const method = gistId ? 'PATCH' : 'POST';
              const res = await fetch(url, {
                method,
                headers: buildGitHubHeaders(cfg.token, true),
                body: JSON.stringify(payload)
              });
              if (!res.ok) {
                throw new Error(`HTTP ${res.status}`);
              }
              const data = await res.json();
              if (data.id) {
                activeGistIdMemory = data.id;
                if (data.id !== gistId) {
                  saveCloudConfig(cfg.token, data.id);
                }
              }
              appState.lastSyncTime = new Date().toTimeString().slice(0, 5);
              updateRealtimeIndicator();
              if (!silent) showToast('Datos guardados en la nube de GitHub', 'success');
              return true;
            } catch (e) {
              if (!silent) showToast('Error al sincronizar con GitHub. Revisa tu token en Sincronización Nube.', 'error');
              return false;
            } finally {
              appState.cloudSyncing = false;
            }
          })
          .catch(() => false);
        return syncLockPromise;
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.db));
        } catch (e) {
          // Ignore storage quota / sandbox restriction
        }
        const cfg = getCloudConfig();
        if (cfg.token) {
          pushToCloud(true);
        }
      }

      function uid(prefix) {
        return prefix + '-' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
      }

      function esc(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        const colors = {
          success: 'bg-emerald-600 text-white',
          error: 'bg-rose-600 text-white',
          info: 'bg-navy-900 text-white'
        };
        const toast = document.createElement('div');
        toast.className = `pointer-events-auto rounded-xl px-4 py-3 text-sm font-medium shadow-lg flex items-center justify-between gap-3 fade-in ${colors[type] || colors.info}`;
        toast.innerHTML = `<span>${esc(message)}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = 'opacity 0.2s ease';
          setTimeout(() => toast.remove(), 220);
        }, 3200);
      }

      let activeQrScanner = null;

      function stopActiveQrScanner() {
        if (activeQrScanner) {
          const scannerRef = activeQrScanner;
          activeQrScanner = null;
          try {
            if (scannerRef.isScanning) {
              scannerRef.stop().then(() => {
                try { scannerRef.clear(); } catch (e) {}
              }).catch(() => {});
            } else {
              scannerRef.clear();
            }
          } catch (e) {}
        }
      }

      function openModal(title, bodyHtml, onMount, maxWidthClass = 'max-w-lg') {
        stopActiveQrScanner();
        const root = document.getElementById('modal-root');
        root.classList.remove('hidden');
        root.classList.add('flex');
        root.innerHTML = `
          <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full ${maxWidthClass} overflow-hidden fade-in my-auto">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-slate-50/70">
              <h3 class="text-base font-bold text-slate-900">${esc(title)}</h3>
              <button type="button" id="modal-close-btn" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200/60 transition" aria-label="Cerrar">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
            <div class="p-6 max-h-[78vh] overflow-y-auto">${bodyHtml}</div>
          </div>
        `;
        document.getElementById('modal-close-btn').addEventListener('click', closeModal);
        root.addEventListener('click', function backdropClick(e) {
          if (e.target === root) {
            closeModal();
            root.removeEventListener('click', backdropClick);
          }
        });
        if (typeof onMount === 'function') onMount();
      }

      function closeModal() {
        stopActiveQrScanner();
        const root = document.getElementById('modal-root');
        root.classList.add('hidden');
        root.classList.remove('flex');
        root.innerHTML = '';
      }

      async function handleLoginSubmit(e) {
        e.preventDefault();
        const user = document.getElementById('login-user').value.trim();
        const pass = document.getElementById('login-pass').value;
        const errBox = document.getElementById('login-error');
        const submitBtn = document.getElementById('btn-login-submit');

        if (user === ADMIN_USER && pass === ADMIN_PASS) {
          await pullFromCloud(true, true);
          appState.session = {
            role: 'admin',
            user: { id: 'admin', name: 'Mtro. Francisco J. Tapia López', username: ADMIN_USER }
          };
          appState.activeView = 'dashboard';
          showToast('Bienvenido, Mtro. Francisco', 'success');
          renderMain();
          return;
        }

        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Verificando en la nube...';
        }
        await pullFromCloud(true, true);
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Entrar a la plataforma';
        }

        const student = appState.db.students.find(
          s => s.username.toLowerCase() === user.toLowerCase() && s.password === pass
        );
        if (student) {
          appState.session = { role: 'student', user: student };
          appState.activeView = 'dashboard';
          showToast(`Bienvenido, ${student.name}`, 'success');
          renderMain();
          return;
        }

        errBox.textContent = 'Usuario o contraseña incorrectos. Verifica tus datos.';
        errBox.classList.remove('hidden');
      }

      async function handleRegisterSubmit(e) {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const username = document.getElementById('reg-user').value.trim();
        const group = document.getElementById('reg-group').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = 'aB123456.';
        const errBox = document.getElementById('reg-error');
        const regBtn = document.getElementById('btn-register-submit');

        if (username.toLowerCase() === ADMIN_USER.toLowerCase()) {
          errBox.textContent = 'Ese nombre de usuario está reservado para administración.';
          errBox.classList.remove('hidden');
          return;
        }

        if (regBtn) {
          regBtn.disabled = true;
          regBtn.textContent = 'Sincronizando registro...';
        }
        await pullFromCloud(true, true);
        if (regBtn) {
          regBtn.disabled = false;
          regBtn.textContent = 'Crear cuenta de estudiante';
        }

        const exists = appState.db.students.some(
          s => s.username.toLowerCase() === username.toLowerCase()
        );
        if (exists) {
          errBox.textContent = 'El usuario ya existe. Elige otro nombre de usuario o matrícula.';
          errBox.classList.remove('hidden');
          return;
        }

        const newStudent = {
          id: uid('stu'),
          name,
          username,
          password,
          email,
          group,
          createdAt: new Date().toISOString().slice(0, 10)
        };
        appState.db.students.push(newStudent);
        saveState();

        appState.session = { role: 'student', user: newStudent };
        appState.authMode = 'login';
        appState.activeView = 'catalog';
        showToast('¡Cuenta creada! Tu contraseña inicial es aB123456. (cámbiala en Mi Perfil).', 'success');
        renderMain();
      }

      function renderStudentDashboard() {
        const container = document.getElementById('view-content');
        const userId = appState.session.user.id;
        const myCourses = appState.db.courses.filter(c => c.enrolledStudentIds.includes(userId));
        const mySubs = appState.db.submissions.filter(s => s.studentId === userId);
        const gradedSubs = mySubs.filter(s => s.grade !== null && s.grade !== undefined);
        const avg = gradedSubs.length
          ? Math.round(gradedSubs.reduce((acc, s) => acc + Number(s.grade), 0) / gradedSubs.length)
          : '—';

        const pendingTasks = [];
        myCourses.forEach(c => {
          c.modules.forEach(m => {
            m.assignments.forEach(a => {
              if (!getSubmission(c.id, a.id, userId)) {
                pendingTasks.push({ course: c, assignment: a });
              }
            });
          });
        });

        container.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            ${statCard('Mis Cursos', myCourses.length, 'Materias inscritas', 'bg-blue-50 text-blue-700')}
            ${statCard('Tareas Pendientes', pendingTasks.length, 'Por entregar', 'bg-amber-50 text-amber-700')}
            ${statCard('Promedio General', avg, `${gradedSubs.length} actividades calificadas`, 'bg-emerald-50 text-emerald-700')}
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">

                myCourses.length === 0
                  ? `<div class="text-center py-8 bg-slate-50 rounded-xl border border-dashed border-slate-300">

                      <button type="button" id="stu-empty-catalog" class="px-4 py-2 rounded-xl bg-puma-500 text-white text-xs font-semibold cursor-pointer">Ir al catálogo de cursos</button>
                    </div>`
                  : `<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      ${myCourses
                        .map(
                          c => `
                        <div class="rounded-xl border border-slate-200 overflow-hidden hover:shadow-md transition flex flex-col">
                          <div class="h-2 bg-gradient-to-r ${c.color || 'from-blue-600 to-indigo-700'}"></div>
                          <div class="p-4 flex-1 flex flex-col justify-between">
                            <div>
                              <span class="text-[11px] font-bold text-slate-400">${esc(c.code)}</span>
                              <h3 class="text-sm font-bold text-slate-900 mt-0.5">${esc(c.title)}</h3>
                              <p class="text-xs text-slate-500 mt-1 line-clamp-2">${esc(c.description)}</p>
                            </div>
                            <button type="button" data-open-course="${c.id}" class="mt-4 w-full py-2 rounded-lg bg-navy-900 hover:bg-navy-800 text-white text-xs font-semibold cursor-pointer transition">
                              Entrar al curso
                            </button>
                          </div>
                        </div>`
                        )
                        .join('')}
                    </div>`
              }
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
              <h2 class="text-base font-bold text-slate-900 mb-4">Próximas Tareas</h2>
              ${
                pendingTasks.length === 0
                  ? '<p class="text-sm text-slate-500">No tienes tareas pendientes en tus cursos inscritos.</p>'
                  : `<div class="space-y-3">
                      ${pendingTasks
                        .map(
                          item => `
                        <div class="p-3.5 rounded-xl bg-amber-50/70 border border-amber-200/80">
                          <div class="text-[11px] font-bold text-amber-800">${esc(item.course.title)}</div>
                          <div class="text-sm font-semibold text-slate-900 mt-0.5">${esc(item.assignment.title)}</div>
                          <div class="flex items-center justify-between mt-2">
                            <span class="text-[11px] text-slate-500">Vence: ${esc(item.assignment.dueDate)}</span>
                            <button type="button" data-open-course="${item.course.id}" class="text-xs font-semibold text-puma-700 hover:underline cursor-pointer">Ir →</button>
                          </div>
                        </div>`
                        )
                        .join('')}
                    </div>`
              }
            </div>
          </div>
        `;

        const goCatalog = () => {
          appState.activeView = 'catalog';
          renderMain();
        };
        document.getElementById('stu-go-catalog').addEventListener('click', goCatalog);
        const emptyBtn = document.getElementById('stu-empty-catalog');
        if (emptyBtn) emptyBtn.addEventListener('click', goCatalog);

        container.querySelectorAll('[data-open-course]').forEach(btn => {
          btn.addEventListener('click', () => {
            appState.selectedCourseId = btn.getAttribute('data-open-course');
            appState.courseTab = 'content';
            appState.activeView = 'course-detail';
            renderMain();
          });
        });
      }

        const container = document.getElementById('view-content');
        const isAdmin = appState.session.role === 'admin';
        const userId = appState.session.user.id;

                  </div>

              </div>

        const topAttendanceBtn = document.getElementById('btn-courses-top-attendance');
        if (topAttendanceBtn) {
          topAttendanceBtn.addEventListener('click', () => {

                openAdminAttendanceModal(list[0]);

                openSelectCourseForAttendanceModal(list);

              openStudentAttendanceScannerModal(null);

        const filtered = appState.db.courses.filter(
          c =>

            c.code.toLowerCase().includes(q) ||
            c.category.toLowerCase().includes(q)
        );

        container.innerHTML = `
          <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-3">

                return `
                  <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm flex flex-col">

                      </div>
                    </div>
                  </div>
                `;
              })
              .join('')}
          </div>
        `;

        document.getElementById('catalog-search').addEventListener('input', e => {
          appState.searchQuery = e.target.value;
          renderCourseCatalog();
          const inp = document.getElementById('catalog-search');
          inp.focus();
          inp.setSelectionRange(inp.value.length, inp.value.length);

          btn.addEventListener('click', () => {
            const c = getCourseById(btn.getAttribute('data-enroll'));
            if (c && !c.enrolledStudentIds.includes(userId)) {
              c.enrolledStudentIds.push(userId);

              showToast(`Matriculado en ${c.title}`, 'success');

          btn.addEventListener('click', () => {

            appState.selectedCourseId = btn.getAttribute('data-open-course');
            appState.courseTab = 'content';

              const targetIdx = dir === 'up' ? idx - 1 : idx + 1;
              if (targetIdx < 0 || targetIdx >= course.modules.length) return;
              const tmp = course.modules[idx];
              course.modules[idx] = course.modules[targetIdx];

              saveState();
              renderCourseDetail();

            btn.addEventListener('click', () => openAddResourceModal(course, btn.getAttribute('data-add-res')));

            btn.addEventListener('click', () => openAddAssignmentModal(course, btn.getAttribute('data-add-assign')));

          container.querySelectorAll('[data-edit-assign]').forEach(btn => {
            btn.addEventListener('click', () => {
              const [modId, assignId] = btn.getAttribute('data-edit-assign').split('|');
              openEditAssignmentModal(course, modId, assignId);
            });
          });
          container.querySelectorAll('[data-del-assign]').forEach(btn => {
            btn.addEventListener('click', () => {
              const [modId, assignId] = btn.getAttribute('data-del-assign').split('|');
              openDeleteAssignmentModal(course, modId, assignId);
            });
          });
          container.querySelectorAll('[data-review-assign]').forEach(btn => {
            btn.addEventListener('click', () => {
              appState.activeView = 'grades';
              renderMain();
            });
          });
        } else {
          container.querySelectorAll('[data-submit-assign]').forEach(btn => {
            btn.addEventListener('click', () => openSubmitAssignmentModal(course, btn.getAttribute('data-submit-assign')));
          });
        }
      }

            const email = document.getElementById('ans-email').value.trim();

              errBox.textContent = 'Ese usuario está reservado para administración.';
              errBox.classList.remove('hidden');
              return;

              errBox.classList.remove('hidden');

      function openStudentAttendanceScannerModal(courseContext) {
        const student = appState.session.user;

        openModal('Tomar Asistencia — Escáner QR', `
          <div id="scanner-view-body" class="space-y-4">
            <p class="text-sm text-slate-600 text-center">
              Apunta la cámara de tu dispositivo hacia el código QR proyectado por tu profesor.
            </p>

            <div class="rounded-2xl overflow-hidden border-2 border-slate-200 bg-slate-900 min-h-[260px] flex items-center justify-center relative">
              <div id="qr-reader" class="w-full"></div>
            </div>

            <div id="scanner-status" class="text-center text-xs font-medium text-slate-500">
              Iniciando cámara...
            </div>

            <div class="pt-3 border-t border-slate-200">
              <details class="text-xs text-slate-500">
                <summary class="cursor-pointer font-semibold text-slate-600 hover:text-navy-900">¿Tu dispositivo no tiene cámara? Ingresar código manualmente</summary>
                <form id="manual-att-form" class="mt-2.5 flex gap-2">
                  <input id="manual-att-code" type="text" required placeholder="Pega el código proyectado..." class="flex-1 rounded-xl border border-slate-300 px-3 py-2 text-xs text-slate-800" />
                  <button type="submit" class="px-3.5 py-2 rounded-xl bg-navy-900 text-white text-xs font-semibold cursor-pointer">Registrar</button>
                </form>
              </details>
            </div>
          </div>
        `, () => {
          function processScannedPayload(rawText) {
            const parts = String(rawText || '').trim().split('|');
            if (parts[0] !== 'PUMA_ASISTENCIA' || parts.length < 3) {
              showToast('El código QR escaneado no corresponde a una asistencia válida.', 'error');
              return false;
            }
            const scannedCourseId = parts[1];
            const scannedDate = parts[2];
            const targetCourse = getCourseById(scannedCourseId) || courseContext;

            if (!Array.isArray(appState.db.attendance)) appState.db.attendance = [];
            const already = appState.db.attendance.find(
              a => a.courseId === scannedCourseId && a.date === scannedDate && a.studentId === student.id
            );
            if (!already) {
              const nowTime = new Date().toTimeString().slice(0, 5);
              appState.db.attendance.push({
                id: uid('att'),
                courseId: scannedCourseId,
                courseTitle: targetCourse ? targetCourse.title : scannedCourseId,
                studentId: student.id,
                studentName: student.name,
                date: scannedDate,
                time: nowTime
              });
              saveState();
            }

            stopActiveQrScanner();
            const body = document.getElementById('scanner-view-body');
            if (body) {
              body.innerHTML = `
                <div class="py-6 px-4 text-center fade-in">
                  <div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4">
                    <svg class="w-9 h-9" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                    </svg>
                  </div>
                  <h3 class="text-lg sm:text-xl font-extrabold text-slate-900 leading-snug mb-2">
                    ${esc(student.name)}, Asistencia del dia ${esc(scannedDate)} ha sido registrada.
                  </h3>
                  ${targetCourse ? `<p class="text-xs font-semibold text-emerald-700 mb-5">Curso: ${esc(targetCourse.title)}</p>` : '<div class="mb-5"></div>'}
                  <button type="button" id="btn-att-done" class="px-6 py-2.5 rounded-xl bg-navy-900 hover:bg-navy-800 text-white text-sm font-semibold cursor-pointer">
                    Aceptar
                  </button>
                </div>
              `;
              document.getElementById('btn-att-done').addEventListener('click', closeModal);
            }
            return true;
          }

          document.getElementById('manual-att-form').addEventListener('submit', e => {
            e.preventDefault();
            const val = document.getElementById('manual-att-code').value.trim();
            processScannedPayload(val);
          });

          const statusEl = document.getElementById('scanner-status');
          if (typeof Html5Qrcode === 'undefined') {
            statusEl.textContent = 'No se pudo cargar el lector de cámara. Usa el registro manual abajo.';
            return;
          }

          const html5QrCode = new Html5Qrcode('qr-reader');
          activeQrScanner = html5QrCode;
          html5QrCode.start(
            { facingMode: 'environment' },
            { fps: 10, qrbox: { width: 230, height: 230 } },
            decodedText => {
              processScannedPayload(decodedText);
            },
            () => {}
          ).then(() => {
            if (statusEl) statusEl.textContent = 'Cámara activa. Apunta al código QR del proyector.';
          }).catch(() => {
            if (statusEl) statusEl.textContent = 'No se pudo acceder a la cámara. Verifica los permisos o usa el registro manual.';
          });
        }, 'max-w-lg');
      }

      // ==================== CALENDARIO DE ENTREGAS ====================
      function getAssignmentsByDateMap(courses) {
        const map = {};
        courses.forEach(c => {
          (c.modules || []).forEach(m => {
            (m.assignments || []).forEach(a => {
              if (!a.dueDate) return;
              if (!map[a.dueDate]) map[a.dueDate] = [];
              map[a.dueDate].push({ course: c, module: m, assignment: a });
            });
          });
        });
        return map;
      }

      function renderAssignmentsCalendarHtml(courses) {
        const year = appState.calYear;
        const month = appState.calMonth;
        const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
        const firstDay = new Date(year, month, 1);
        const startOffset = (firstDay.getDay() + 6) % 7;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const dueMap = getAssignmentsByDateMap(courses);
        const selected = appState.calSelectedDate;
        const selectedTasks = dueMap[selected] || [];

        const cells = [];
        for (let i = 0; i < startOffset; i++) {
          cells.push('<div class="h-12 sm:h-14 rounded-xl bg-slate-50/50"></div>');
        }
        for (let d = 1; d <= daysInMonth; d++) {
          const mm = String(month + 1).padStart(2, '0');
          const dd = String(d).padStart(2, '0');
          const iso = `${year}-${mm}-${dd}`;
          const tasks = dueMap[iso] || [];
          const isSelected = selected === iso;
          const hasTasks = tasks.length > 0;
          cells.push(`
            <button type="button" data-cal-day="${iso}"
              class="h-12 sm:h-14 rounded-xl border p-1.5 flex flex-col items-center justify-between transition cursor-pointer ${
                isSelected
                  ? 'border-puma-500 bg-puma-50 ring-2 ring-puma-500/30'
                  : hasTasks
                    ? 'border-blue-200 bg-blue-50/60 hover:bg-blue-100/60'
                    : 'border-slate-100 bg-white hover:bg-slate-50'
              }">
              <span class="text-xs font-bold ${isSelected ? 'text-puma-700' : 'text-slate-800'}">${d}</span>
              ${
                hasTasks
                  ? `<span class="px-1.5 py-0.5 rounded-full bg-puma-500 text-white text-[10px] font-bold leading-none">${tasks.length}</span>`
                  : '<span class="h-3"></span>'
              }
            </button>
          `);
        }

        const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
        const monthTasks = Object.keys(dueMap)
          .filter(k => k.startsWith(monthPrefix))
          .sort()
          .flatMap(k => dueMap[k]);

        return `
          <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <div>
              <h2 class="text-base font-bold text-slate-900">Calendario de Entregas</h2>
              <p class="text-xs text-slate-500">Haz clic en un día para ver las actividades programadas.</p>
            </div>
            <div class="flex items-center gap-2">
              <button type="button" id="cal-prev-month" class="px-2.5 py-1 rounded-lg border border-slate-300 hover:bg-slate-50 text-xs font-bold text-slate-700 cursor-pointer">←</button>
              <span class="text-sm font-bold text-slate-900 min-w-[130px] text-center">${monthNames[month]} ${year}</span>
              <button type="button" id="cal-next-month" class="px-2.5 py-1 rounded-lg border border-slate-300 hover:bg-slate-50 text-xs font-bold text-slate-700 cursor-pointer">→</button>
            </div>
          </div>

          <div class="grid grid-cols-7 gap-1.5 text-center text-[11px] font-bold uppercase text-slate-400 mb-1.5">
            <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
          </div>
          <div class="grid grid-cols-7 gap-1.5 mb-5">
            ${cells.join('')}
          </div>

          <div class="border-t border-slate-200 pt-4">
            <h3 class="text-xs font-bold uppercase tracking-wide text-slate-600 mb-2.5">
              Actividades para el ${esc(selected)} (${selectedTasks.length})
            </h3>
            ${
              selectedTasks.length === 0
                ? `<p class="text-xs text-slate-400 mb-3">No hay actividades programadas para esta fecha.${monthTasks.length ? ` Tienes ${monthTasks.length} entrega(s) en ${monthNames[month]}.` : ''}</p>`
                : `<div class="space-y-2">
                    ${selectedTasks.map(item => `
                      <div class="flex flex-wrap items-center justify-between gap-2 p-3 rounded-xl bg-slate-50 border border-slate-200">
                        <div>
                          <div class="text-[11px] font-bold text-puma-600">${esc(item.course.code)} · ${esc(item.course.title)}</div>
                          <div class="text-sm font-semibold text-slate-900">${esc(item.assignment.title)}</div>
                          <div class="text-[11px] text-slate-500">${esc(item.module.title)} · Valor: ${esc(item.assignment.maxPoints)} pts</div>
                        </div>
                        <button type="button" data-open-course="${item.course.id}" class="px-3 py-1.5 rounded-lg bg-navy-900 hover:bg-navy-800 text-white text-xs font-semibold cursor-pointer">
                          Abrir curso
                        </button>
                      </div>
                    `).join('')}
                  </div>`
            }
          </div>
        `;
      }

      function wireAssignmentsCalendarEvents(container) {
        const prevBtn = document.getElementById('cal-prev-month');
        const nextBtn = document.getElementById('cal-next-month');
        if (prevBtn) {
          prevBtn.addEventListener('click', () => {
            appState.calMonth -= 1;
            if (appState.calMonth < 0) {
              appState.calMonth = 11;
              appState.calYear -= 1;
            }
            renderAdminDashboard();
          });
        }
        if (nextBtn) {
          nextBtn.addEventListener('click', () => {
            appState.calMonth += 1;
            if (appState.calMonth > 11) {
              appState.calMonth = 0;
              appState.calYear += 1;
            }
            renderAdminDashboard();
          });
        }
        container.querySelectorAll('[data-cal-day]').forEach(btn => {
          btn.addEventListener('click', () => {
            appState.calSelectedDate = btn.getAttribute('data-cal-day');
            renderAdminDashboard();
          });
        });
      }

      // ==================== SINCRONIZACIÓN EN LA NUBE (GITHUB GIST) ====================
      function openCloudSyncModal() {
        const cfg = getCloudConfig();
        const isAdmin = appState.session.role === 'admin';
        const shareUrl = cfg.gistId
          ? `${window.location.origin}${window.location.pathname}?gist=${encodeURIComponent(cfg.gistId)}`
          : '';

        openModal('Sincronización Multi-Dispositivo (Nube GitHub)', `
          <div class="space-y-4">
            <p class="text-xs text-slate-600 leading-relaxed">
              Todos los cursos, estudiantes, entregas y asistencias se sincronizan automáticamente en tiempo real con el <strong>GitHub Gist</strong> compartido.
            </p>
            <form id="cloud-sync-form" class="space-y-3">
              ${
                isAdmin
                  ? `<div>
                      <label class="block text-xs font-semibold text-slate-600 mb-1">Token de GitHub (con permiso <code>gist</code>)</label>
                      <input id="cloud-token" type="password" value="${esc(cfg.token)}" placeholder="ghp_..." class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs font-mono" />
                    </div>`
                  : ''
              }
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">ID de Gist compartido</label>
                <input id="cloud-gist-id" type="text" value="${esc(cfg.gistId)}" placeholder="ID del Gist compartido" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs font-mono" />
              </div>
              <div class="flex flex-wrap gap-2 pt-1">
                ${
                  isAdmin
                    ? `<button type="submit" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold cursor-pointer">Guardar y Subir a la Nube</button>`
                    : ''
                }
                <button type="button" id="btn-cloud-pull" class="px-4 py-2 rounded-xl bg-navy-900 hover:bg-navy-800 text-white text-xs font-semibold cursor-pointer">Descargar de la Nube</button>
              </div>
            </form>

            ${
              shareUrl
                ? `<div class="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-1.5">
                    <div class="text-[11px] font-bold text-slate-700">Enlace directo para cualquier dispositivo:</div>
                    <div class="flex items-center gap-2">
                      <input id="cloud-share-url" type="text" readonly value="${esc(shareUrl)}" class="flex-1 rounded-lg border border-slate-300 bg-white px-2.5 py-1.5 text-[11px] font-mono text-slate-700" />
                      <button type="button" id="btn-copy-share-url" class="px-3 py-1.5 rounded-lg bg-puma-500 text-white text-xs font-semibold cursor-pointer">Copiar</button>
                    </div>
                  </div>`
                : ''
            }
          </div>
        `, () => {
          const form = document.getElementById('cloud-sync-form');
          if (form) {
            form.addEventListener('submit', async e => {
              e.preventDefault();
              const tokenEl = document.getElementById('cloud-token');
              const token = tokenEl ? tokenEl.value.trim() : cfg.token;
              const gistId = document.getElementById('cloud-gist-id').value.trim();
              saveCloudConfig(token, gistId);
              if (isAdmin && token) {
                const ok = await pushToCloud(false);
                if (ok) openCloudSyncModal();
              }
            });
          }
          document.getElementById('btn-cloud-pull').addEventListener('click', async () => {
            const gistId = document.getElementById('cloud-gist-id').value.trim();
            const tokenEl = document.getElementById('cloud-token');
            const token = tokenEl ? tokenEl.value.trim() : cfg.token;
            saveCloudConfig(token, gistId);
            await pullFromCloud(false);
          });
          const copyBtn = document.getElementById('btn-copy-share-url');
          if (copyBtn) {
            copyBtn.addEventListener('click', () => {
              const inp = document.getElementById('cloud-share-url');
              inp.select();
              try {
                navigator.clipboard.writeText(inp.value);
              } catch (e) {
                document.execCommand('copy');
              }
              showToast('Enlace copiado al portapapeles', 'success');
            });
          }
        });
      }

      // Initialize: cargar y sincronizar usuarios y cursos desde el Gist desde que se abre la app
      renderAuth();
      (async function initCloudBoot() {
        try {
          const initialCfg = getCloudConfig();
          if (initialCfg.token || initialCfg.gistId) {
            saveCloudConfig(initialCfg.token, initialCfg.gistId);
          }
          await pullFromCloud(true, true);
        } catch (e) {}
        appState.initialCloudReady = true;
        if (!appState.session) {
          renderAuth();
        } else {
          renderMain();
        }
      })();

      // Actualización automática en tiempo real cada 5 segundos y al volver a la pestaña
      setInterval(() => {
        if (document.hidden || appState.cloudSyncing) return;
        pullFromCloud(true, false);
      }, 5000);

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && !appState.cloudSyncing) {
          pullFromCloud(true, false);
        }
      });
    })();
  </script>
</body>
</html>
