            </div>

            <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
              <div class="px-6 py-4 border-b border-slate-200">
                <h2 class="text-base font-bold text-slate-900">Historial de Actividades de Secuencias (Plataforma)</h2>
              </div>
              ${
                mySubs.length === 0
                  ? '<div class="p-8 text-center text-sm text-slate-500">Aún no has enviado ninguna tarea de secuencia.</div>'
                  : `<div class="overflow-x-auto">
                      <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-xs uppercase text-slate-500 border-b border-slate-200">
                          <tr>
                            <th class="px-5 py-3">Curso</th>
                            <th class="px-5 py-3">Actividad</th>
                            <th class="px-5 py-3">Fecha de envío</th>
                            <th class="px-5 py-3">Calificación</th>
                            <th class="px-5 py-3">Retroalimentación</th>
                          </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                          ${mySubs
                            .map(s => {
                              const course = getCourseById(s.courseId);
                              let assignTitle = 'Actividad';
                              let maxPts = 100;
                              if (course) {
                                (course.modules || []).forEach(m => {
                                  const found = (m.assignments || []).find(a => a.id === s.assignmentId);
                                  if (found) {
                                    assignTitle = found.title;
                                    maxPts = found.maxPoints;
                                  }
                                });
                              }
                              return `
                                <tr>
                                  <td class="px-5 py-3.5 font-semibold text-slate-900">${esc(course?.title || 'Curso')}</td>
                                  <td class="px-5 py-3.5 text-slate-700">${esc(assignTitle)}</td>
                                  <td class="px-5 py-3.5 text-xs text-slate-500">${esc(s.submittedAt)}</td>
                                  <td class="px-5 py-3.5">
                                    ${
                                      s.grade !== null && s.grade !== undefined
                                        ? `<span class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 text-xs font-bold">${esc(s.grade)} / ${esc(maxPts)}</span>`
                                        : `<span class="px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-semibold">En revisión</span>`
                                    }
                                  </td>
                                  <td class="px-5 py-3.5 text-xs text-slate-600">${esc(s.feedback || '—')}</td>
                                </tr>
                              `;
                            })
                            .join('')}
                        </tbody>
                      </table>
                    </div>`
              }
            </div>
          </div>
        `;

        container.querySelectorAll('[data-open-course-gb]').forEach(btn => {
          btn.addEventListener('click', () => {
            appState.selectedCourseId = btn.getAttribute('data-open-course-gb');
            appState.courseTab = 'gradebook';
            appState.activeView = 'course-detail';
            renderMain();
          });
        });
      }

      // ==================== CALENDARIO ESCOLAR (HORARIO HERMOSILLO) ====================
      function renderCalendar() {
        const container = document.getElementById('view-content');
        const courses = getVisibleCourses();
        const assignments = getAllAssignmentsForCourses(courses);

        container.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
              <div>
                <h2 class="text-base font-bold text-slate-900">Calendario de Actividades de Secuencias</h2>
                <p class="text-xs text-slate-500">Zona horaria oficial: Hermosillo, Sonora (${esc(getSonoraISODate())})</p>
              </div>
            </div>
            ${
              assignments.length === 0
                ? '<p class="text-sm text-slate-500">No hay actividades programadas.</p>'
                : `<div class="space-y-2.5">
                    ${assignments
                      .sort((a, b) => String(a.dueDate).localeCompare(String(b.dueDate)))
                      .map(
                        a => `
                        <div class="flex flex-wrap items-center justify-between gap-3 p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                          <div>
                            <span class="text-xs font-bold text-puma-600">${esc(a.courseCode)} · ${esc(a.courseTitle)}</span>
                            <div class="text-sm font-bold text-slate-900">${esc(a.title)}</div>
                            <div class="text-xs text-slate-500">${esc(a.moduleTitle)}</div>
                          </div>
                          <div class="text-right">
                            <span class="px-3 py-1 rounded-full bg-white border border-slate-200 text-xs font-bold text-slate-800">
                              Fecha límite: ${esc(a.dueDate)}
                            </span>
                          </div>
                        </div>
                      `
                      )
                      .join('')}
                  </div>`
            }
          </div>
        `;
      }

      // ==================== PERFIL DEL ESTUDIANTE ====================
      function renderStudentProfile() {
        const container = document.getElementById('view-content');
        const stu = appState.session.user;

        container.innerHTML = `
          <div class="max-w-xl mx-auto bg-white rounded-2xl border border-slate-200 p-6 shadow-xs space-y-5">
            <div>
              <h2 class="text-base font-bold text-slate-900">Mi Perfil de Estudiante</h2>
              <p class="text-xs text-slate-500">Actualiza tus datos o cambia tu contraseña de acceso.</p>
            </div>
            <form id="profile-form" class="space-y-3.5">
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre Completo</label>
                <input id="pf-name" type="text" required value="${esc(stu.name)}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">Grupo</label>
                  <input id="pf-group" type="text" required value="${esc(stu.group)}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">Nueva Contraseña</label>
                  <input id="pf-pass" type="password" required value="${esc(stu.password)}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
                </div>
              </div>
              <button type="submit" class="px-5 py-2.5 rounded-xl bg-puma-500 hover:bg-puma-600 text-white text-xs font-bold cursor-pointer">
                Guardar Cambios
              </button>
            </form>
          </div>
        `;

        document.getElementById('profile-form').addEventListener('submit', async e => {
          e.preventDefault();
          const target = getStudentById(stu.id);
          if (!target) return;
          target.name = document.getElementById('pf-name').value.trim();
          target.group = document.getElementById('pf-group').value.trim();
          target.password = document.getElementById('pf-pass').value;
          target.mustChangePassword = false;
          target.updatedAt = Date.now();
          appState.session.user = target;
          await saveState({ isStructural: false });
          renderMain();
          showToast('Perfil actualizado y sincronizado', 'success');
        });
      }

      // ==================== CONFIGURACIÓN DE NUBE (ADMIN) ====================
      function openCloudSettingsModal() {
        const cfg = getCloudConfig();
        openModal('Sincronización en Tiempo Real (KVDB + GitHub Gist)', `
          <form id="cloud-cfg-form" class="space-y-4">
            <div class="p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 text-xs text-emerald-800">
              <strong>Canal Primario KVDB Activo:</strong> Las asistencias, secuencias y calificaciones se sincronizan cada 2 segundos en tiempo real entre todos los dispositivos.
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Gist ID Compartido</label>
              <input id="cc-gist" type="text" value="${esc(cfg.gistId)}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs font-mono" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Token Personal de GitHub (permiso gist)</label>
              <input id="cc-token" type="password" value="${esc(cfg.token)}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs font-mono" />
            </div>
            <div class="flex justify-end gap-2">
              <button type="button" id="cc-cancel" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700 cursor-pointer">Cerrar</button>
              <button type="submit" class="px-4 py-2 rounded-xl bg-navy-900 hover:bg-navy-800 text-white text-xs font-semibold cursor-pointer">Guardar y Sincronizar</button>
            </div>
          </form>
        `, () => {
          document.getElementById('cc-cancel').addEventListener('click', closeModal);
          document.getElementById('cloud-cfg-form').addEventListener('submit', async e => {
            e.preventDefault();
            saveCloudConfig(
              document.getElementById('cc-token').value.trim(),
              document.getElementById('cc-gist').value.trim()
            );
            closeModal();
            await syncNow({ push: true, silent: false, isStructural: true });
          });
        });
      }

      // ==================== ARRANQUE Y CICLO EN TIEMPO REAL ====================
      async function initCloudBoot() {
        renderAuth();
        await syncNow({ push: false, silent: true, skipRender: true });
        appState.initialCloudReady = true;
        if (!appState.session && !isUserTyping()) {
          renderAuth();
        } else if (appState.session) {
          refreshActiveViewSafely();
        }
      }

      initCloudBoot();

      setInterval(() => {
        if (document.hidden || appState.cloudSyncing) return;
        syncNow({ push: false, silent: true, skipRender: false });
      }, 2000);

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && !appState.cloudSyncing) {
          syncNow({ push: false, silent: true, skipRender: false });
        }
      });
    })();
  </script>
</body>
</html>
